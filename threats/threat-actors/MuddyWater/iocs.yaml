# ============================================================================
# Hunt queries
# ============================================================================
hunt_queries:

  - id: muddywater-hunt-dns-c2
    platform: splunk
    title: "Hunt for outbound DNS to MuddyWater 2026 domains"
    query_type: spl
    targets_indicators:
      - muddywater-domain-moonzonet
      - muddywater-domain-uploadfiler
      - muddywater-domain-adm-pulse
    query: |
      index=defenseclaw_local sourcetype=dns
      | eval domain=lower(query)
      | where domain IN (
          "moonzonet.com",
          "uploadfiler.com",
          "adm-pulse.com"
        )
      | stats count earliest(_time) latest(_time) by src, domain
      | sort - count
      # FP consideration: very low. Hits are operationally significant.

  - id: muddywater-hunt-ipv4-c2
    platform: splunk
    title: "Hunt for outbound to MuddyWater 2026 IPv4 IOCs"
    query_type: spl
    targets_indicators:
      - muddywater-ipv4-77-110-107-235
      - muddywater-ipv4-93-123-39-127
      - muddywater-ipv4-172-86-126-208
      - muddywater-ipv4-116-203-208-186
    query: |
      index=defenseclaw_local sourcetype=stream:tcp OR sourcetype=zeek_conn
      | where dest_ip IN ("77.110.107.235", "93.123.39.127", "172.86.126.208", "116.203.208.186")
           OR src_ip IN ("77.110.107.235", "93.123.39.127", "172.86.126.208", "116.203.208.186")
      | stats count earliest(_time) latest(_time) by src_ip, dest_ip, dest_port
      | sort - count
      # FP consideration: very low. Hits are operationally significant.

  - id: muddywater-hunt-teams-external-screenshare-mechanism
    platform: m365
    title: "Hunt for Teams meetings with screen-share initiated by external accounts (mechanism-level)"
    query_type: kql
    targets_indicators:
      - muddywater-behavioral-teams-it-support-screenshare
    note: "Mechanism-level hunt — applies regardless of attribution."
    query: |
      TeamsMeetings
      | where TimeGenerated > ago(90d)
      | where IsExternalParticipantPresent == true
      | where ScreenShareDuration > 0
      | where ExternalParticipantTenant !in (allowlisted_partner_tenants)
      | project TimeGenerated, OrganizerUser, ExternalParticipantUser, ExternalParticipantTenant, ScreenShareDuration
      | order by TimeGenerated desc
      // FP consideration: legitimate external-partner Teams collaborations.
      // Tune by maintaining an allowlist of partner tenants.

  - id: muddywater-hunt-mfa-device-add-mechanism
    platform: m365
    title: "Hunt for MFA device-add events (mechanism-level)"
    query_type: kql
    targets_indicators:
      - muddywater-behavioral-mfa-device-add-manipulation
    note: "Mechanism-level hunt — applies regardless of attribution."
    query: |
      AuditLogs
      | where TimeGenerated > ago(90d)
      | where OperationName in ("Add registered device", "Update authentication method", "User registered security info")
      | where InitiatedByActor != "Self-service password reset"
      | project TimeGenerated, OperationName, InitiatedBy, TargetResources, Result
      | order by TimeGenerated desc
      // FP consideration: legitimate device adds during normal user lifecycle.
      // Pair with sign-in anomaly correlation and recent password-reset signal.

  - id: muddywater-hunt-pythonw-suspended-process
    platform: edr
    title: "Hunt for pythonw.exe creating suspended child processes (long-running MuddyWater pattern)"
    query_type: pseudo
    targets_indicators:
      - muddywater-behavioral-pythonw-suspended-process-injection
    query: |
      ON ENDPOINTS:
        ALERT IF process_name = "pythonw.exe" creates_child_process_with(creation_flag = CREATE_SUSPENDED)
        AND child_process_memory_write_count > 0
      # FP consideration: legitimate developer tooling can match. Tune for
      # production endpoints (non-developer fleet); pair with parent-process
      # / user-context correlation.

  - id: muddywater-hunt-donald-gay-cert
    platform: edr
    title: "Hunt for Donald Gay code-signing certificate lineage on endpoints"
    query_type: pseudo
    targets_indicators:
      - muddywater-cert-donald-gay
    query: |
      ON ENDPOINTS:
        ENUMERATE binaries signed by Microsoft ID Verified CS AOC CA 02
        ALERT IF cert.subject_name = "Donald Gay" OR cert.thumbprint = "B674578D4BDB24CD58BF2DC884EAA658B7AA250C"
        ALERT IF cert.valid_window < 30 days AND cert.revoked = true
      # FP consideration: legitimate developer-signed binaries with short
      # cert validity; tune by issuing-CA + subject-pattern combination.

  - id: muddywater-hunt-game-exe-webview2-masquerade
    platform: edr
    title: "Hunt for Game.exe / WebView2 masquerade pattern"
    query_type: pseudo
    targets_indicators:
      - muddywater-sha256-game-exe
      - muddywater-sha256-webview2loader-dll
    query: |
      ON ENDPOINTS:
        ALERT IF binary_name = "Game.exe"
             OR (binary_loads_module("WebView2Loader.dll")
                 AND binary_path NOT IN known_microsoft_paths
                 AND binary_outbound_connection_to_non_microsoft_destination = true)
      # FP consideration: legitimate WebView2 use in non-standard paths;
      # tune for outbound destination as the high-confidence pivot.

  - id: muddywater-hunt-sha256-sweep
    platform: edr
    title: "Hunt for all 9 MuddyWater 2026 SHA256 hashes on endpoints"
    query_type: pseudo
    targets_indicators:
      - muddywater-sha256-game-exe
      - muddywater-sha256-ms-upd-exe
      - muddywater-sha256-visualwincomp
      - muddywater-sha256-webview2loader-dll
      - muddywater-sha256-webview2-exe
      - muddywater-sha256-dwagent-exe
      - muddywater-sha256-dwagsvc-exe
      - muddywater-sha256-dwaglnc-exe
      - muddywater-sha256-anydesk-exe
    query: |
      ON ENDPOINTS:
        SCAN file_hashes (-90d) for the 9 SHA256 hashes from MuddyWater Q2 2026 IOC set
        ALERT on match
      # FP consideration: legitimate-binary hashes (DWAgent, AnyDesk, WebView2)
      # may match in legitimate use. Pair hash-match with parent-process /
      # network anomaly correlation; do NOT treat hash-match alone as malicious
      # for the legitimate-binary set.

  - id: muddywater-hunt-onion-chaos-dls
    platform: splunk
    title: "Hunt for Chaos DLS facade onion address"
    query_type: spl
    targets_indicators:
      - muddywater-onion-chaos-dls-facade
    query: |
      index=defenseclaw_local sourcetype=tor_logs OR sourcetype=proxy
      | where url_or_query contains "hptqq2o2qjva7lcaaq67w36jihzivkaitkexorauw7b2yul2z6zozpqd"
      | stats count earliest(_time) latest(_time) by src_ip
      # FP consideration: very low. Hits are operationally significant.

