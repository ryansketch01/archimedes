hunt_queries:
  - id: llmshare-hunt-distribution-domain
    platform: splunk
    title: "LLMShare distribution domain — openew[.]app hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_host="*openew.app" OR domain="*openew.app"
        OR query="*openew.app" OR url="*openew.app*")
      | stats count by user, src_ip, dest_host, _time
      | sort -_time
    notes: >
      openew[.]app is purpose-built malware distribution; ANY hit from a
      US defense contractor environment warrants immediate investigation.

  - id: llmshare-hunt-sample-hashes
    platform: edr
    title: "LLMShare dropper samples — sha256 hunt (macOS + Windows)"
    query_type: pseudo_kql
    query: |
      DeviceFileEvents
      | where SHA256 in (
          "7e5b708f6659b1fad3aae7b589a706434fbf21708aeec5af5910189b96e25fef",
          "641526a22667a527290aac8c2c0358265d85c83318a7caca7cff28cecc2dbc16"
        )
      | project DeviceId, AccountName, Timestamp, FileName, FolderPath, SHA256
    notes: >
      Retro-hunt across endpoint telemetry for either sample hash.
      VM-aware on the Windows sample — bare-metal detection signal
      may differ from sandbox.

  - id: llmshare-hunt-chatgpt-share-link-redirector-context
    platform: splunk
    title: "LLMShare lure context — chatgpt.com/s/ → openew[.]app redirector pattern"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (referer="*chatgpt.com/s/*" AND (dest_host="*openew.app" OR url="*openew.app*"))
      | stats count by user, src_ip, referer, dest_host, _time
      | sort -_time
    notes: >
      CONTEXTUAL detection ONLY. chatgpt.com/s/ is the LEGITIMATE OpenAI
      share-link surface — never block. This query surfaces the specific
      malicious redirector pattern (chatgpt.com/s/ → openew[.]app) without
      false-positiving on legitimate ChatGPT share-link usage. Treat hits
      as high-fidelity indicators of the LLMShare lure chain.
