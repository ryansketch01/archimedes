  - id: apt34-password-filter-dll
    type: detection_pattern
    value: malicious_password_filter_dll
    description: |
      Earth Simnavaz (2024) deployed a malicious Windows password-filter DLL to
      capture plaintext credentials (T1556.002). Hunt: enumerate DLLs registered
      under HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification Packages on
      domain controllers and privileged hosts; alert on any package not on the
      approved baseline. Behavioral pattern, not a static hash IOC. Concrete
      artifact ratified this pass: psgfilter.dll (see apt34-filename-psgfilter-dll).
    provisional: true            # single-source (Trend Micro), live-ratified 2026-07-12
    ratified_single_source: true
    ratified_at: 2026-07-12
    related_filename: psgfilter.dll
    source_brief: trendmicro-earth-simnavaz-2024

# ============================================================================
# Hunt queries
# ============================================================================
hunt_queries:

  - id: apt34-hunt-dns-c2
    platform: splunk
    title: "Hunt for APT34 DNS-tunneling C2 patterns"
    query_type: spl
    query: |
      index=defenseclaw_local sourcetype=dns
      | eval subdomain_label=mvindex(split(query, "."), 0)
      | eval label_len=len(subdomain_label)
      | where label_len >= 30
      | stats count by src, query, label_len
      | sort - count
      # FP consideration: legitimate CDN, telemetry, AV vendor DNS may have
      # long subdomain labels — tune by allowlisting known-good resolvers.

  - id: apt34-hunt-exchange-transport-agent
    platform: edr
    title: "Hunt for unsigned or unfamiliar Exchange transport agents"
    query_type: pseudo
    query: |
      ON HOSTS WHERE role = exchange_server:
        ENUMERATE installed transport agents
        ALERT IF agent.signed = false OR agent.publisher NOT IN allowlist
      # FP consideration: legitimate hygiene/anti-spam vendors install agents.
      # Allowlist enterprise-approved publishers.

  - id: apt34-hunt-iis-module-integrity
    platform: edr
    title: "Hunt for new or modified IIS modules on perimeter web servers"
    query_type: pseudo
    query: |
      ON HOSTS WHERE role = web_server AND service = iis:
        BASELINE installed IIS modules with file hash
        ALERT IF new module added OR module file hash changed
        ALERT IF module is unsigned
      # FP consideration: legitimate patching/upgrades. Baseline must be
      # refreshed during scheduled change windows.

  - id: apt34-hunt-password-filter-dll
    platform: edr
    title: "Hunt for unapproved Windows password-filter DLLs (Earth Simnavaz T1556.002)"
    query_type: pseudo
    query: |
      ON HOSTS WHERE role IN (domain_controller, privileged_server):
        READ HKLM\SYSTEM\CurrentControlSet\Control\Lsa\Notification Packages
        FOR EACH package DLL:
          ALERT IF dll NOT IN approved_baseline
          ALERT IF dll IS unsigned OR dll path NOT IN %SystemRoot%\System32
      # FP consideration: legitimate password-complexity / PAM products register
      # notification packages. Allowlist enterprise-approved filter DLLs.
      # Provenance: tied to Earth Simnavaz 2024 reporting; pending direct-retrieval verification.

