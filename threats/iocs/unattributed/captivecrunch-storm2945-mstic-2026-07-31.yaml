# threats/iocs/unattributed/captivecrunch-storm2945-mstic-2026-07-31.yaml
#
# Unattributed cluster — 12 net-new IOCs from Microsoft Threat Intelligence
# (MSTIC) "CaptiveCrunch" disclosure, 2026-07-31. Storm-2945 compromises
# captive-portal / hospitality Wi-Fi worldwide for AitM device-code phishing
# (Entra ID device-code flow -> M365 collection) + malware delivery disguised
# as browser/OS updates (ClickFix).
#
# HARD RULE 2 — held UNATTRIBUTED on purpose. MSTIC assesses Storm-2945 as an
# operational sub-cluster of Midnight Blizzard (APT29 / Cozy Bear / SVR,
# roster #009) based on overlap with its Storm-2372 device-code cluster. That
# binding is SINGLE-SOURCE (MSTIC alone); single-source veto capped the finding
# at WEP "likely" (finding-2026-07-31-0002, digraph A2). ReliaQuest (2026-07-23,
# B) corroborates ONLY the doppelganger-domain / device-code AitM layer, NOT the
# Storm-2945 -> Midnight Blizzard attribution. These indicators are therefore
# kept in the unattributed bucket, NOT folded into an APT29 dossier, until
# actor-profiler scaffolds threats/threat-actors/APT29/ and makes the fold
# decision. Archimedes reports MSTIC's assessment, not established fact.
#
# HANDOFF: when actor-profiler scaffolds APT29 (#009) and folds the CaptiveCrunch
# increment, migrate these indicators to threats/threat-actors/APT29/iocs.yaml and
# retire this cluster file to avoid dual-listing (the index tolerates dual-listing;
# it is not desired here once the fold decision is made).

