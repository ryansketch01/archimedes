        base_score: 9.8
        severity: CRITICAL
        vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H"
      secondary_v3_1:
        base_score: 7.5
        severity: HIGH
        vector: "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N"
      v4_0: null                         # not present in NVD record as retrieved 2026-07-18
      source_provided_note: >
        finding-2026-07-18-0001 recorded "GHSA Critical vs CVE CVSS 7.5" as an
        UNRESOLVED discrepancy (NVD not directly retrieved at grading time).
        NVD direct-retrieval 2026-07-18 resolves it: primary NIST 9.8 CRITICAL +
        secondary 7.5 HIGH both present; GHSA "Critical" aligns with the 9.8
        primary. Recorded, consistent with GHSA classification.
    affected_versions:
      confirmed_nvd: "WordPress 6.9.0–6.9.4 (before 6.9.5); 7.0.0–7.0.1 (before 7.0.2)"   # NVD 2026-07-18
      source_provided_additional: "7.1 beta releases (per finding/Rapid7; not in NVD matrix as retrieved)"
    fixed_in: ["6.9.5", "7.0.2", "7.1 Beta 2"]   # 6.9.5 / 7.0.2 NVD-confirmed; 7.1 Beta 2 source-provided (finding)
