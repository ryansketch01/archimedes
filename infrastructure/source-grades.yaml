# ============================================================================
# Technical Enrichment Sources (dual-grade: facts vs. attribution)
# ============================================================================
technical_sources:
  - id: shodan
    name: "Shodan"
    category: enrichment
    grade_facts: A
    grade_attribution: F
    active: true
    rationale: "Authoritative on infrastructure state, no attribution ability"
    api_required: true
  
  - id: censys
    name: "Censys"
    category: enrichment
    grade_facts: A
    grade_attribution: F
    active: true
    rationale: "Same as Shodan"
    api_required: true
  
  - id: virustotal
    name: "VirusTotal"
    category: enrichment
    grade_facts: B
    grade_attribution: F
    active: true
    rationale: "Vendor consensus, false positives happen"
    api_required: true
  
  - id: urlscan
    name: "urlscan.io"
    category: enrichment
    grade_facts: B
    grade_attribution: F
    active: true
    rationale: "Accurate for what it captures, limited context"
    api_required: true
  
  - id: whois-rdap
    name: "WHOIS / RDAP"
    category: enrichment
    grade_facts: A
    grade_attribution: F
    active: true
    rationale: "Authoritative registration data"
  
  - id: hibp
    name: "Have I Been Pwned"
    category: enrichment
    grade_facts: A
    grade_attribution: F
    active: true
    rationale: "Pwned Passwords + breach list authoritative; attribution F"
    api_required: true
  
  - id: threatfox
    name: "ThreatFox (abuse.ch)"
    category: enrichment
    grade_facts: B
    grade_attribution: B
    active: true
    rationale: "Community-contributed, generally solid IOCs"
    api_required: true
  
  - id: malwarebazaar
    name: "MalwareBazaar (abuse.ch)"
    category: enrichment
    grade_facts: B
    grade_attribution: B
    active: true
    rationale: "Sample confirmed real, context varies"
    api_required: true
  
  - id: github-codesearch
    name: "GitHub Code Search"
    category: enrichment
    grade_facts: B
    grade_attribution: F
    active: true
    rationale: "Code presence yes, intent no"
    api_required: true
  
  - id: intelx
    name: "Intelligence X"
    category: enrichment
    grade_facts: C
    grade_attribution: C
    active: false
    rationale: "Aggregator, depends on original source"
    api_required: true
    note: "Disabled at v1; enable in Tier 2"
  
  - id: dehashed
    name: "DeHashed"
    category: enrichment
    grade_facts: B
    grade_attribution: F
    active: false
    rationale: "Breach data is real, recency/accuracy varies"
    api_required: true
    note: "Disabled at v1; enable in Tier 2"

# ============================================================================
# First-Party Telemetry (highest grade for attribution-to-environment)
# ============================================================================
