  - id: crowdstrike
    name: "CrowdStrike"
    category: vendor
    grade: A
    active: true
    rationale: "Excellent APT naming/tracking, Global Threat Report"
    urls:
      - https://www.crowdstrike.com/blog/
  
  - id: recorded-future
    name: "Recorded Future"
    category: vendor
    grade: A
    active: true
    rationale: "Deep OSINT + dark web coverage, high accuracy"
    urls:
      - https://www.recordedfuture.com/blog
  
  - id: mstic
    name: "Microsoft MSTIC / MSRC"
    category: vendor
    grade: A
    active: true
