# ============================================================================
# Behavioral / TTP-level detection patterns
# ============================================================================

  - id: peach-password-spray-pattern
    type: detection_pattern
    value: password_spray_entra_m365
    description: |
      Primary current-generation access vector (T1110.003). Hunt indicator:
      distributed low-and-slow authentication failures across many accounts
      from few source ASNs / cloud IP ranges against Entra ID / M365. Not a
      static IOC; an identity-plane behavioral hunt.
    source_brief: microsoft-peach-sandstorm-2023

  - id: peach-roadtools-entra-enum-pattern
    type: detection_pattern
    value: roadtools_entra_enumeration
    description: |
      Post-access Entra ID enumeration + rogue device registration via
      ROADtools (roadrecon/roadtx) (T1087, T1098.005, T1550). Hunt: Microsoft
      Graph API calls with 'roadtools' or 'python-requests/<ver>' user-agent
      strings; anomalous device registrations (default OS-version artifacts);
      anomalous PRT/token issuance. See seed finding-2026-05-22-0002.
    source_brief: unit42-curious-serpens-2026

  - id: peach-azure-abuse-pattern
    type: detection_pattern
    value: azure_infrastructure_abuse_c2
    description: |
      Tickler backdoor abused legitimate Azure infrastructure for C2/staging
      (T1102). Hunt: anomalous Azure subscription/resource creation tied to
      service accounts; unexpected outbound to attacker-controlled Azure
      resources.
    source_brief: microsoft-mstic-tickler-2024

  - id: peach-aviation-defense-lure-pattern
    type: detection_pattern
    value: aviation_defense_recruitment_lure
    description: |
      Job-lure / recruitment-themed spear-phishing aligned to aerospace/defense
      (T1566.001/002); lookalike domains impersonating aviation/defense brands.
      Hunt: newly-registered lookalike domains of aviation/defense companies;
      recruitment-themed attachments to HR/engineering staff.
    source_brief: fireeye-apt33-2017

# ============================================================================
# Hunt queries
# ============================================================================
hunt_queries:

  - id: peach-hunt-password-spray
    platform: splunk
    title: "Hunt for Peach Sandstorm-style password spray against Entra ID / M365"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=azure:signin OR sourcetype=m365:signin)
      (ResultType=50126 OR status="failure")
      | bucket _time span=1h
      | stats dc(user) as distinct_users_failed count as fail_count
          values(src_ip) as src_ips by _time, src_asn
      | where distinct_users_failed >= 10
      | sort - distinct_users_failed
      # FP consideration: legitimate bulk auth failures (misconfigured app,
      # expired service-account cred, VPN egress) — tune distinct_users
      # threshold + allowlist known corporate egress ASNs.

  - id: peach-hunt-roadtools-graph-enum
    platform: m365
    title: "Hunt for ROADtools Entra ID enumeration user-agent strings"
    query_type: kql
    query: |
      // Microsoft Graph / Entra ID sign-in + audit logs
      // Detect roadrecon/roadtx default user-agent strings
      SigninLogs
      | where UserAgent has_any ("roadtools", "python-requests")
      | project TimeGenerated, UserPrincipalName, IPAddress, UserAgent, AppDisplayName
      // FP consideration: legitimate python-requests automation may exist;
      // correlate with anomalous device registration + Graph enumeration volume.

  - id: peach-hunt-rogue-device-registration
    platform: m365
    title: "Hunt for rogue Entra ID device registrations (T1098.005)"
    query_type: kql
    query: |
      AuditLogs
      | where OperationName has "Add registered device"
      | project TimeGenerated, InitiatedBy, TargetResources, ResultDescription
      // FP consideration: legitimate BYOD/onboarding waves — correlate with
      // password-spray precursor + default OS-version artifacts + off-hours.

  - id: peach-hunt-tickler-falsefont-artifacts
    platform: edr
    title: "Hunt for Tickler / FalseFont backdoor artifacts"
    query_type: pseudo
    query: |
      DEPLOY current Microsoft-published YARA/EDR signatures for Tickler and
      FalseFont across Defense-Industrial-Base-tier hosts.
      ALERT on signature match OR anomalous Azure-C2 outbound from implant host.
      # FP consideration: signature-based; keep rules current from Microsoft
      # publications. Pair with Azure-abuse hunt for corroboration.

  - id: peach-hunt-atomic-ioc-match
    platform: splunk
    title: "Match ratified FalseFont/Tickler hashes + C2 (atomic IOC sweep)"
    query_type: spl
    references_indicators:
      - peach-falsefont-hash-364275326bbf
      - peach-falsefont-hash-4145e792c9e9
      - peach-falsefont-domain-digitalcodecrafters
