hunt_queries:
  - id: cl-sta-1132-hunt-c2-ips
    platform: splunk
    title: "CL-STA-1132 C2/staging IP hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_ip IN ("67.206.213.86","136.0.8.48","146.70.100.69","149.104.66.84")
       OR src_ip IN ("67.206.213.86","136.0.8.48","146.70.100.69","149.104.66.84"))
      | stats count, earliest(_time) as first_seen, latest(_time) as last_seen
        by src_ip, dest_ip, dest_port
      | sort -last_seen
    notes: >
      Any hit warrants investigation. Cross-reference with PAN-OS
      management / data-plane traffic and CVE-2026-0300 exploitation
      timeline (post 2026-05-06).

  - id: cl-sta-1132-hunt-staging-url
    platform: splunk
    title: "CL-STA-1132 staging endpoint hunt — port 8000/php_sess"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (uri="*php_sess*" AND dest_port=8000)
      OR url="http://146.70.100.69:8000/php_sess"
      | stats count by src_ip, dest_ip, uri, _time
      | sort -_time
    notes: >
      php_sess endpoint on port 8000 is unusual; combined with the
      specific IP it is high-fidelity. Pattern alone (php_sess + 8000)
      may produce false positives in non-firewall environments.

  - id: cl-sta-1132-hunt-earthworm-hash
    platform: edr
    title: "EarthWorm hash hunt on PAN-OS-adjacent hosts"
    query_type: pseudo_kql
    query: |
      DeviceFileEvents
      | where SHA256 == "e11f69b49b6f2e829454371c31ebf86893f82a042dae3f2faf63dcd84f97a584"
      | project DeviceId, FileName, FolderPath, Timestamp, InitiatingProcessFileName
    notes: >
      Hash hunt is high-fidelity. EarthWorm is publicly available so
      hits should be investigated as post-exploitation signal, not
      attributed to CL-STA-1132 by hash alone.

  - id: cl-sta-1132-hunt-saml-flood
    platform: pan-os
    title: "PAN-OS SAML authentication flood inducing HA failover"
    query_type: pseudo_query
    query: |
      Look for: high-rate SAML authentication request bursts targeting
      User-ID Authentication Portal, followed by HA failover event in
      PAN-OS system logs. Anomalous volume relative to baseline SAML
      traffic. Correlate with subsequent crash-kernel-message / core-
      dump deletion events on the failed-over device.
    notes: >
      TTP-level hunt, not IOC-based. False-positive consideration:
      legitimate HA failover events are common; the diagnostic signal
      is the SAML burst preceding the failover plus log scrubbing on
      the previously-active device.

  - id: cl-sta-1132-hunt-ad-recon
    platform: edr
    title: "Active Directory enumeration of domain root + DomainDnsZones"
    query_type: pseudo_kql
    query: |
      DeviceEvents
      | where ActionType == "LdapSearch"
        and (SearchFilter contains "DomainDnsZones"
             or SearchFilter contains "DC=,DC=" )
      | project DeviceId, AccountName, Timestamp, SearchFilter,
                InitiatingProcessFileName
    notes: >
      LDAP queries against domain root + DomainDnsZones are not common
      from non-AD-tooling processes. Correlate with PAN-OS-host-derived
      credential usage to filter benign administrator activity.
