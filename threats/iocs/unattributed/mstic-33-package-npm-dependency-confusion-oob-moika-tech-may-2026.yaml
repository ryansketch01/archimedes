    note: >
      Microsoft MSTIC / Microsoft Defender Security Research Team primary
      blog publication 2026-05-29 20:06 EDT — vendor-authority disclosure
      on own-product detection telemetry plus coordinated npm registry
      takedown. 33 packages under nine spoofed organizational scopes,
      three new maintainer aliases (`mr.4nd3r50n`, `ce-rwb`, `t-in-one`)
      all yandex.ru, single C2 endpoint with X-Secret-gated payload
      delivery, recon-only payload mode with server-side toggle for
      follow-on exploit. Cluster digraph A2 (single-source veto at the
      envelope level pending independent corroboration); individual
      procedural facts at A1. Operator-level attribution only.

notes: |
  Mechanism (per MSTIC):
    1. Three new maintainer accounts publish 33 npm packages under nine
       spoofed organizational scopes (impersonating Sberbank SberPay,
       Wildberries-shaped e-commerce, `@capibar.chat`, generic dev infra
       — Russian-speaking fintech / e-commerce target set; NO A&D / DIB /
       ITAR / aerospace targeting).
    2. Inflated version numbers (`100.100.100`, `99.5.7`, `99.5.8`) win
       the dependency-confusion race against private-registry packages.
    3. `scripts/postinstall.js` ships ~7KB Obfuscator.io-style stager.
    4. Stager posts to `oob.moika.tech/payload/{win,mac,linux}` with
       hardcoded `X-Secret: l95HdDaz3kQx1Zsg3WxH6HvKANf51RY1`.
    5. C2 returns platform-specific payload only when X-Secret matches.
    6. Payload runs in RECONNAISSANCE-ONLY mode currently — environment
       fingerprinting plus credential reconnaissance via process
       environment. Server-side toggle exists for follow-on exploit
       (observed state, NOT a claim about operator intent).

  CRITICAL DEFENSIVE NOTE — `X-Secret` value is a unique strong signal:
    The X-Secret header value `l95HdDaz3kQx1Zsg3WxH6HvKANf51RY1` is a
    hardcoded shared secret published verbatim by MSTIC for defender
    detection. ANY outbound HTTP request from any environment carrying
    that header value, to ANY destination, is high-confidence malicious
    regardless of where the request is going. This is detection-grade
    across the full IOC set.

  A&D-nexus assessment:
    - MSTIC's stated target scope is Russian-language fintech /
      e-commerce. NO DIB / aerospace / defense primes named.
    - Mechanism is universal to any npm-based developer environment;
      detections apply to A&D CI/CD and developer-laptop EDR regardless
      of the campaign's named target set.
    - Four detection levers transferable to A&D primes today:
        * DNS / proxy block on `oob.moika.tech` and
          `*.cloudplatform-single-spa.io`.
        * HTTP-header alert on the X-Secret value (any destination).
        * Scope / maintainer allowlisting on internal npm registries;
          alert on any public package version numerically higher than
          a private-registry package.
        * `npm install --ignore-scripts` at org-policy level blocks the
          stager outright.

  Methodologically distinct from MSTIC's 2026-05-28 `vpmdhaj` 14-package
  typosquat cluster on MSTIC's own reported evidence:
    - C2 architecture differs: X-Secret-gated single-stage (this cluster)
      vs. two-generation Bun-runtime (vpmdhaj).
    - Payload posture differs: recon-only with server-side toggle (this
      cluster) vs. active full credential stealer (vpmdhaj).
    - Defender family signature differs: no `Trojan:JS/ShaiWorm` family
      tag on this cluster.
    - Primitive differs: dependency confusion (this cluster) vs.
      typosquat (vpmdhaj).
    - Maintainer profile differs: yandex.ru / Russian-speaking (this
      cluster) vs. gmail / DevOps-config (vpmdhaj).
    MSTIC published the two findings 22h apart and did NOT link them.
    Archimedes does NOT originate a lineage claim (Hard Rule 2).

  Splunk first-party status at finding creation (2026-05-30):
    Dormant on the 11-token IOC set (oob.moika.tech + 3 payload URLs +
    X-Secret value + 3 maintainer emails + 3 spoofed enterprise hostnames)
    across `defenseclaw_local` (60-day index dormancy) and `archimedes`.
    Hard Rule 8 — silence is NOT disconfirming, just absent.

  Account-lifecycle observation (analyst ACH framing — likely):
    `mr.4nd3r50n`'s npm history shows v0.0.0 "Bugbounty"-tagged packages
    published April 2024, ~2-year dormancy, then 2026-05-28 malicious
    bursts. Analyst ACH ranks deliberate account-aging-as-cover as most
    parsimonious; a genuine bug-bounty pivot cannot be ruled out.
    Defensible observation, NOT predictive of attribution.

  Takedown status:
    MSTIC + npm team coordinated removal of ALL 33 malicious packages
    BEFORE the blog publication 2026-05-29 20:06 EDT. C2 host
    `oob.moika.tech` is likely still alive. Detection patterns remain
    valid for retro-hunting and any future operator re-attempt.

  To migrate this cluster to actor-attributed:
    - Mandiant / CrowdStrike / Unit 42 / SentinelOne / Bitdefender /
      Sophos / ESET publishes corroborating analysis with attribution
      to a roster actor.
    - First-party Splunk hit on the X-Secret value, `oob.moika.tech`,
      `*.cloudplatform-single-spa.io`, or one of the three yandex.ru
      maintainer emails ties to a roster actor's infrastructure.
    - Second A/B-grade vendor research independently corroborates the
      campaign with firmer attribution above operator-level.
    - npm forensic registry metadata is later released / leaked /
      cross-referenced against a doxxed operator identity.

