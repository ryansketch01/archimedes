notes: |
  Two RELATED-BUT-DISTINCT artifacts from the same Unit 42 dataset:

    1. Montana Empire kit (PTTAVM.zip) — the flagship phantom-squatting case.
       AI-coding-assistant-built phishing kit: real-time storefront scraper,
       PHP backend, dual payment interception (card + bank transfer), IBAN
       rotation via Telegram, national-ID harvesting, manual OTP relay via
       operator panel, Telegram C2. Admin panel string "Kimseye Guvenme"
       (Turkish: "Trust No One") — operator context, NOT attribution.
       AEW (hallucination-to-registration): 23 days.

    2. Australia Post APK (auspost.apk) — a SEPARATE phantom-squatting artifact
       (national postal delivery service impersonation, AEW 51 days). Well-
       flagged Android phishing/banker (18/62 on VT). Included here because it
       shares the tactic; it is NOT part of the Montana Empire kit.

  SIZE DISCREPANCY NOTE: Unit 42 lists the ZIP as 7,958,528 bytes; VirusTotal
  reports 7,957,586 bytes for the same SHA256. Trust the SHA256 as the anchor;
  the byte-count delta is a source-reporting artifact, not a different file.

  REDACTED IOCs NOT REPRODUCED (we do not have the cleartext):
    - hxxp://[redacted].com/{[redacted].zip, letgovip.zip}
    - hxxp://[redacted].com/{mentalite.php, panel_track.php, verify_api.php}
    - hxxp://[redacted]post-app[.]com/[redacted]post.apk  (APK host)
    - Phantom sandbox/admin/billing subdomains for the postal marketplace.
    Note: pttavm.com is the LEGITIMATE PTT AVM domain — the impersonated
    brand, NOT an IOC. Never block.

  Splunk first-party status at cluster creation (2026-07-17): not yet queried
  against archimedes / defenseclaw_local. Hard Rule 8 — silence is not
  disconfirming. Retro-hunt the two SHA256 below if EDR telemetry is available.

  A&D relevance: none direct (consumer postal fraud). Tracked as the in-the-wild
  proof of the phantom-squatting tactic and AI-built-tooling technique class.

