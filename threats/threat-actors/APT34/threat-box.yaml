# ============================================================================
# Espionage — weighted 35%
# ============================================================================
scores:
  espionage:
    intent:
      score: 3
      label: sector-association
      willingness_modifier: 0
      evidence: |
        APT34 is documented by Mandiant, Palo Alto Unit 42, Trend Micro, and
        Symantec as a sustained Iranian state-aligned espionage actor focused
        on Middle East government, telecommunications, energy, and finance,
        with documented A&D-adjacent targeting of regional defense ministries
        and aerospace research entities (notably Israeli targets per Mandiant
        Crambus 2023 reporting). Targeting of US A&D primes specifically is
        NOT documented in public reporting; A&D-prime exposure is sectoral
        and supply-chain-mediated rather than direct. Scored Intent=3
        (sector-association) rather than 5 (target-specific) — the latter
        would require A-grade evidence of direct ad-prime-v1 targeting,
        which is absent.
      sources:
        - mandiant-2017-apt34
        - unit-42-oilrig-2018
        - symantec-crambus-2023
        - trendmicro-menorah-2023
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Iran — sustained sanctions regime, no diplomatic constraints, active regional cyber confrontation through 2024-2025."
    capability:
      score: 5
      label: significant
      novelty_modifier: 0
      evidence: |
        Multiple A-grade sources document active espionage tradecraft within
        the last 24 months: Trend Micro and Unit 42 disclosed MENORAH C#
        backdoor against Saudi government targets in 2023-2024; Symantec
        documented an eight-month dwell-time intrusion (PowerExchange,
        compromised Exchange transport agent C2) in a Middle East government
        network in 2023. Decade of continuous tooling evolution (Helminth,
        ISMAgent, OopsIE, BONDUPDATER, RGDoor, DNSpionage/Karkoff, Saitama,
        SideTwist, MARLIN, MENORAH, PowerExchange). Capability against
        ad-prime-v1's technology stack (Windows, Exchange, IIS, Office) is
        significant in the abstract — what's lower is targeting interest, not
        capability.
      sources:
        - trendmicro-menorah-2023
        - symantec-crambus-2023
        - unit-42-saitama-2022
        - cisco-talos-dnspionage-2019
        - mandiant-2017-apt34
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: |
        Custom-developed tooling per campaign (MENORAH, MARLIN, PowerExchange,
        SideTwist). DNS-tunneling C2 across multiple toolkits raises detection
        difficulty above commodity-malware baseline. PowerExchange's use of
        compromised Exchange transport agents as covert C2 represents novel
        living-off-the-land tradecraft against M365/Exchange-heavy environments.
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: "No first-party APT34 infrastructure observations in defenseclaw_local at time of initial scoring 2026-05-01."
    final_intent: 3
    final_capability: 5
    composite: 8
    threat_level: HIGH
    ioc_bonus_applied: 0

# ============================================================================
# Supply Chain — weighted 20%
# ============================================================================
  supply_chain:
    intent:
      score: 3
      label: sector-association
      willingness_modifier: 0
      evidence: |
        APT34 has documented use of compromised regional ministries and
        telecommunications providers as relays into partner networks
        (T1199 Trusted Relationship). For ad-prime-v1 specifically, this
        manifests as a credible supply-chain risk via: (1) joint ventures
        with GCC defense ministries, (2) MENA-region subsidiaries, (3)
        shared regional telecom or cloud infrastructure. The intent is not
        ad-prime-v1-specific (Intent=5 unsupported), but it does map to the
        broader A&D / defense-adjacent sector via partner compromise.
      sources:
        - mandiant-2017-apt34
        - symantec-crambus-2023
        - unit-42-oilrig-2018
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Same as espionage — Iran, no constraints."
    capability:
      score: 4
      label: credible
      novelty_modifier: 1
      evidence: |
        Documented capability to compromise regional infrastructure and use
        it as relay (T1199). Multiple Mandiant and Unit 42 reports document
        intrusion sets pivoting through compromised regional partners.
        Capability is credible but not at the level of operators known for
        running large-scale supplier-chain compromise (e.g., APT41 hardware
        supply chain). Scored 4 (credible) rather than 5 (significant)
        because supply-chain-into-ad-prime-v1 chain has not been documented
        end-to-end in public reporting.
      sources:
        - mandiant-2017-apt34
        - symantec-crambus-2023
    novelty:
      modifier: 1
      label: semi-custom
      evidence: "Compromised-infrastructure-as-relay is moderate-skill tradecraft; not commodity, but not novel either."
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: "No first-party APT34 supply-chain-related observations as of 2026-05-01."
    final_intent: 3
    final_capability: 3
    composite: 6
    threat_level: MEDIUM
    ioc_bonus_applied: 0

