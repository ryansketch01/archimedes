hunt_queries:
  - id: beagle-hunt-c2-domain
    platform: splunk
    title: "Beagle C2 domain hunt — claude-pro infrastructure"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_host="*claude-pro.com" OR domain="*claude-pro.com" OR query="*claude-pro.com")
      | stats count by user, src_ip, dest_host, _time
      | sort -_time
    notes: >
      False-positive consideration: claude-pro.com is the counterfeit
      site; legitimate Claude / Anthropic infrastructure uses claude.ai
      / anthropic.com. Any hit on *claude-pro.com is high-fidelity.

  - id: beagle-hunt-c2-ip
    platform: splunk
    title: "Beagle C2 IP hunt — Alibaba Cloud 8.217.190.58"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_ip="8.217.190.58" OR src_ip="8.217.190.58")
      | stats count by src_ip, dest_ip, dest_port, _time
      | sort -_time
    notes: >
      Alibaba Cloud IP range. Limited legitimate traffic from a US
      defense contractor environment expected — any match warrants
      investigation.

  - id: beagle-hunt-sideload-chain
    platform: edr
    title: "Beagle sideload chain — NOVupdate.exe loading avk.dll"
    query_type: pseudo_kql
    query: |
      DeviceProcessEvents
      | where FileName =~ "NOVupdate.exe"
      | join kind=inner DeviceImageLoadEvents on DeviceId
      | where InitiatingProcessFileName =~ "NOVupdate.exe"
        and FileName =~ "avk.dll"
      | project DeviceId, AccountName, Timestamp, FolderPath
    notes: >
      NOVupdate.exe is a legitimate G Data binary; presence alone is
      benign. The diagnostic signal is the sideload of avk.dll FROM
      NOVupdate.exe. Correlate with download origin (claude-pro.com)
      and surrounding archive name (Claude-Pro-windows-x64.zip).
