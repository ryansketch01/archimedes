      2026-07-15 (dateAdded verbatim, due 2026-07-18 accelerated ~3-day). Graded A2 / WEP
      likely (single-source veto on the exploitation claim: only CISA KEV directly retrieved;
      Mandiant/GTIG A-grade exploitation basis NOT retrieved this sweep — B relays aggregate
      the same upstream research, not independent). STATE CHANGE + COVERAGE-GAP CLOSURE:
      carried at no-ITW in finding-2026-05-29-0003 (Oracle May 2026 CPU batch) but never
