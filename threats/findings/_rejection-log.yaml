    watchlist_relevance_assessment: >
      The aerospace-defense watchlist (infrastructure/watchlists/
      aerospace-defense.yaml) names contractor primes
      (Lockheed Martin, Boeing, RTX, Northrop Grumman, L3Harris,
      Leidos, SAIC, etc.) — companies, not uniformed branches.
      U.S. Space Force is a uniformed branch of the U.S. Armed
      Forces under the Department of the Air Force, NOT a
      contractor on the watchlist.

      The raw-signal correctly self-identifies the relevance as
      "borderline_indirect" — Space Force is operationally a peer-
      customer of every contractor prime named on the watchlist,
      but the incident itself is (a) targeting a Space Force
      official's PERSONAL-OR-POSITION Instagram account, not Space
      Force / DoD / contractor SYSTEMS; (b) reputational-impact-
      only with no contractor system compromise; (c) attribution
      generic ("pro-Iran") with no roster match; (d) motive per
      Krebs is Instagram-account-resale commercial with pro-Iran
      defacement as side-effect-flex, not primary IO objective
      against the spacecraft program leadership chain.

      Grader judgment: Space-Force-as-peer-customer is too
      attenuated a connection to clear the daily-brief-action
      threshold for A&D-prime contractor audience. The relevance
      class is closer to general-awareness ("Iranian IO posture
      against U.S. military social media surfaces") than
      actionable-intelligence ("specific defensive action
      A&D-prime should take").
    ai_attack_surface_relevance_assessment: >
      The exploit class — social-engineering an LLM-driven
      customer-support recovery workflow into binding attacker-
      controlled email addresses to victim accounts — generalizes
      beyond Meta / Instagram to any consumer-or-enterprise
      platform deploying LLM agents in account-recovery workflows.
      A&D-prime enterprise IAM / helpdesk LLM deployments are
      increasingly common; the exploit-class portability is
      defensive-relevance signal.

      However: this signal is currently single-source (Krebs),
      single-platform (Meta), and the patch is shipped. Sustained
      defensive intelligence value requires either:
      (a) A second consumer or enterprise platform confirming
          exposure to the same LLM-recovery-workflow manipulation
          class — would broaden the defensive-relevance
          assessment;
      (b) An A-grade vendor (Mandiant / Unit 42 / MSTIC / industry
          AI-security firm) publishing AI-bot-account-recovery-
          exploit-class research broadening the class beyond Meta —
          would constitute a research-class finding eligible for
          weekly synthesis;
      (c) An A&D-prime CISO public statement on AI-bot account-
          recovery exposure in their environment — would shift
          to direct A&D action item.

      None present at sweep time. The AI-attack-surface signal is
      preserved as a watch signal for future re-evaluation but
      does not itself clear the brief-action threshold.
