    tier: watch_keywords_awareness      # NOT a full dossier; promote to VT-NNN on escalation
    watch_keywords: ["wp2shell", "CVE-2026-63030", "WordPress REST API batch"]
    cve: CVE-2026-63030
    name: "WordPress Core wp2shell unauthenticated RCE (REST API batch endpoint)"
    component: "WordPress Core — REST API batch endpoint (default install; no plugin required)"
    vuln_class: >
      Route-confusion in the REST API batch endpoint (CWE-436, per NVD) which,
      chained with an author__not_in WP_Query SQL injection (CVE-2026-60137),
      can reach unauthenticated remote code execution. Class-level only; no
      exploit steps recorded (Hard Rule 3).
    cwe: CWE-436                         # NVD (directly retrieved 2026-07-18). Finding gave no CWE.
    cvss:
      # NVD (directly retrieved 2026-07-18) carries TWO CVSS v3.1 scores — this
      # ADJUDICATES the GHSA-Critical vs "CVSS 7.5" discrepancy the finding flagged:
      # the finding's single "7.5" was the SECONDARY score; NIST primary is 9.8.
