    ioc_corroboration:
      observed: false
      bonus_category: null
      note: "Splunk first-party check 2026-05-10: zero hits. No bonus applied."
    final_intent: 2
    final_capability: 4
    composite: 6
    threat_level: MEDIUM
    ioc_bonus_applied: 0

