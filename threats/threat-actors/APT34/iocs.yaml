# ============================================================================
# DNS-tunneling C2 patterns (TTP-level indicators)
# ============================================================================

  - id: apt34-dns-c2-pattern
    type: detection_pattern
    value: dns_tunneling_c2
    description: |
      APT34 toolkits (Helminth, BONDUPDATER, DNSpionage, Karkoff, Saitama) all
      use DNS as a C2 channel. Hunt indicator: anomalous outbound DNS query
      volume to atypical TLDs (.icu, .top, .tk, dynamic DNS providers) with
      high subdomain entropy. Not a static IOC; a behavioral hunt pattern.
    source_brief: cisco-talos-dnspionage-2019

