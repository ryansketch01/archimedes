notes: |
  Operationally diagnostic observation: the C2 indicator
  `t.m-kosche.com` (parent m-kosche.com) appears in TWO Archimedes-
  corpus findings in 48 hours:

    - finding-2026-05-19-0001 (2026-05-19 morning) — Socket / Philipp
      Burckhardt named-analyst research; bound to Mini Shai-Hulud
      expansion via actions-cool/issues-helper + @antv surfaces;
      attribution chain inherits TeamPCP via VT-006 / Wiz + Snyk +
      StepSecurity (carry-forward A1 attribution chain)
    - finding-2026-05-20-FLASH-0001 (2026-05-20 06:00 FLASH sweep) —
      media-relay VT-lookup; bound to TeamPCP self-claim of GitHub-
      corp compromise; attribution layer F6 — no direct vendor
      research attributes the IOC to TeamPCP

  Two non-collapsible readings of the cross-corpus observation:

    (a) Same actor (most likely TeamPCP given finding-2026-05-19-0001's
        higher-rigor attribution chain) operates an infrastructure
        pool that is being progressively surfaced through different
        media + research channels. The C2 reuse is real and is a
        confirming signal for TeamPCP infrastructure clustering.
    (b) Piggyback-class brand-laundering enabled by the 2026-05-12
        TeamPCP source-code release on BreachForums (finding-
        2026-05-15-FLASH-0002): an unrelated actor (or actors)
        re-uses the t.m-kosche.com C2 because the leaked Shai-Hulud
        worm source code references the domain — i.e., the C2
        appears in multiple Archimedes findings because multiple
        actors are now downstream of the same leaked codebase, not
        because the same actor ran both intrusions.

  Both readings preserve Hard Rule 2 (no Archimedes-originated
  attribution). Reading (a) is more parsimonious; reading (b) is
  enabled by the corpus prior (finding-2026-05-15-FLASH-0002). The
  finding's analyst SAT-ACH leaves the H1-vs-H5 (TeamPCP-real vs
  brand-piggyback) question non-falsified pending A-grade
  independent telemetry.

  First-party Splunk status at cluster creation (2026-05-20 06:08):
  47th consecutive dormant non-self-telemetry sweep across
  archimedes + defenseclaw_local indexes (-72h window). Zero hits
  on either C2 indicator, on m-kosche.com parent, on
  check.git-service.com, or on the implicit-host PCP-shell-pattern
  variations. Hard Rule 8: silence is not disconfirming, not
  confirming.

  To migrate this cluster to actor-attributed:
    - A-grade vendor research (Mandiant / CrowdStrike / Unit 42 /
      MSTIC / Socket / StepSecurity / Wiz / Snyk / Upwind) directly
      attributes either domain to TeamPCP infrastructure
    - First-party Splunk hit on either IOC ties it to a TeamPCP
      campaign artifact
    - Operator decision after /update-tracking review on the
      cross-corpus C2-reuse pattern

