# ============================================================================
# Overall
# ============================================================================
# Weighted: espionage 35% + supply_chain 20% + destructive 15% + disruptive 15% + cyber_crime 15%
# = (10 × 0.35) + (8 × 0.20) + (4 × 0.15) + (4 × 0.15) + (2 × 0.15)
# = 3.50 + 1.60 + 0.60 + 0.60 + 0.30
# = 6.60
#
# NOTE: A focused A&D prime will care mostly about the espionage score.
# APT28's espionage composite of 10 is the operationally relevant number.
# The weighted overall reflects the breadth of threat, not the apex threat.
overall_score: 6.60
overall_threat_level: MEDIUM
primary_threat_vector: espionage
