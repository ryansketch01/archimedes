hunt_queries:
  - id: shclone-hunt-c2-domain
    platform: splunk
    title: "Shai-Hulud clone wave C2 domain hunt — LocalHost.run anonymizer"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_host="*87e0bbc636999*" OR domain="*87e0bbc636999*"
       OR query="*87e0bbc636999*" OR dest_host="*.lhr.life"
       OR domain="*.lhr.life" OR query="*.lhr.life")
      | stats count by user, src_ip, dest_host, _time
      | sort -_time
    notes: >
      LocalHost.run (*.lhr.life) is a legitimate developer-tooling
      anonymizer with broad non-malicious use. Pre-filter the specific
      subdomain 87e0bbc636999.lhr.life for high-fidelity hits; the
      wildcard *.lhr.life query is offered as a broader sweep with
      higher false-positive rate.

  - id: shclone-hunt-npm-packages
    platform: edr
    title: "Shai-Hulud clone wave npm package installation hunt"
    query_type: pseudo_kql
    query: |
      DeviceProcessEvents
      | where (ProcessCommandLine has_any ("chalk-tempalte",
                                            "@deadcode09284814/axios-util",
                                            "axois-utils",
                                            "color-style-utils")
              and (FileName =~ "npm" or FileName =~ "yarn" or FileName =~ "pnpm" or FileName =~ "node"))
      | project DeviceId, AccountName, Timestamp, ProcessCommandLine, FolderPath
    notes: >
      Defensive priority: add the four package names to dependency-tree
      quarantine / SCA allowlist denial. Typosquat names will not match
      legitimate package installs (chalk-template, axios-utils are the
      legitimate names) so any match is high-fidelity.
