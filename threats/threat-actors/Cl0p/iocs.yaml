hunt_queries:
  - id: clop-hunt-oracle-ebs-c2
    platform: splunk
    title: "Cl0p Oracle EBS 2025 C2 / exploitation-source IPs"
    query_type: spl
    query: |
      index=defenseclaw_local
        (dest_ip="162.55.17.215" OR dest_ip="104.194.11.200"
         OR src_ip="200.107.207.26" OR src_ip="161.97.99.49")
      | stats count min(_time) as first_seen max(_time) as last_seen
              by src_ip dest_ip dest_port sourcetype host
    false_positive_note: >
      Campaign-scoped (2025 Oracle EBS). Network infrastructure rotates; treat as
      historical unless recently re-observed. Any hit warrants investigation.
    references_indicators:
      - clop-ip-200-107-207-26
      - clop-ip-161-97-99-49
      - clop-ip-162-55-17-215
      - clop-ip-104-194-11-200

  - id: clop-hunt-extortion-senders
    platform: m365
    title: "Cl0p extortion sender addresses (mail trace)"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=o365:* OR sourcetype=email)
        (sender="support@pubstorm.com" OR sender="support@pubstorm.net"
         OR sender="support@cryptohox.com")
      | stats count values(recipient) as recipients values(subject) as subjects
              min(_time) as first_seen by sender
    false_positive_note: >
      pubstorm.com/.net are confirmed (Oracle EBS 2025). cryptohox.com is SUSPECTED
      (Windchill 2026, B3) — a hit is high-signal but attribution stays as-reported.
    references_indicators:
      - clop-email-pubstorm-com
      - clop-email-pubstorm-net
      - clop-email-cryptohox-suspected

  - id: clop-hunt-webshells-mft-erp-plm
    platform: edr
    title: "Cl0p webshell drops on internet-facing MFT/ERP/PLM web roots"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=Sysmon EventCode=11)
        (TargetFilename="*human2.aspx"
         OR (TargetFilename="*.aspx" AND TargetFilename="*\\MOVEit*")
         OR (TargetFilename="*.jsp"  AND (TargetFilename="*Windchill*" OR TargetFilename="*\\ptc\\*"))
         OR TargetFilename="*\\OA_HTML\\*.jsp")
      | stats count values(TargetFilename) as files values(Image) as writing_process
              min(_time) as first_seen by host
    false_positive_note: >
      Legit application deploys write .aspx/.jsp too — scope to internet-facing MFT/ERP/PLM
      hosts and correlate with unexpected writing process + subsequent outbound HTTPS.
    references_indicators:
      - clop-file-human2-aspx
      - clop-windchill-family-artifacts

  - id: clop-hunt-oracle-ebs-endpoints
    platform: splunk
    title: "Cl0p Oracle EBS SyncServlet / UiServlet exploitation attempts"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=stream:http OR sourcetype=proxy OR sourcetype=web)
        (uri_path="/OA_HTML/SyncServlet" OR uri_path="/OA_HTML/configurator/UiServlet")
      | stats count values(status) as statuses min(_time) as first_seen
              by src_ip host uri_path
    false_positive_note: >
      SyncServlet/UiServlet can see legitimate use; alert on external src_ip + anomalous
      volume/POST bodies. Correlate with new templates in XDO_TEMPLATES_B / XDO_LOBS.
    references_indicators:
      - clop-endpoint-syncservlet
      - clop-endpoint-uiservlet

