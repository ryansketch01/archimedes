  notes: |
    Scoring confidence:
      - Sqgame / BirdCall specific 2026 campaign: single-source veto on
        finding-2026-05-07-0004 (ESET via The Record alone). ESET
        attribution is explicit and high-confidence per The Record's
        framing. The single-source caveat constrains campaign-specific
        inferences but NOT the broader capability assessment.
      - Historical APT37 capability: MULTI-VENDOR multi-A-grade across
        FireEye/Mandiant 2018, Kaspersky 2016–2018, Cisco Talos
        2017–ongoing, Volexity 2021, ESET 2024–2026. Capability=5 rests
