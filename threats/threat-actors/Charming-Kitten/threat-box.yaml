# ============================================================================
# Overall — weighted 4.45 → LOW → auto-commit
# ============================================================================
overall:
  weighted_score: 4.45
  weights_used:
    espionage: 0.35
    supply_chain: 0.20
    destructive: 0.15
    disruptive: 0.15
    cyber_crime: 0.15
  threat_level: LOW
  authority_level: actor-profiler-autonomous
  computation: |
    espionage:    9 × 0.35 = 3.15
    supply_chain: 2 × 0.20 = 0.40
    destructive:  2 × 0.15 = 0.30
    disruptive:   2 × 0.15 = 0.30
    cyber_crime:  2 × 0.15 = 0.30
                            ------
    weighted_score            4.45 → rounds to 4 → LOW (band 2-4)

primary_threat_vector: espionage
primary_threat_level: HIGH        # category-level — does NOT trigger Hard Rule 5 gate per doctrine
primary_vector_note: |
  Espionage is the dominant threat vector — composite 9 (category-level
  HIGH). Per THREAT-BOX-METHODOLOGY.md and skill doctrine, the Hard Rule 5
  /approve-scoring gate is keyed on the WEIGHTED OVERALL only, not on any
  per-category HIGH. Charming Kitten's overall posture is LOW because the
  four non-espionage categories are at floor (LOW), and the espionage
  composite of 9 (rather than 10 as for UNC1549) is constrained by the
  red-team qualify directive on Intent=4 (Ideology) rather than 5
  (Target-Specific). The 0.35 espionage weight × 9 = 3.15 is not enough
  alone to push weighted overall above the 4.5 threshold required to
  round into MEDIUM.

  Operator-anticipated outcome was HIGH; actual computation lands LOW.
  This is the red-team `qualify` directive doing exactly what it was
  meant to do — preventing over-scoring on Intent extrapolation from
  named think-tank victims to unobserved prime-direct targeting.

confidence:
  admiralty: A1
  notes: |
    Inherits A1 admiralty grade from finding-2026-05-05-0002 (concurrent
    A-grade independent corroboration: CrowdStrike + Microsoft MSTIC
    publish 2026-05-04 with separate evidence bases; neither cites the
    other; corroboration test passes). Scoring evidence anchors on the
    same A1 corpus. Confidence caveats:
      - Red-team `qualify` directive on the source finding is binding —
        Espionage Intent must NOT extrapolate think-tank victims into
        prime-direct targeting. This binding is preserved in the
        Intent=4 scoring.
      - First-party Splunk silent across all 6 IOCs and OAuth
        consent-grant audit-log patterns over -30d. Silent telemetry is
        not contradicting; no IOC bonus.
      - The ACH H3 leader (tradecraft-portability) on the source finding
        is at WEP "likely" — sufficient for forward-defensive language
        on Capability/Novelty but NOT for Intent escalation.
      - KAC A1 (prime-tier Entra audit-log coverage) classified `test`
        on the source finding; remains a coverage attestation question
        not blocking. A future Splunk hit on OAuth consent-grant audit
        events would invoke first-party precedence and trigger
        immediate review-cycle re-engagement.

