# infrastructure/watchlists/aerospace-defense.yaml
#
# Tier-1 A&D primes and major defense contractors under active monitoring.
# Collector uses this file to prioritize findings that mention any of these entities.
# Matching is performed on name, aliases, subsidiaries, and domains.
#
# Add new companies via human edit + git commit. Agent cannot edit this file.

version: 1
last_updated: 2026-04-18
notes: |
  Includes parent companies and major subsidiaries that operate independently
  enough to appear in reporting by their own name (e.g., Collins Aerospace
  under RTX). Watchlist match triggers higher-priority handling in the 
  collector and pre-flight check requirement for brief inclusion.

