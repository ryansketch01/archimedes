# threats/threat-actors/Charming-Kitten/threat-box.yaml
#
# Threat Box scoring per doctrine/THREAT-BOX-METHODOLOGY.md
# Target profile: ad-prime-v1 (mid-to-large US A&D contractor)
#
# Scored 2026-05-09 via /update-tracking (Mode 2). Replaces 2026-05-06
# TEMPLATE scaffold. Weighted overall 4.45 → LOW → auto-commit per
# doctrine authority table. Espionage category alone scores composite 9
# (HIGH) — preserved in the per-category table but does NOT trigger Hard
# Rule 5 gate; only weighted overall does, and weighted overall is LOW.
#
# Operator-anticipated outcome was HIGH; actual computation lands LOW
# because the red-team `qualify` directive on finding-2026-05-05-0002
# binds Espionage Intent to 4 (Ideology Association) rather than 5
# (Target-Specific). Vendors named think-tank, academic, and journalist
# victims — NO defense primes. Per Hard Rule 2 and the source-finding
# red-team directive, prime-direct targeting cannot be inferred from
# mechanism-portable OAuth consent-grant tradecraft. Intent=5 would have
# required at least one A-grade source documenting targeting of
# ad-prime-v1; that source does not exist for Charming Kitten in the
# current corpus. The disciplined Intent=4 + Capability=5 produces
# Espionage composite 9 (still HIGH category-level), but the four floor
# categories dilute via doctrine weighting to overall 4.45 LOW.
#
# First-party Splunk: zero hits across all 6 IOCs over -30d (queried
# 2026-05-09 against archimedes + defenseclaw_local). Also zero hits on
# OAuth consent-grant audit-log signals (Mail.ReadWrite, Consent to
# application). No IOC corroboration bonus applied.

