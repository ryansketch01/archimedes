    capability:
      score: 1
      label: not-capable
      novelty_modifier: 0
      evidence: "Capability=1 floor. No documented evidence of Charming Kitten disruptive capability against A&D-relevant infrastructure. Doctrine red-flag check: nation-state status does not count as evidence of capability X."
