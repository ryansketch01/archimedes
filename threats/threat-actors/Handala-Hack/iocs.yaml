hunt_queries:
  - id: handala-hunt-operator-ips
    platform: splunk
    title: "Handala / Void Manticore operator IPs in network logs"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=dns OR sourcetype=proxy
        OR sourcetype=firewall OR sourcetype=stream:* OR sourcetype=netflow)
        (dest_ip IN ("64.176.169.22","82.25.35.25","64.176.172.235",
          "64.176.172.165","64.176.173.77","64.176.172.101","31.57.35.223",
          "107.189.19.52","146.185.219.235")
         OR src_ip IN ("64.176.169.22","82.25.35.25","64.176.172.235",
          "64.176.172.165","64.176.173.77","64.176.172.101","31.57.35.223",
          "107.189.19.52","146.185.219.235"))
      | stats count min(_time) as first_seen max(_time) as last_seen
              values(dest_ip) as dest_ips values(dest_port) as ports by src_ip, host
    false_positive_note: >
      Prioritize the two VT-confirmed IPs (64.176.169.22, 82.25.35.25). The other
      seven are lower-confidence (reported, not individually VT-checked) and sit
      on shared commercial hosting (Vultr /19, 107.189.0.0/16) — confirm the peer
      before acting. Network-infrastructure TTL 90 days; re-validate.
    references_indicators:
      - handala-ip-64-176-169-22
      - handala-ip-82-25-35-25
      - handala-ip-64-176-172-235
      - handala-ip-64-176-172-165
      - handala-ip-64-176-173-77
      - handala-ip-64-176-172-101
      - handala-ip-31-57-35-223
      - handala-ip-107-189-19-52
      - handala-ip-146-185-219-235

  - id: handala-hunt-intune-mass-wipe
    platform: m365
    title: "Anomalous bulk MDM remote-wipe / retire (Intune) — behavioral"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=intune OR sourcetype=azure:audit OR sourcetype=m365:audit)
        (Operation="*Wipe*" OR Operation="*Retire*" OR Operation="*FreshStart*"
         OR Operation="*RemoteWipe*" OR Operation="*deleteManagedDevice*")
      | bucket _time span=1h
      | stats count values(Operation) as ops dc(target_device) as devices_actioned
              by _time, initiator_user, initiator_ip
      | where devices_actioned >= 10
      | sort - devices_actioned
    false_positive_note: >
      Behavioral hunt for the Stryker-style Intune mass-wipe TTP (T1485 via a
      compromised MDM tenant) — this is NOT tied to a specific hash/IP but to the
      documented technique. Tune the devices_actioned threshold to your fleet's
      legitimate bulk-action baseline (device refreshes, offboarding waves).
      Legitimate mass retirements exist — correlate initiator_user / initiator_ip
      against known admin activity and change tickets. Any unrecognized initiator
      issuing bulk wipe/retire is high-severity.
    references_indicators: []      # behavioral (tied to documented TTP), no atomic-IOC dependency

  - id: handala-hunt-tunnelers-webshell
    platform: edr
    title: "Off-the-shelf tunnelers / overlay + web-shell context"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=Sysmon OR sourcetype=edr)
        (process_name IN ("netbird.exe","netbird-*") OR CommandLine="*reGeorge*"
         OR CommandLine="*tunnel.jsp*" OR CommandLine="*tunnel.aspx*")
      | stats count values(process_name) as procs values(CommandLine) as cmds
              min(_time) as first_seen by host, User
    false_positive_note: >
      NetBird is a legitimate overlay tool — alert only where it is not a
      sanctioned product. reGeorge/web-shell tunnel filenames are heuristics, not
      confirmed hashes (no verified hashes available — hashes pending direct
      retrieval). Correlate with the operator-IP hunt and with anomalous
      internet-facing-server child processes (web-shell context, T1505.003).
    references_indicators: []      # behavioral; no confirmed hash indicators to reference

