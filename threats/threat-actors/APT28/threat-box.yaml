# ============================================================================
# Espionage — weighted 35%
# ============================================================================
scores:
  espionage:
    intent:
      score: 5
      label: target-specific
      evidence: |
        Two decades of documented operations targeting NATO defense ministries,
        weapons suppliers, and Ukraine aid logistics. Specific targeting of
        named A&D primes and defense ministries in DoJ 2018 indictment and
        NSA/CISA May 2025 advisory on GRU Unit 26165 logistics targeting.
        The operational objective — collection of defense and military
        intelligence — is achievable only within our target's network.
      sources: [doj-2018-indictment, mitre-g0007, nsa-cisa-2025-05]
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Active hostilities via Ukraine war; sustained sanctions regime; no diplomatic constraints."
    capability:
      score: 5
      label: significant
      evidence: |
        X-Agent, AUTHENTIC ANTICS, GooseEgg, Operation RoundPress, CVE-2026-21509
        active campaigns — all confirmed by multiple trusted sources (Microsoft MSTIC,
        Palo Alto Unit 42, UK NCSC, ESET, Trellix). Documented active use within
        last 24 months. Multiple A-grade sources.
      sources: [mstic-2024, unit-42-2024, ncsc-uk-2025, eset-2025, trellix-2026-02]
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: |
        Custom tooling per campaign. COM hijacking via novel CLSID. Living-off-the-land
        in M365 via OAuth token theft (AUTHENTIC ANTICS). Cloud-storage-as-C2 to defeat
        perimeter detection.
    ioc_corroboration:
      observed: false
      capability_bonus_applied: 0
      note: "No first-party IOC hits at time of initial scoring."
    final_intent: 5
    final_capability: 5
    composite: 10
    threat_level: HIGH

# ============================================================================
# Supply Chain — weighted 20%
# ============================================================================
  supply_chain:
    intent:
      score: 4
      label: ideology-association
      evidence: |
        Known targeting of NATO logistics and aid supply chain supporting Ukraine
        (NSA/CISA May 2025 advisory). While not solely supply-chain-focused, A&D
        primes are reached via trusted relationship compromise (T1199) of
        suppliers and government accounts.
      sources: [nsa-cisa-2025-05, mitre-g0007]
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Same as espionage."
    capability:
      score: 4
      label: credible
      evidence: |
        Documented use of compromised government accounts as relay (T1199).
        Webmail compromise pivot (Operation RoundPress) enables supplier-to-prime
        lateral movement. Not the primary mission but demonstrated capability.
      sources: [eset-2025, mitre-g0007]
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: "Webmail XSS zero-days, OAuth abuse — high-skill supply-chain tradecraft."
    ioc_corroboration:
      observed: false
      capability_bonus_applied: 0
    final_intent: 4
    final_capability: 4
    composite: 8
    threat_level: HIGH

# ============================================================================
# Destructive — weighted 15%
# ============================================================================
  destructive:
    intent:
      score: 2
      label: regional-association
      evidence: |
        APT28's mission profile is espionage and hack-and-leak, NOT destructive
        operations. Sister unit GRU 74455 (Sandworm) handles destructive work.
        APT28 has demonstrated the ability to destroy logs (T1070.001) in service
        of defensive evasion but has not staged destructive attacks against A&D targets.
      sources: [mitre-g0007, mstic-2024]
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Same as espionage."
    capability:
      score: 3
      label: limited
      evidence: |
        Event log clearing (T1070.001) demonstrated. Could pivot to destructive with
        existing access, but no documented history of APT28 wiping target systems
        in campaigns against A&D sector.
      sources: [mitre-g0007]
    novelty:
      modifier: -1
      label: semi-custom
      evidence: "Destructive actions would likely use existing access, not novel destructive tooling."
    ioc_corroboration:
      observed: false
      capability_bonus_applied: 0
    final_intent: 2
    final_capability: 2
    composite: 4
    threat_level: LOW

