scores:
  espionage:
    intent:
      score: 3
      label: sector-association
      willingness_modifier: 0
      evidence: |
        APT34 is documented by Mandiant, Palo Alto Unit 42, Trend Micro, and
        Symantec as a sustained Iranian state-aligned espionage actor focused
        on Middle East government, telecommunications, energy, and finance,
        with documented A&D-adjacent targeting of regional defense ministries
        and aerospace research entities (notably Israeli targets per Mandiant
        Crambus 2023 reporting). The 2024 Earth Simnavaz campaign (Trend Micro)
        continued this pattern against UAE / Gulf government and energy /
        critical-infrastructure targets — regional government and energy, not
        US A&D primes. Targeting of US A&D primes specifically remains NOT
        documented in public reporting; A&D-prime exposure is sectoral and
        supply-chain-mediated rather than direct. Scored Intent=3
        (sector-association) rather than 5 (target-specific) — the latter
        would require A-grade evidence of direct ad-prime-v1 targeting, which
        is absent. (Contrast roster peer Peach Sandstorm #027, which reaches
        Intent=5 on documented prime-direct US DIB targeting; APT34 does not.)
      sources:
        - mandiant-2017-apt34
        - unit-42-oilrig-2018
        - symantec-crambus-2023
        - trendmicro-menorah-2023
        - trendmicro-earth-simnavaz-2024
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Iran — sustained sanctions regime, no diplomatic constraints, active regional cyber confrontation through 2024-2026."
    capability:
      score: 5
      label: significant
      novelty_modifier: 0
      evidence: |
        Multiple A-grade sources document active espionage tradecraft within
        the last 24 months, now extended by the October 2024 Earth Simnavaz
        campaign (Trend Micro): StealHook backdoor abusing on-prem Microsoft
        Exchange to relay/steal domain credentials, a malicious password-filter
        DLL for plaintext credential capture (T1556.002, psgfilter.dll), and
        exploitation of a Windows privilege-escalation vulnerability
        (CVE-2024-30088, reported by ID only per Hard Rule 3). These items were
        live-ratified against the Trend Micro primary on 2026-07-12 (single-
        source: Trend Micro sole A-grade originator, all other outlets pure relay
        — provisional-A2-confirmed, not multi-A A1). This sits atop
        Trend Micro / Unit 42 MENORAH C# backdoor against Saudi government
        (2023-2024) and Symantec's eight-month PowerExchange dwell in a Middle
        East government network (2023). A decade of continuous tooling
        evolution (Helminth, ISMAgent, OopsIE, BONDUPDATER, RGDoor,
        DNSpionage/Karkoff, Saitama, SideTwist, MARLIN, MENORAH, PowerExchange,
        StealHook). Capability against ad-prime-v1's technology stack (Windows,
        Exchange, IIS, Office, on-prem AD) is significant — what is lower is
        targeting interest, not capability.
      sources:
        - trendmicro-earth-simnavaz-2024
        - trendmicro-menorah-2023
        - symantec-crambus-2023
        - unit-42-saitama-2022
        - cisco-talos-dnspionage-2019
        - mandiant-2017-apt34
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: |
        Custom-developed tooling per campaign (StealHook, MENORAH, MARLIN,
        PowerExchange, SideTwist). Repeated living-off-Exchange tradecraft —
        PowerExchange's transport-agent C2 (2023) and StealHook's Exchange
        credential relay (2024) — plus DNS-tunneling C2 across multiple
        toolkits raises detection difficulty above the commodity-malware
        baseline in M365 / Exchange-heavy environments.
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: |
        No first-party APT34 infrastructure observations in defenseclaw_local
        over -90d at the 2026-07-12 refresh, re-confirmed on the 2026-07-12
