# threats/threat-actors/TeamPCP/iocs.yaml
#
# Agent-queryable sidecar for TeamPCP roster entry #001 (HIGH).
# Initial scaffold 2026-05-12 from finding-2026-05-12-FLASH-0001 (Mini
# Shai-Hulud npm + PyPI self-propagating worm, CVE-2026-45321, GHSA-g7cv-
# rxg3-hmpx). Earlier-known TeamPCP campaigns (PyTorch Lightning ShaiWorm
# 2026-05-04 per MSTIC; Checkmarx Jenkins AST plugin 2026-05-11 per
# Checkmarx PSIRT) are tracked at the family-lineage level but did not
# emit per-actor IOC sidecar entries before this scaffold.
#
# Hard Rule 2: every indicator carries a source_brief reference back to
# its original public reporting; nothing here is Archimedes-originated.
# TeamPCP attribution itself is per Wiz + StepSecurity public attribution
# (Snyk relays StepSecurity's attribution; the layer is two-source on
# attribution, not three-source). Operator may downgrade this scaffold's
# trust if the second-independent-A-grade attribution-corroboration
# concern flagged by the analyst SAT-ACH (assumption A5 Test) materializes
# as a methodological retraction by Wiz or StepSecurity.
#
# Hard Rule 4: no active scanning of TeamPCP infrastructure performed at
# scaffold time. Passive-only enrichment per LEGAL-POLICY.md. TeamPCP
# infrastructure (filev2.getsession.org, 83.142.209.194, etc.) is NOT in
# authorized-targets.yaml.

actor_id: "001"
actor_name: TeamPCP
last_updated: 2026-05-12
admiralty_grade: A2
admiralty_grade_layered:
  procedural_facts: A1
  teampcp_attribution: A2
  novelty_slsa_breaking_tooling_claim: A2
tlp: CLEAR
source_of_record: "finding-2026-05-12-FLASH-0001 (Mini Shai-Hulud); TeamPCP dossier not yet scaffolded"

ttl:
  network_infrastructure: 90    # days — domains/IPs expire from "active"
  file_hashes: 730              # hashes don't expire, may lose relevance
  cve: never                    # CVEs are forever
  ghsa: never                   # GHSA IDs are forever
  malware_family: never         # family identifiers are persistent
  campaign_identifier: never
  exfil_identifier: never       # Session-network recipient IDs persistent
  campaign_salt: never          # PBKDF2 salts are campaign-uniqueness markers

# ============================================================================
# CVE / GHSA — Mini Shai-Hulud campaign
# ============================================================================
indicators:

  - id: teampcp-cve-2026-45321
    type: cve
    value: CVE-2026-45321
    cvss: 9.6
    product: "npm + PyPI ecosystem (Mini Shai-Hulud worm)"
    description: >
      Supply-chain compromise CVE for the Mini Shai-Hulud self-propagating
      worm. Encompasses dual-ecosystem (npm + PyPI) worm propagation via
      OIDC token hijack from compromised maintainer GitHub Actions workflows,
      with SLSA-attestation breakage (worm publishes validly-attested
      malicious packages). ~172 packages compromised across @tanstack /
      @uipath / @mistralai / @opensearch-project / @squawk / @tallyui /
      DraftLab npm namespaces + PyPI guardrails-ai / mistralai.
    status: not_yet_on_kev          # CISA KEV addition anticipated
    ghsa: GHSA-g7cv-rxg3-hmpx
    first_seen: 2026-05-11           # 19:20 UTC initial compromise burst per Wiz timestamping
    related_campaign: "Mini Shai-Hulud (npm + PyPI worm)"
    source_brief: finding-2026-05-12-FLASH-0001

  - id: teampcp-ghsa-g7cv-rxg3-hmpx
    type: ghsa
    value: GHSA-g7cv-rxg3-hmpx
    description: >
      GitHub Security Advisory published by Snyk Security team in
      coordination with CVE-2026-45321. Covers the npm-ecosystem Mini
      Shai-Hulud worm propagation chain.
    status: published
    cve: CVE-2026-45321
    first_seen: 2026-05-12
    related_campaign: "Mini Shai-Hulud (npm + PyPI worm)"
    source_brief: finding-2026-05-12-FLASH-0001

