  - id: unc3753-tradecraft-001
    type: detection_pattern
    value: "Voice phishing (vishing) IT-helpdesk impersonation → screen-share (Zoom/Quick Assist/Teams) → commercial RMM install (AnyDesk/Bomgar/Zoho Assist/SuperOps) → BYOD/VDI pivot → iManage/SharePoint/OneDrive keyword exfil → same-day extortion → LEAKEDDATA DLS"
    role: operational_template
    description: >
      End-to-end tradecraft chain documented by Mandiant. Detection
      signatures along the chain: SuperOps msiexec /quiet child
      processes spawned from unexpected parents; cURL→msiexec
      install patterns; Zoom screen-share initiated from outside
      corporate-owned devices; iManage / SharePoint search-term
      spikes; high-volume WinSCP / Rclone exfil over port 22 from
      VDI/internal endpoints.
    first_seen: 2026-01
    last_seen: 2026-05
    source: finding-2026-06-17-0003
    source_attribution: ["Mandiant / GTIG"]

