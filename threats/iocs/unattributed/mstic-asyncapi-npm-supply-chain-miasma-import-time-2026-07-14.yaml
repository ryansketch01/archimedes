# threats/iocs/unattributed/mstic-asyncapi-npm-supply-chain-miasma-import-time-2026-07-14.yaml
#
# Unattributed cluster — IOCs published by Microsoft MSTIC (Microsoft Threat
# Intelligence blog, 2026-07-15) covering the @asyncapi npm organization
# compromise disclosed 2026-07-14: five malicious versions across four packages
# run a "Miasma" loader at IMPORT time (survives `npm install --ignore-scripts`),
# auto-published with valid OIDC provenance built from unauthorized source
# commits (an `asyncapi-bot` PAT exposed via a misconfigured
# `pull_request_target` "pwn request" workflow).
#
# MSTIC names NO threat actor. Per Hard Rule 2, Archimedes does NOT originate
# attribution. This is a fresh deployment of the previously-documented Miasma
# runtime family (see the 2026-06-03 "Miasma A1 origin" finding), NOT a first
# sighting — but same-vendor MSTIC lineage, so NOT independent corroboration of
# this specific compromise. Structurally sibling to tracked VT-006 (Mini
# Shai-Hulud / OIDC-token hijack + provenance-breaking) and VT-009 (Nx Console);
# mechanism DIFFERS (import-time loader vs. self-propagating worm) — do not
# conflate, and TeamPCP (#001) is NOT named here.
#
# DO-NOT-BLOCKLIST (deliberately NOT indexed as an indicator below):
#   npm-oidc-no-reply@github.com is a LEGITIMATE GitHub OIDC publish identity
#   that was ABUSED by the release workflow — provenance/context only, NOT an
#   attacker-owned identity. Naive blocklisting would break legitimate OIDC
#   publishing. Excluded from indicators per the finding's do_not_blocklist flag.

