# ============================================================================
# Score categories
# ============================================================================
scores:

  # --------------------------------------------------------------------------
  # Espionage — composite 9 → HIGH (category-level only; weighted overall LOW)
  # --------------------------------------------------------------------------
  espionage:
    intent:
      score: 4
      label: ideology-association
      willingness_modifier: 0
      evidence: |
        Intent=4 (Ideology Association) is the binding-with-red-team-qualify
        scoring outcome, NOT Intent=5 (Target-Specific). The Q2 2026 vendor
        reporting (CrowdStrike + MSTIC 2026-05-04, both A-grade) explicitly
        names victims as US/UK/Israeli defense-policy think tanks (Brookings,
        RUSI, Atlantic Council), Iran-nuclear-program researchers, and
        MENA-security journalists. NO defense primes are named as victims.
        Per the methodology evidence-minimum table, Intent=5 requires "at
        least 1 A-grade source documenting targeting of ad-prime-v1
        specifically" — that source does not exist for Charming Kitten in
        the current corpus. Extrapolating from the named think-tank victim
        list to ad-prime-v1 targeting is exactly what the red-team `qualify`
        directive on finding-2026-05-05-0002 prohibits ("brief must NOT
        characterize prime-direct OAuth-consent activity as observed or
        attributed; treat it strictly as a generalizable mechanism-level
        risk").

        Intent=4 (Ideology Association) is well-supported by 2 A-grade
        sources (CrowdStrike + MSTIC concurrent 2026-05-04 attribution)
        documenting sustained 2014-2026 IRGC-IO ideology-driven targeting
        of the Iran-policy ecosystem (think tanks, researchers, journalists,
        dissidents). The motivation chain is unambiguous: Iran-policy
        formation in the West → policy advisors and researchers who shape it
        → IRGC-IO collection priority. This is ideology-association
        targeting (anti-Iran-policy-formation, anti-Western), not
        sector-association (Charming Kitten does NOT target the broader
        defense/manufacturing sector indiscriminately) and not
        target-specific (no documented prime-direct targeting).

        A&D-prime relevance is second-order and mechanism-portability-driven
        — the OAuth consent-grant tradecraft is platform-generic and would
        apply to any Entra ID tenant — but mechanism portability is a
        Capability/Novelty consideration, NOT an Intent consideration
        against ad-prime-v1. Per the source finding's red-team review:
        "tradecraft portability is plausible-but-not-evidenced" against
        primes specifically.
      sources:
        - finding-2026-05-05-0002
        - crowdstrike-2026-05-04
        - mstic-2026-05-04
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Iran (IRGC-IO cluster) — strained US relations, active sanctions, no diplomatic constraints on cyber-espionage operations. Doctrine willingness floor for Russia/China/Iran/DPRK clusters."
    capability:
      score: 5
      label: significant
      novelty_modifier: 0
      evidence: |
        Capability=5 minimum requires "Multiple A-grade sources AND
        documented active use within last 24 months." Both met decisively:

        (1) Multi-source A-grade lineage spanning 2014-2026 — CrowdStrike
        (2026-05-04 concurrent attribution + prior Charming Kitten tracking),
        Microsoft MSTIC (2026-05-04 + sustained Phosphorus/Mint Sandstorm
        tracking), Mandiant (HYPERSCRAPE original 2022 disclosure +
        APT35/G0059 baseline), Google TAG (Iran-cyber quarterly reporting),
        CERTFA (long-running Iranian-dissident-targeting documentation), and
        US government / DOJ reporting (2017 Mesri indictment context).

        (2) Active use within 24 months — the Q2 2026 campaign (Feb-Apr
        2026) is by definition active within the window. Evidence covers
        full kill-chain: initial access (LinkedIn / fake-conference /
        fake-research-collaboration personas + OAuth phishing landings on
        Microsoft-lookalike domains), execution (updated PowerShell loader
        per CrowdStrike), persistence (T1528 OAuth application access tokens
        via attacker-controlled "Policy Review Tool" app — survives password
        resets), credential access (HYPERSCRAPE 2026 variant — first
        publicly-documented update since 2022), defense evasion (lookalike
        domains, deceptive OAuth app display names), collection / exfil
        (HYPERSCRAPE mailbox download via captured tokens; T1567 cloud-hosted
        credential exfiltration C2).

        The HYPERSCRAPE 2022 → 2026 update arc and the OAuth consent-grant
        tradecraft pivot together demonstrate sustained capability evolution
        — not a one-off campaign, but a maturing operational program.
      sources:
        - finding-2026-05-05-0002
        - crowdstrike-2026-05-04
        - mstic-2026-05-04
        - mandiant-hyperscrape-2022
        - mitre-g0059
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: |
        Custom-advanced (Novelty=0). HYPERSCRAPE is an operator-controlled
        custom credential-and-mailbox-exfiltration tool not publicly
        observed in non-Charming-Kitten hands per Mandiant 2022 + CrowdStrike
        + MSTIC 2026-05-04. The 2026 variant is custom-evolved tooling, not
        commodity. The OAuth consent-grant tradecraft (T1528) is a
        platform-leveraging persistence path requiring custom attacker-app
        registration with deceptive display names and tailored social-
        engineering pretext — defenders cannot rely on commodity AV
        signatures because the persistence artifact is an Entra ID
        application registration, not a malware binary. Detection requires
        Entra audit-log hunts and admin-consent posture, neither of which is
        signature-based commodity coverage. The novelty-as-defensive-
        difficulty framing per doctrine fits: defenders without proactive
        Entra audit posture have weak detection signal regardless of how
        well-staffed their EDR is.
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: |
        First-party Splunk negative: queried archimedes + defenseclaw_local
        for all 6 published IOCs (login-microsoft365-secure.com,
        m365-policy-review.org, hyperscrape-update.net, 194.87.44.99,
        HYPERSCRAPE 2026 SHA256, "Policy Review Tool" OAuth app pattern)
        over -30d on 2026-05-09. Zero hits across both indices. Also
        queried OAuth consent-grant audit-log signals (Mail.ReadWrite,
        Consent to application) — zero hits. Per Hard Rule 8 doctrine:
        silent telemetry is not contradicting evidence; first-party
        precedence not invoked; no Capability bonus applied. This is the
        most defensively consequential indicator class in the dossier — a
        future first-party hit on the OAuth consent-grant pattern would
        be especially actionable and would trigger immediate review-cycle
        re-engagement.
    final_intent: 4
    final_capability: 5
    composite: 9
    threat_level: HIGH
    ioc_bonus_applied: 0

  # --------------------------------------------------------------------------
  # Supply Chain — composite 2 → LOW
  # --------------------------------------------------------------------------
  supply_chain:
    intent:
      score: 1
      label: target-of-opportunity
      willingness_modifier: 0
      evidence: |
        Intent floor (=1). The Supply Chain category per doctrine asks
        "Can/will they compromise our suppliers, contractors, or shared
        software to reach us?" — i.e., classic supply-chain compromise.
        The OAuth consent-grant tradecraft is NOT a supply-chain mechanism;
        it is a direct user-consent attack against the target tenant's
        own users (or those of a peer/partner organization). It does not
        compromise a supplier or shared-software dependency to reach the
        target. The think-tank → prime lateral-pretext hypothesis (ACH H2
        in finding-2026-05-05-0002) is also NOT classic supply chain — it
        is social engineering via a compromised peer in the same ecosystem,
        not a supplier compromise.

        No documented Charming Kitten supply-chain operations against A&D
        primes or their suppliers exist in the public reporting corpus.
        Charming Kitten's mission profile is persona-driven credential-
        phishing for direct intelligence collection — not supply-chain
        access brokering or shared-software compromise. Floor scoring is
        correct and disciplined.

        Methodology surfacing note: the operator request flagged "around
        Supply-chain since OAuth consent doesn't fit the classic supply-
        chain-compromise definition" — confirmed: Supply Chain category
        does NOT capture the OAuth consent-grant risk, which is
        Espionage-mechanism-portability and lives in the Espionage scoring
        narrative. Avoiding the temptation to inflate Supply Chain Intent
        to capture mechanism-portability is correct doctrine application.
      sources: []
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Iran/IRGC-IO — willingness floor irrespective of category; no diplomatic brake on supply-chain operations if cluster pivoted, but no current intent."
    capability:
      score: 1
      label: not-capable
      novelty_modifier: 0
      evidence: |
        Capability=1 floor — no documented Charming Kitten supply-chain
        capability in the public reporting corpus. The doctrine red-flag
        check applies: the temptation to score Capability=3 "because
        nation-states can do supply-chain ops" is explicitly disqualified
        by methodology — that is not evidence of capability X. HYPERSCRAPE
        and the OAuth-consent tradecraft are direct-target tools, not
        supply-chain compromise tools.
      sources: []
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: "N/A — no supply-chain capability scored; novelty modifier neutral."
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: "No first-party Splunk hits; no supply-chain-specific IOCs in published indicator set."
    final_intent: 1
    final_capability: 1
    composite: 2
    threat_level: LOW
    ioc_bonus_applied: 0

