[project]
name = "theharvester-mcp"
version = "0.1.0"
description = "theHarvester MCP server for Archimedes — passive subdomain / host / vhost / ASN enumeration via subprocess wrapper"
readme = "README.md"
authors = [
    { name = "Ryan", email = "ryansketch01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.0",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
theharvester-mcp = "theharvester_mcp:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
