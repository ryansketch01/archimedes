    provisional_reason: "First Archimedes-corpus citation via finding-2026-05-13-FLASH-1800-0001 as a relay of Symantec's MuddyWater / Seedworm Q1 2026 multi-victim attribution. ICS/OT-focused security media outlet. Conservative provisional B starting grade for the media-relay tier per same precedent as SecurityWeek (2026-05-06)."
    relay_layer_conflation_observed_2026_05_13: |
      Relay-layer conflation observed on first-citation surface. Industrial Cyber's coverage of the
      Symantec MuddyWater Q1 2026 multi-victim campaign introduced a "U.S. defense and aerospace
      software supplier with Israeli operations" victim claim that is NOT present in the Symantec
      primary (https://www.security.com/threat-intelligence/iran-seedworm-electronics). Treated by
      Archimedes grader / briefer / red-team as cross-campaign conflation with the separate March 2026
      Symantec Dindoor/Fakeset US-critical-infrastructure campaign (different malware family, different
      victim set). The A&D-supplier claim was NOT propagated into finding-2026-05-13-FLASH-1800-0001
      per Hard Rule 2 (no first-time attribution origination via relay). Re-evaluates only if Symantec
      primary updates to name an A&D-supplier victim, or if an independent A/B-grade source corroborates
      the claim with explicit A&D-prime naming within the 24-72h post-disclosure window (deadline
      2026-05-16 18:00 EDT). If the conflation pattern recurs on subsequent Industrial Cyber relays,
      consider downgrade to C.
    awaiting_ratification: true
    active: true
    urls:
      - https://industrialcyber.co/

