hunt_queries:
  - id: unc3753-hunt-actor-ipv4
    platform: splunk
    title: "UNC3753 — Mandiant actor IPv4 hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (src_ip IN ("192.236.147.131","192.236.147.138","193.141.60.212",
                  "192.236.154.158","192.236.146.173","174.169.162.62",
                  "64.94.84.97")
        OR dest_ip IN ("192.236.147.131","192.236.147.138","193.141.60.212",
                       "192.236.154.158","192.236.146.173","174.169.162.62",
                       "64.94.84.97"))
      | stats count by src_ip, dest_ip, dest_port, _time, sourcetype
      | sort -_time
    notes: >
      Any match warrants immediate investigation. These IPs are
      Mandiant-attributed actor infrastructure observed across the
      January-May 2026 UNC3753 campaign.

  - id: unc3753-hunt-leaksite-domain
    platform: splunk
    title: "UNC3753 — LEAKEDDATA leak-site DNS / proxy hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      ("business-data-leaks.com" OR "business-data-leaks[.]com")
      | stats count by user, src_ip, dest, sourcetype, _time
      | sort -_time
    notes: >
      DNS lookups, proxy logs, or threat-intel feed mentions of the
      LEAKEDDATA data-leak-site domain. Any internal-user lookup is
      noteworthy (extortion-checkout pattern).

  - id: unc3753-hunt-phishing-template
    platform: splunk
    title: "UNC3753 — phishing-domain template hunt (org-name suffix)"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes sourcetype=*dns* OR sourcetype=*proxy*
      (query="*-itdesk.com" OR query="*-it.com" OR query="*-helpdesk.com"
        OR url="*-itdesk.com*" OR url="*-it.com*" OR url="*-helpdesk.com*")
      | stats count by query, url, src_ip, _time
      | sort -_time
    notes: >
      Detection signature for the templated phishing-domain naming
      convention. Match the <yourorg> prefix against Frank's
      operator-tracked org names. May FP on legitimate vendor
      domains; correlate with new-registration WHOIS data.

  - id: unc3753-hunt-tradecraft-chain
    platform: splunk
    title: "UNC3753 — tradecraft-chain hunt (RMM + cURL + msiexec /quiet)"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes sourcetype=*process*
      (process_name IN ("AnyDesk.exe","BomgarRdr.exe","zohoassist.exe",
                        "SuperOps.exe","SuperOps.msi")
       OR (process_name="curl.exe" AND command_line="*msiexec*/quiet*")
       OR (process_name="msiexec.exe" AND command_line="*SuperOps*"))
      | stats count by host, user, process_name, command_line, _time
      | sort -_time
    notes: >
      Commercial RMM installs are legitimate in many environments;
      use this as a hunt baseline. Correlate with new-user spawn,
      after-hours, or remote screen-share session context for
      higher-confidence detection of the UNC3753 tradecraft chain.
