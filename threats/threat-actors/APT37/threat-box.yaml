# ============================================================================
# Score categories
# ============================================================================
scores:
  espionage:
    intent:
      score: 3
      label: sector-association
      willingness_modifier: 0
      evidence: |
        Intent=3 (Sector Association) is the highest score the evidence-minimum
        table supports. Intent=5 (Target-Specific) requires at least one
        A-grade source documenting targeting of the ad-prime-v1 profile (US
        A&D prime, ITAR-regulated, defense-system developer, Tier-1/2 defense
        supplier with classified R&D). NO such source exists in public
        reporting on APT37.

        APT37's dominant documented targeting across 2012–2026 is:
          - North Korean defectors and refugees (multi-vendor: Mandiant 2018,
            Kaspersky 2016–2018, Cisco Talos 2017, Volexity 2021, ESET 2026)
          - South Korean civil society — NGOs, journalists, human-rights
            organizations engaged with refugee populations
          - DPRK-policy researchers and academic specialists studying DPRK
            military/political programs (think-tank-tier targeting)
          - Defense-policy think-tanks (regional, occasionally US) — A&D-
            adjacent at most
          - South Korean industrial sectors per FireEye 2018 — including the
            phrase "aerospace" among broader sector listings (chemicals,
            electronics, manufacturing). This is sector-shaped historical
            South-Korea-domestic targeting, not US-A&D-prime targeting.
          - Diaspora civil society — ESET 2026 Sqgame compromise targeting
            ethnic Koreans in Yanbian Korean Autonomous Prefecture, China,
            with assessed inclusion of North Korean refugees and defectors

        The FireEye 2018 mention of "aerospace" in South Korean industrial
        sector targeting is the closest the public record comes to A&D
        relevance. It supports Intent=3 (Sector Association) on a documented
        A-grade source basis: the actor has historically targeted sector-
        broad industrial categories that include aerospace among others. It
        does NOT support Intent=5: the targeting is sector-shaped, not
        ad-prime-v1-specific, and was directed at South Korean (not US)
        industrial entities. Per the methodology's red-flag note, "if your
        evidence is 'this actor hits government entities and A&D is government-
        adjacent,' downgrade to Intent=3." The same logic applies here —
        sector-broad industrial targeting that lists aerospace alongside
        chemicals and manufacturing is sector-shaped, not target-specific.

        Intent=4 (Ideology Association) was considered and rejected. The
        Ideology slot fits actors driven by ideological opposition to a target
        population (e.g., Charming Kitten's anti-dissident anti-Israel-policy
        anti-US-Iran-policy tasking, where the targeting is ideology-shaped
        across a population-of-interest). APT37 is mission-shaped — the
        targeting traces to specific DPRK regime objectives (defector tracking,
        civil-society coercion, regional intelligence collection) rather than
        to anti-Western-ideology orientation. The dominant target population
        is the actor's own diaspora and adjacent civil-society infrastructure,
        not US-aligned-ideology entities. Intent=3 is the honest read.

        Per Hard Rule 2: this scoring is grounded in cited sources, not in
        Archimedes-originated extrapolation. The roster intake note explicitly
        frames APT37 A&D-prime relevance as "INDIRECT/STRUCTURAL (mobile
        capability + civil-society partner exposure + DPRK roster gap closure);
        A&D-direct targeting is undocumented in public reporting." Scoring
        upholds that framing.
      sources:
        - fireeye-apt37-reaper-2018
        - cisco-talos-rokrat-2017
        - kaspersky-operation-daybreak-2016
        - volexity-inkysquid-2021
        - eset-via-the-record-2026-05-07
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "DPRK — comprehensive sanctions regime, no diplomatic ties with the US, active hostilities posture; no constraints on targeting US-aligned entities."
    capability:
      score: 5
      label: significant
      novelty_modifier: 0
      evidence: |
        Capability=5 (Significant) lands cleanly on the evidence-minimum
        threshold: multiple A-grade sources document active espionage
        capability with confirmed use within the last 24 months.

        A-grade sources (multiple, independent):
          - FireEye/Mandiant Feb 2018 — "APT37 (REAPER): The Overlooked North
            Korean Actor" — most consequential public capability profile;
            documents KARAE, DOGCALL, CORALDECK, POORAIM, RUHAPPY, SLOWDRIFT,
            HAPPYWORK, MILKDROP arsenal alongside operational tradecraft
          - Cisco Talos 2017 — "ROKRAT Reloaded" — documents RokRAT capability;
            sustained as signature APT37 implant 2017–ongoing across multiple
            campaigns and packers
          - Kaspersky 2016 — "Operation Daybreak" — documents Adobe Flash
            zero-day CVE-2016-4117 weaponization; capability for zero-day
            exploitation in spearphishing context
          - Kaspersky 2018 — "ScarCruft continues to evolve" — documents
            tooling iteration including Bluetooth harvester
          - Cisco Talos 2018 — Adobe Flash CVE-2018-4878 weaponization
            documentation; second documented zero-day
          - Volexity 2021 — "InkySquid: The Missing Arsenal" — documents
            BLUELIGHT backdoor and strategic-website-compromise tradecraft
            against South Korean newspaper
          - ESET 2026 (relayed The Record 2026-05-07) — Sqgame Android APK
            supply-chain compromise delivering BirdCall to Yanbian ethnic
            Koreans since November 2024 (14+ month operator-side persistence
            before public disclosure)

        Active-use-within-24-months threshold: comfortably met. ESET 2026
        Sqgame disclosure documents continuous operational tempo from
        November 2024 through 2026. Volexity InkySquid 2021 + Cisco Talos
        RokRAT continuity reporting through 2024 establish multi-year
        ongoing capability between major disclosures.

        Capability spans Windows custom RAT (RokRAT, BLUELIGHT), Android
        backdoor (BirdCall, prior RokRAT mobile variants, Konni-cluster
        Android overlap), supply-chain compromise (Sqgame 2026), strategic
        website compromise (Volexity 2021), zero-day exploitation (CVE-2016-
        4117 Flash, CVE-2018-4878 Flash), and cloud-platform C2 abuse
        (pCloud, Yandex Disk, Dropbox, Google Drive). Cross-platform reach
        and supply-chain initial-access pattern distinguish APT37 from many
        regional-tier APTs.

        Single-source veto on the Sqgame-specific 2026 campaign (per
        finding-2026-05-07-0004 — ESET via The Record alone) does NOT
        constrain the broader Capability=5 assessment, which rests on the
        multi-vendor pre-2026 record. The Sqgame finding adds active-use-
        within-24-months evidence; it does not stand alone in supporting
        the capability assessment.
      sources:
        - fireeye-apt37-reaper-2018
        - cisco-talos-rokrat-2017
        - cisco-talos-group123-2018
        - cisco-talos-rokrat-2018
        - kaspersky-operation-daybreak-2016
        - kaspersky-scarcruft-evolves-2018
        - volexity-inkysquid-2021
        - eset-via-the-record-2026-05-07
        - multi-vendor-apt37-tracking
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: |
        Custom toolset across the arsenal — RokRAT, BLUELIGHT, BirdCall, KARAE,
        DOGCALL are APT37-specific (or APT37-attributed-overlap) custom
        implants, not commodity malware. Cloud-platform C2 abuse (pCloud,
        Yandex Disk, Dropbox, Google Drive) blends operational traffic into
        legitimate HTTPS noise — high defensive difficulty. Supply-chain
        initial-access against compromised legitimate platforms (Sqgame)
        bypasses Play Protect and standard email-security controls. Zero-day
        exploitation history (CVE-2016-4117, CVE-2018-4878) further raises
        defensive difficulty against unpatched targets. No commodity-tooling
        signature (Cobalt Strike, Metasploit, off-the-shelf RATs) dominates
        the arsenal.
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: |
        Splunk first-party check executed 2026-05-10 for actor scoring:
        zero hits across primary IOC search (APT37 OR ScarCruft OR Reaper
        OR InkySquid OR RedEyes OR BirdCall OR RokRAT OR BLUELIGHT OR Sqgame
        OR pcloud.com OR cloud-api.yandex.net) over -30d window, indices
        defenseclaw_local + archimedes. No IOC corroboration bonus applied.
        Mobile-malware (BirdCall) primary distribution to consumer Android
        in Yanbian, China is unlikely to surface in DefenseClaw enterprise
        Splunk telemetry given the consumer-Android targeting profile.
    final_intent: 3
    final_capability: 5
    composite: 8
    threat_level: HIGH
    ioc_bonus_applied: 0

