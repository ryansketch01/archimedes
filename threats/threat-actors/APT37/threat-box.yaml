# threats/threat-actors/APT37/threat-box.yaml
#
# Threat Box scoring per doctrine/THREAT-BOX-METHODOLOGY.md
# Target profile: ad-prime-v1 (mid-to-large US A&D contractor, ITAR-regulated)
#
# Scored 2026-05-10 via /update-tracking (Mode 2). Replaces the 2026-05-09
# TEMPLATE scaffold. Weighted overall 4.9 → MEDIUM → auto-commit per doctrine
# authority table. Espionage category alone scores composite 8 (HIGH at the
# category tier) — preserved in per-category records but does NOT trigger
# Hard Rule 5; only weighted overall does, and weighted overall is MEDIUM.
#
# Operator-anticipated outcome was "HIGH likely on /update-tracking pass."
# Actual computation lands MEDIUM for the same disciplinary reason that
# brought MuddyWater in at LOW one day earlier:
#
#   ESPIONAGE INTENT CAPS AT 3 (Sector Association), NOT 5 (Target-Specific).
#   Per the methodology evidence-minimum table, Intent=5 requires "at least
#   1 A-grade source documenting targeting of ad-prime-v1 profile." NO public
#   reporting documents APT37 targeting a US A&D prime, an ITAR-regulated
#   defense contractor, a defense-system developer, or a Tier-1/2 defense
#   supplier. The dominant reported targeting is civil-society / defectors /
#   Korean-language journalists / DPRK-policy researchers / regional industrial
#   sectors. FireEye 2018's listing of "aerospace" among APT37 industrial
#   sector targeting in South Korea is sector-shaped (Intent=3), not target-
#   specific (Intent=5). The recent ESET 2026 Sqgame finding names ethnic
#   Koreans in Yanbian, China — diaspora civil society, not A&D. The roster
#   intake note framed this honestly: "A&D-prime relevance is INDIRECT/
#   STRUCTURAL (mobile capability + civil-society partner exposure + DPRK
#   roster gap closure); A&D-direct targeting is undocumented in public
#   reporting." Scoring upholds that framing.
#
#   Intent=4 (Ideology Association) was considered and rejected. APT37 is
#   mission-shaped (defector tracking, regime-security collection, civil-
#   society coercion) rather than anti-Western-ideology-shaped. The Ideology
#   slot fits actors driven by ideological opposition to a target population
#   (e.g., Charming Kitten's anti-dissident tasking against Iranian diaspora,
#   regime-critics, Israel- or US-policy figures). APT37 doesn't fit that
#   shape against US A&D primes — there is no documented anti-A&D ideological
#   targeting. Intent=3 (Sector Association) is the honest read with
#   multi-A-grade backing.
#
# Capability=5 (Significant) lands cleanly: multiple A-grade sources document
# active use within the last 24 months (ESET 2026 Sqgame disclosure with
# 14+ month operator-side persistence, Volexity 2021 InkySquid, sustained
# RokRAT campaigns through 2024 per multi-vendor reporting). The five-source
# threshold is comfortably exceeded across FireEye/Mandiant 2018, Kaspersky
# 2016–2018, Cisco Talos 2017–ongoing, Volexity 2021, ESET 2024–2026.
#
# Espionage composite 8 (HIGH at category tier) is the structural risk the
# operator's roster note pointed at: this actor has serious capability and
# could pivot to A&D-relevant targets. The methodology correctly captures
# this as a HIGH-tier category-level finding while NOT producing an overall
# HIGH that would trigger the human gate, because four other categories
# weight the overall down. That's the doctrine working as designed.
#
# Supply-chain composite 6 (MEDIUM) reflects the demonstrated capability
# (Sqgame Android APK supply-chain compromise per ESET 2026, 14+ month
# dwell) tempered by Intent=2 (Regional Association) — Sqgame targeting is
# diaspora-civil-society, not A&D supply chain. Capability=4 (Credible) on
# 1 A-grade source documenting an active supply-chain operation. Novelty=0
# (compromised legitimate platform with web-browser sideload bypass is
# semi-custom-to-custom in execution, not commodity).
#
# Destructive scoring honors the explicit caveat from the TEMPLATE:
# Capability=2 (Possible — RUHAPPY capability-existence per FireEye 2018 with
# no public deployment), Intent=1 (Target of Opportunity / no documented
# destructive operations against any victim). Novelty=1 (legacy semi-custom).
# Composite=2 → LOW. Distinct from Lazarus / Sandworm / Stardust Chollima
# destructive track records.
#
# Disruptive Intent=1, Capability=1: no documented disruptive operations.
# APT37 mission profile is collection / coercion, not service-disruption.
# Composite=2 → LOW.
#
# Cyber-crime Intent=1, Capability=1: state-aligned MSS espionage actor,
# NOT financially-motivated. Distinct from RGB-attributed Lazarus and
# Stardust Chollima which DO have financial-revenue-generation tasking.
# Composite=2 → LOW.
#
# This is the FIFTH consecutive non-HIGH outcome in the recent /update-tracking
# series (UNC1549 5.4 MEDIUM, Charming Kitten 4.45 LOW, MuddyWater 4.15 LOW,
# APT34 4.9 MEDIUM, APT37 4.9 MEDIUM). Empirical pattern: actors whose
# documented targeting is regional / sector-broad / civil-society / dissident-
# diaspora cap at Intent=3-4, which produces espionage composites 7-8 (MEDIUM
# to HIGH at category tier), and the four other categories — usually all at
# floor for state-aligned espionage actors with no destructive / disruptive /
# financial track record — dilute via doctrine weighting to overall MEDIUM
# or LOW. The HIGH overall threshold (weighted >=8 per doctrine; band 8-10
# rounded) effectively requires either (a) Intent=5 in espionage on documented
# A&D-direct targeting AND high marks in another category, or (b) HIGH-tier
# composites in two or more weighted-significant categories. The five recent
# scorings demonstrate the gate is calibrated tightly enough to be meaningful;
# none of these five actors fit the A&D-direct-targeting profile that would
# justify HIGH overall, and the methodology refuses to invent it.

actor_id: "024"
