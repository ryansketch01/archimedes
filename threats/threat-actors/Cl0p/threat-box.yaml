    MEDIUM overall is a WEIGHTING ARTIFACT, not a statement of low risk. The methodology
    weights espionage at 35%, which structurally understates a pure criminal-extortion
    actor whose espionage/destructive/disruptive categories are near-floor. The
    analytically-correct headline is the supply_chain category HIGH (composite 8): Cl0p
    reaches A&D primes through the ubiquitous MFT/ERP/PLM platforms the DIB runs on. This
    parallels the roster pattern where category-HIGH criminal/OT actors (e.g. CyberAv3ngers
    disruptive-HIGH, UNC1549 espionage-HIGH) sit under a MEDIUM/LOW weighted overall.

