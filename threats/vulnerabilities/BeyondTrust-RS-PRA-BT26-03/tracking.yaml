# ============================================================================
# A&D relevance
# ============================================================================

ad_relevance: high
ad_relevance_rationale: >
  BeyondTrust RS and PRA are privileged-remote-access / vendor-access-broker
  infrastructure widely deployed across the defense industrial base to mediate
  administrator and third-party access into sensitive estates. Unauthenticated
  network-vector compromise of that broker (CVE-2026-40138 / -40139, CVSS 9.2)
  sits at a high-value chokepoint gating access to ITAR-regulated R&D and
  government-contract systems — same defensive framing as VT-007
  FortiAuthenticator (identity/access infrastructure). CAVEAT: the A&D nexus
  here is STRUCTURAL (product-class DIB deployment + ~2,000 internet-exposed
  instances per Shadowserver), NOT anchored to any named A&D-watchlist victim
  in this reporting. CVE-2026-40138's specific-auth-config precondition narrows
  universal applicability. No ITW and no actor attribution today; priority
  rests on patch-hygiene for exposed on-prem estates.

