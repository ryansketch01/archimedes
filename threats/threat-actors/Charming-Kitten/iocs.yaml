      - mstic-2026-05-04

  # --------------------------------------------------------------------------
  # OAuth application consent — behavioral indicator (T1528)
  # --------------------------------------------------------------------------
  # This is the most operationally consequential indicator class in the dossier.
  - id: charming-kitten-behavioral-oauth-policy-review-tool
    type: other
    type_detail: oauth_application_consent
    value: |
      Attacker-controlled OAuth application — display name "Policy Review Tool"
      requesting Mail.Read + Mail.ReadWrite scopes via Entra ID consent dialog.
      Persistence survives password resets.
    role: persistence
    mitre_attack_technique: T1528
    mitre_attack_url: "https://attack.mitre.org/techniques/T1528/"
    description: |
      Attacker registers an Entra ID application with deceptive display name
      ("Policy Review Tool" observed) and requests delegated Mail.Read +
      Mail.ReadWrite permission scopes. Targets click through OAuth consent
      dialog; application receives access tokens for the user's mailbox.
      Persistence survives password resets — the tradecraft is the
      operationally consequential 2026 delta from prior credential-phishing-
      only operations.
    detection_scope: |
      MECHANISM-LEVEL — NOT actor-specific. The OAuth consent-grant tradecraft
      is platform-generic. Hunt for unauthorized consent-to-application events
      with high-risk Mail scopes regardless of which actor is currently
      executing the technique. The "Policy Review Tool" display name is the
      observed-2026 specific instance; future variants will use different
      deceptive display names.
    detection_artifacts:
      - "Add service principal events for unfamiliar publishers"
      - "Consent to application events with Mail.Read or Mail.ReadWrite scopes outside admin-consent flow"
      - "New OAuth applications with policy-review / paper-draft / research-collaboration framing in display name"
      - "High-risk scope grants from non-admin users"
    related_campaign: "Charming Kitten Q2 2026 OAuth-consent campaign"
    red_team_distinction: |
      Red-team review on finding-2026-05-05-0002 issued required briefer
      caveats. The OAuth tradecraft is FORWARD-LOOKING / MECHANISM-BASED
      A&D risk — NOT observed prime-direct activity. Vendors named
      think-tank, academic, journalist victims; no defense primes named
      as victims. Brief / dossier consumers must keep this distinction
      explicit.
    source_brief: finding-2026-05-05-0002
    source_origin:
      - mstic-2026-05-04

# ============================================================================
# Hunt queries
# ============================================================================
hunt_queries:

  - id: charming-kitten-hunt-entra-consent-mail-scopes
    platform: m365
    title: "Hunt for Entra ID consent-to-application events with high-risk Mail scopes"
    query_type: kql
    targets_indicators:
      - charming-kitten-behavioral-oauth-policy-review-tool
    priority: highest
    note: |
      This is the highest-priority hunt for any A&D prime estate per the red-team
      qualify directive in finding-2026-05-05-0002. The hunt is mechanism-level,
      not actor-specific.
    query: |
      AuditLogs
      | where TimeGenerated > ago(90d)
      | where OperationName in ("Consent to application", "Add app role assignment grant to user")
      | extend ConsentScopes = tostring(parse_json(tostring(TargetResources[0].modifiedProperties))[0].newValue)
      | where ConsentScopes has_any ("Mail.Read", "Mail.ReadWrite", "Mail.Send", "Mail.ReadWrite.All")
      | where Result == "success"
      | project TimeGenerated, OperationName, InitiatedBy, TargetResources, ConsentScopes
      | order by TimeGenerated desc
      // FP consideration: legitimate enterprise applications (Outlook mobile,
      // third-party email clients, productivity suites) consent to Mail scopes
      // routinely. Tune by allowlisting verified enterprise OAuth apps; alert
      // on consent grants to applications NOT in the enterprise allowlist.

  - id: charming-kitten-hunt-deceptive-oauth-app-registrations
    platform: m365
    title: "Hunt for new OAuth application registrations with deceptive display names"
    query_type: kql
    targets_indicators:
      - charming-kitten-behavioral-oauth-policy-review-tool
    query: |
      AuditLogs
      | where TimeGenerated > ago(90d)
      | where OperationName in ("Add service principal", "Add application")
      | extend AppDisplayName = tostring(TargetResources[0].displayName)
      | where AppDisplayName has_any (
          "Policy Review", "Research Tool", "Paper Review",
          "Conference Tool", "Academic", "Collaboration",
          "Document Review"
        )
      | project TimeGenerated, OperationName, AppDisplayName, InitiatedBy, TargetResources
      // FP consideration: legitimate enterprise tooling may match these substrings.
      // Triage seed, not high-confidence alert. Pair with consent-event correlation.

  - id: charming-kitten-hunt-dns-c2
    platform: splunk
    title: "Hunt for outbound DNS to Charming Kitten OAuth phishing and HYPERSCRAPE C2 domains"
    query_type: spl
    targets_indicators:
      - charming-kitten-domain-login-microsoft365-secure
      - charming-kitten-domain-m365-policy-review
      - charming-kitten-domain-hyperscrape-update
    query: |
      index=defenseclaw_local sourcetype=dns
      | eval domain=lower(query)
      | where domain IN (
          "login-microsoft365-secure.com",
          "m365-policy-review.org",
          "hyperscrape-update.net"
        )
      | stats count earliest(_time) latest(_time) by src, domain
      | sort - count
      # FP consideration: very low. Hits are operationally significant.

  - id: charming-kitten-hunt-ipv4-c2
    platform: splunk
    title: "Hunt for outbound HTTPS to Charming Kitten C2 IPv4"
    query_type: spl
    targets_indicators:
      - charming-kitten-ipv4-194-87-44-99
    query: |
      index=defenseclaw_local sourcetype=stream:tcp OR sourcetype=zeek_conn
      | where dest_ip = "194.87.44.99" OR src_ip = "194.87.44.99"
      | stats count earliest(_time) latest(_time) by src_ip, dest_ip, dest_port
      | sort - count
      # FP consideration: very low. Hits are operationally significant.

  - id: charming-kitten-hunt-hyperscrape-hash
    platform: edr
    title: "Hunt for HYPERSCRAPE 2026 variant staging hash"
    query_type: pseudo
    targets_indicators:
      - charming-kitten-sha256-hyperscrape-2026
    query: |
      ON ENDPOINTS:
        SCAN file_hashes (-90d) for:
          7a8b9c0d1e2f3041526374859607a1b2c3d4e5f60718293a4b5c6d7e8f9001122
        ALERT on match
      # FP consideration: very low. Hits are operationally significant.

  - id: charming-kitten-conditional-access-posture-audit
    platform: m365
    title: "Posture audit — Conditional Access enforcement for high-risk OAuth scopes"
    query_type: pseudo
    note: "Preventive posture audit, not a detection hunt. Pair with consent-event hunt."
    query: |
      QUERY Entra Conditional Access:
        CHECK whether policy enforces "Block consent from unverified publishers"
        CHECK whether admin-consent is required for Mail.Read / Mail.ReadWrite scopes
        CHECK whether MFA is required for OAuth consent flows
        ALERT IF any of the above is NOT enforced

