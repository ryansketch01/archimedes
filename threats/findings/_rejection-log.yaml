  - rejection_id: reject-2026-05-08-0001
    rejected_at: 2026-05-08T08:30:00-04:00
    grading_run_id: morning-20260508-080000
    rejected_by: grader
    raw_signal_members:
      - raw-2026-05-07-flash-1800-002-the-record-muddywater-relay
      - raw-2026-05-08-am-003-the-record-muddywater-chaos-rapid7-relay
    cluster_topic: "The Record (Jonathan Greig) two-publication relay of Rapid7's MuddyWater / Chaos-decoy attribution; no new evidence, no new IOCs, no new TTPs, attribution remains Rapid7 single-source"
    rejection_reasons:
      - relay_only_independence_test_fails
      - no_new_evidence_added
      - 72h_attribution_veto_clock_currently_active_on_subject_actor
      - anti_noise_repeat_topic_within_24h_window
      - hard_rule_2_attribution_origination_risk
    rejection_detail: >
      Cluster fails to clear B2 action-item or C3 monitoring threshold for
      promotion. Specific reasoning:

        (1) Both raw-signal items in the cluster are pure relays of
            Rapid7's 2026-05-06 MuddyWater Chaos-ransomware-decoy
            attribution (already absorbed by finding-2026-05-06-FLASH-0002
            and an active 72h auto-downgrade clock per _roster.yaml note
            022, resolution ~2026-05-09 12:00 EDT). The Record
            (raw-2026-05-07-flash-1800-002 published 2026-05-07T17:30
            EDT and raw-2026-05-08-am-003 published 2026-05-07T21:30
            UTC) explicitly attributes to Rapid7 in both pieces, names
            the Rapid7 IR analysts (Alexandra Blia, Ivan Feigl), and
            reproduces Rapid7's confidence language. Per
            INTEL-GRADING.md "Two sources are NOT independent if one is
            a rewrite/aggregation of the other," The Record's coverage
            is a rewrite of Rapid7 — independence test fails.

        (2) No new evidence. No new IOCs. No new TTPs beyond what
            Rapid7 disclosed. Historical-context additions in The
            Record articles (FBI warnings on Iranian/ransomware
            partnerships, Pay2Key Pay2Key healthcare February
            incident, Stryker medical device damage) are framing,
            not new attribution or new TTP for this campaign.

        (3) 72h attribution-veto clock currently active. Promoting a
            relay-only second-source-coverage finding during the
            active veto window would risk the appearance of
            independent corroboration where none exists. The Record's
            two articles do NOT advance the corroboration count toward
            72h clock resolution.

        (4) Anti-noise rule applies. Same MuddyWater Chaos-decoy
            topic was the 2026-05-06 12:00 EDT FLASH and was the
            2026-05-07 afternoon brief discussion. Two further relay
            articles in 24h does NOT promote to fresh finding —
            material content (FBI warning context) folds into update
            history of finding-2026-05-06-FLASH-0002 if briefer
            chooses, but a separate finding would compound the
            apparent attribution weight without adding evidence.

        (5) Hard Rule 2 attribution origination risk. Promoting two
            relay articles as a corroborating-finding cluster could
            be misread as Archimedes weighting the MuddyWater
            attribution upward despite single-source primary state.
            Hard Rule 2 prohibits such weighting.

      Recommended re-grading path:
        (a) If a second independent A/B-grade vendor (Mandiant, MSTIC,
            CrowdStrike, Unit 42, ESET, Sophos) publishes
            corroborating MuddyWater attribution for the
            2026-Chaos-decoy campaign before 2026-05-09 12:00 EDT,
            re-grade and lift 72h veto.
        (b) If 72h clock expires without independent corroboration,
            briefer applies the auto-downgrade per _roster.yaml note
            022.
        (c) Today's relay-only items contribute zero to (a) or (b).

    sources:
      - source_yaml_id: the-record
        grade: B
        role: relay_only_of_rapid7
    would_be_digraph: B3_with_independence_test_failed
    review_notes: >
      Retain for 1 year per LEGAL-POLICY data-handling table. Mirror of
      reject-2026-05-07-0001 reasoning pattern (procedural rejection,
      not substantive — claim itself may be true, but cannot be promoted
      as corroborating evidence). Both raw-signal items reference the
      72h clock explicitly in their own flash_trigger_evaluation blocks.

  - rejection_id: reject-2026-05-08-0002
    rejected_at: 2026-05-08T08:32:00-04:00
    grading_run_id: morning-20260508-080000
    rejected_by: grader
    raw_signal_members:
      - raw-2026-05-08-am-007-trellix-ransomhouse-claim
    cluster_topic: "RansomHouse names Trellix on leak site claiming breach with screenshots of internal services; Trellix acknowledges but denies source-code/distribution-process compromise; no A&D nexus claimed"
    rejection_reasons:
      - non_roster_actor_no_tracked_attribution
      - single_source_uncorroborated
      - no_a_and_d_nexus
      - hard_rule_2_actor_attribution_self_claimed_only
      - novel_attribution_origination_risk_if_promoted
    rejection_detail: >
      Cluster fails to clear B2 action-item threshold and is borderline
      C3 monitoring. Specific reasoning:

        (1) RansomHouse is NOT in threats/threat-actors/_roster.yaml as
            of 2026-05-08. The actor-on-victim attribution is
            self-claimed by RansomHouse on its own leak site —
            self-attribution by a criminal actor is not corroborating
            evidence per INTEL-GRADING.md (treated as E-grade if
            considered as a source at all). Trellix has acknowledged
            "the situation" but denied source-code/distribution-
            process compromise; Trellix has neither confirmed nor
            denied RansomHouse's identity claim.

        (2) Single secondary source (SecurityWeek). No second-source
            corroboration in the available window. Independence test
            cannot pass on a single-relay cluster.

        (3) No A&D nexus claimed. Trellix is a security vendor (XDR/
            EDR provider) with broad customer base including some A&D
            primes but no specific defense-contractor implication.
            Article notes "potential connection" to Checkmarx / Aqua
            Security / Bitwarden supply-chain incidents but
            establishes NO confirmed link.

        (4) Hard Rule 2 — promoting the RansomHouse-claims-Trellix
            attribution to a finding would risk Archimedes
            originating the attribution at higher confidence than the
            evidence base supports (RansomHouse's own claim + Trellix's
            partial acknowledgement is not the same as confirmed
            RansomHouse responsibility for a Trellix breach). Per
            attribution standards: "If only one source attributes,
            the brief says 'per [source]' — never implies broader
            consensus." Promoting this would imply broader consensus.

        (5) Existing Trellix coverage. finding-2026-05-04-0004 (Trellix
            source-code repository hack disclosure 2026-05-04) is on
            the books. The RansomHouse claim could plausibly be
            related — it could be the same incident with attribution
            now surfaced — or it could be a separate breach claim
            piggybacking on the earlier disclosure. SecurityWeek does
            not establish which. Promoting a RansomHouse-named
            attribution finding without resolving this ambiguity risks
            confusing the Trellix-incident timeline.

      Recommended re-grading path:
        (a) If a second independent A/B-grade source corroborates
            the RansomHouse-claims-Trellix attribution — for example,
            Trellix's own incident-response disclosure naming
            RansomHouse, or A-grade vendor research linking
            RansomHouse to the Trellix screenshots — re-grade.
        (b) If RansomHouse meets /new-actor criteria (sustained
            activity, A&D-nexus pattern, >3 victims of strategic
            relevance), actor-profiler may evaluate roster addition.
        (c) Watch finding-2026-05-04-0004 update_history for any
            Trellix follow-up disclosure that links to RansomHouse.

    sources:
      - source_yaml_id: securityweek
        grade: B
        role: relay_of_ransomhouse_self_claim
    would_be_digraph: B4_at_best_actor_self_claim_uncorroborated
    review_notes: >
      Retain for 1 year per LEGAL-POLICY data-handling table.
      RansomHouse is well-known externally as a data-extortion group
      active for several years; not adding to roster is a /new-actor
      decision, not a grader determination. Flag remains for
      actor-profiler review queue. The Trellix-vendor breach pattern
      is operationally relevant to A&D defenders running Trellix
      products (vendor advisory monitoring) but does not promote on
      this raw-signal alone.

  - rejection_id: reject-2026-05-07-0001
    rejected_at: 2026-05-07T16:21:00-04:00
    grading_run_id: afternoon-20260507-160000
    rejected_by: grader
    raw_signal_members:
      - raw-2026-05-07-pm-002-muddywater-chaos-ransomware-decoy
    cluster_topic: "BleepingComputer (feed-listing only): MuddyWater allegedly uses Chaos ransomware as decoy in Microsoft Teams social-engineering campaign"
    rejection_reasons:
      - source_chain_unverified_full_body_not_fetched
      - corroboration_status_pending_verification
      - novel_attribution_corroboration_blocked_by_relay_uncertainty
      - 72h_attribution_veto_clock_currently_active_on_subject_actor
    rejection_detail: >
      Cluster fails to clear B2 action-item or C3 monitoring threshold for
      promotion. Specific reasoning:

        (1) Source chain unverified. Article body was not fetched in this
            sweep — only feed-listing surfaced. Without full-body fetch,
            cannot determine whether BleepingComputer is relaying Rapid7's
            prior MuddyWater attribution (which would NOT count as
            independent corroboration per INTEL-GRADING.md "Two sources are
            NOT independent if one is a rewrite/aggregation of the other")
            or citing a different originating source (which COULD count as
            second B/A-grade attribution).

        (2) Active 72h attribution-veto clock on the subject. MuddyWater
            (roster id 022) is currently under a 72h auto-downgrade clock
            on the 2026-campaign attribution per Rapid7 single-source
            veto, resolving ~2026-05-09 12:00 EDT per _roster.yaml note.
            All 2026-campaign surfaces carry attribution caveat (Rapid7
            moderate confidence) and are NOT promoted as MuddyWater-
            canonical pending second A/B-grade independent source. Given
            the relay-uncertainty in (1), promoting this cluster as a
            second-source corroboration of MuddyWater attribution would
            be premature and risk Hard Rule 2 violation.

        (3) Zero IOCs in the available source text. No IPs, no domains,
            no hashes, no specific victim, no specific CVE referenced, no
            date range. Defender-actionability is null without IOC content.

        (4) MuddyWater dossier is first-pass with TEMPLATE threat-box
            scoring; promoting an attribution-corroboration finding into
            an unsettled dossier risks compounding the corroboration
            uncertainty.

      Recommended re-grading path:
        (a) Collector re-fetches full BleepingComputer article body in
            next sweep window. Identifies originating source chain
            explicitly.
        (b) IF originating source is Rapid7 → relay-only confirmation,
            does NOT lift the 72h veto, can be cataloged in raw-signal
            archive but does not promote.
        (c) IF originating source is independent of Rapid7 (e.g., another
            vendor — CrowdStrike, Mandiant, ESET, MSTIC) → re-grade as
            potential second B/A-grade corroboration. Could lift 72h
            veto in MuddyWater's favor before 2026-05-09 12:00 EDT clock
            resolves.

      If this claim resurfaces with a verified independent source chain,
      regrade.

    sources:
      - source_yaml_id: bleepingcomputer
        grade: B
        role: relay_only_full_body_not_fetched
    would_be_digraph: B3_pending_source_chain_verification
    review_notes: >
      Retain for 1 year per LEGAL-POLICY data-handling table (rejected-
      finding retention). Re-graders: see /investigate MuddyWater workflow
      if claim resurfaces, or wait for next BleepingComputer fetch with
      article body. Specifically note that this rejection is PROCEDURAL
      (corroboration-state pending verification), not substantive — the
      claim itself may well be true; we simply cannot grade it cleanly
      without the source-chain detail.

  - rejection_id: reject-2026-05-08-0003
    rejected_at: 2026-05-08T16:36:00-04:00
    grading_run_id: afternoon-20260508-160000
    rejected_by: grader
    raw_signal_members:
      - raw-2026-05-08-pm-007-pamdoora-linux-backdoor-russian-cybercrime-forum
    cluster_topic: "PamDOORa Linux PAM-stack backdoor source code marketed by 'darkworm' on Russian cybercrime forum for $900; SecurityWeek 'In Other News' one-line digest only; no primary research surfaced; no IOCs of operational value"
    rejection_reasons:
      - no_primary_research_identified
      - single_source_aggregator_relay_only
      - no_iocs_of_operational_value
      - cannot_be_judged_without_primary_source
      - below_c3_monitoring_threshold
    rejection_detail: >
      Cluster fails to clear C3 monitoring threshold for promotion.
      Specific reasoning:

        (1) SecurityWeek's "In Other News" column carries a one-line
            digest item flagging PamDOORa being marketed by underground
            forum handle 'darkworm' for $900. Collector explicitly
            notes "primary research not yet identified in this sweep —
            likely from a smaller researcher or vendor that
            SecurityWeek aggregated." Without primary research,
            grading the technical claims is not possible — closest
            defensible grade is B6 (B-grade media source, but
            information cannot be judged at all without primary
            research). B6 falls below C3 monitoring threshold.

        (2) Single-source effective: SecurityWeek aggregator-relay
            only. No second-source corroboration. Independence test
            cannot be evaluated without identifying the primary
            researcher. The "darkworm" forum handle is underground-
            marketplace observation only — not actor attribution
            (forum handles are interchangeable / disposable).

        (3) No IOCs of operational value. The article body provides
            no hashes, no specific PAM module names, no file paths,
            no detection signatures. PAM-backdoor pattern is real
            and well-known, but pattern is not operational defender
            content without specific malware artifacts. The
            "audit /etc/pam.d/* and /lib/security/" mitigation is
            generic Linux hygiene guidance applicable to all PAM
            backdoors, not specific to PamDOORa.

        (4) Source-code-for-sale signal is interesting but low-
            confidence. $900 underground pricing suggests broad
            availability rather than bespoke nation-state tooling;
            Russian-forum origin is conventional for commodity
            Linux-server tooling. The signal-noise ratio is too low
            for finding promotion without primary research.

        (5) A&D-target relevance: indirect at best. PAM backdoors
            apply to any Linux estate — A&D primes operate large
            Linux server fleets, but no specific A&D targeting is
            reported. Generic-relevance signals do not promote in
            isolation.

      Recommended re-grading path:
        (a) If a primary research source surfaces for PamDOORa
            (vendor analysis, named researcher publication,
            sandbox report) with technical artifacts (hashes,
            file paths, configurations), re-grade.
        (b) If primary research includes specific A&D targeting
            or specific IOCs that overlap with first-party Splunk
            telemetry, FLASH-evaluate.
        (c) Otherwise the signal stays in raw-signal archive
            (90-day retention) and may be re-surfaced via
            keyword tracking.

    sources:
      - source_yaml_id: securityweek
        grade: B
        role: aggregator_relay_only_no_primary_identified
    would_be_digraph: B6_cannot_be_judged_without_primary_research
    review_notes: >
      Retain for 1 year per LEGAL-POLICY data-handling table.
      Procedural rejection — claim itself may be true (PAM-backdoor
      pattern is well-established and PamDOORa-specific malware may
      well exist) but cannot be graded cleanly without primary
      research. If PamDOORa resurfaces via A/B-grade primary research
      source, regrade. Signal worth keyword-tracking for next 30 days.

