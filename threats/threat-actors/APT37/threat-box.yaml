# Per operator direction (2026-05-09 Mode-1 scaffold), the threat-box-scoring
# skill was NOT invoked at dossier creation. Rationale: APT37 is an active
# DPRK-attributed APT (MSS per ESET 2026 framing) with an extensive 2012+
# multi-vendor track record. Likely scoring outcome: HIGH overall — driven
# by sustained operational tempo, multi-decade history, mobile capability,
# supply-chain initial-access pattern, and cross-platform tooling — which
# would trigger Hard Rule 5 (/approve-scoring 024) before commit.
#
# However, A&D-prime relevance is INDIRECT and STRUCTURAL rather than direct
# (no defense-prime targeting documented in public reporting). The scoring
# discipline must respect this distinction:
#   - Espionage Intent against the Archimedes A&D-prime target profile is
#     LOWER than for actors with documented A&D-prime targeting (UNC1549,
#     APT28). Civil-society + defector-tracking + occasional defense-think-
#     tank targeting is A&D-adjacent, not A&D-direct.
#   - Capability scoring is HIGH on absolute terms (mobile + Windows custom
#     tooling, supply-chain compromise capability, sustained operational
#     tempo) regardless of A&D-prime-specific targeting.
#   - Supply-chain scoring is HIGH — Sqgame APK supply-chain compromise is a
#     direct supply-chain operation, but against consumer-Android distribution,
#     not against A&D supply chains.
#   - Destructive — the FireEye 2018 disclosure documents RUHAPPY (suspected
#     wiper / MBR-overwrite) but no current-generation destructive operations.
#     Keep destructive intent caveated; score against current-generation
#     evidence, not against legacy RUHAPPY existence alone.
#   - Cyber-crime LOW — APT37 is state-aligned MSS espionage, not financially-
#     motivated.
#
# Leaving this template empty defers the scoring decision to a deliberate
# /update-tracking pass with the human gate intact.
#
# CRITICAL SCORING DISCIPLINE (carry forward to /update-tracking):
#   - Score Espionage against the A&D target profile, NOT against APT37's
#     dominant target profile (civil society / defectors). This is the
#     methodological honest move: APT37 has HIGH espionage capability against
#     ITS target population; the question for the Archimedes threat box is
#     espionage capability + INTENT against the A&D prime, which is lower.
#   - Single-source veto on the Sqgame / BirdCall campaign per
#     finding-2026-05-07-0004 (ESET via The Record alone). Historical APT37
#     attribution is multi-vendor (FireEye, Kaspersky, Cisco Talos, Volexity)
#     so the broader Capability assessment is NOT single-sourced.
#   - Hard Rule 2: APT37 attribution to MSS is per ESET via The Record's
#     framing. Earlier reporting (FireEye 2018, Kaspersky 2018, Cisco Talos
#     2017) attributed broadly to "North Korean state interests" without
#     specifying MSS vs. RGB. Scoring should reflect this attribution lineage.

