      Cluster fails to meet ANY FLASH trigger threshold and is therefore
      not promoted to a finding at FLASH severity. Specific reasoning:

        (1) CVE-2026-45185 is a real critical-class CVE in Exim 4.97
            through 4.99.2 (use-after-free in TLS shutdown during BDAT
            chunking). Exim is widely deployed across enterprise MTAs
            including some A&D estates. BUT:
              - PATCH SHIPPED 2026-05-12 in Exim 4.99.3, one day BEFORE
                the BleepingComputer disclosure on 2026-05-13.
                Pre-patch active-exploitation window did NOT exist.
              - CVSS score NOT ASSIGNED in the article (no NVD entry
                or vendor CVSS at time of publication).
              - NO in-the-wild exploitation reported. The article
                explicitly frames the disclosure as a theoretical /
                AI-LLM proof-of-concept narrative built around XBOW
                researcher Federico Kirschbaum's work. The
                researcher's own quoted hedge ("I don't think LLMs
                alone are quite ready to write exploits") forecloses
                the active-exploitation framing.

        (2) FLASH Trigger 1 (critical-CVE-exploited) FAILS on the
            active_exploitation false condition AND on the no-pre-
            patch-window condition. Either fail alone is sufficient
            to reject Trigger 1.

        (3) FLASH Trigger 6 (zero-day-no-patch) FAILS on the
            patch_status: patched condition. A vulnerability with a
            shipped vendor patch one day before disclosure is by
            definition not a zero-day-no-patch surface.

        (4) Related-but-distinct from CVE-2026-40364 Exim BDAT cohort
            already in 2026-05-12 corpus (finding-2026-05-12-0003
            Microsoft Patch Tuesday + finding-2026-05-12-0004 Fortinet
            PSIRT did NOT cover Exim; the CVE-2026-40364 reference is
            from collector cross-corpus survey at non-finding tier).
            Anti-noise is secondary; primary rejection is no-
            qualifying-FLASH-trigger.

        (5) Disposition: signal logged to vuln-tracker review queue
