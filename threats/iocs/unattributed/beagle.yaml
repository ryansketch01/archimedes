# threats/iocs/unattributed/beagle.yaml
#
# Unattributed cluster — IOCs surfaced by Sophos research (relayed via
# BleepingComputer) on a counterfeit Claude AI distribution site
# delivering the previously-undocumented Beagle Windows backdoor.
#
# Sophos hedges with "the same operators behind PlugX might be
# experimenting with a new payload." This is hedged speculation, not
# attribution. Hard Rule 2 forbids Archimedes from originating a
# cross-walk to APT41 (roster id 019) or any other PlugX-using actor
# on the basis of that hedge. Filed here pending corroboration.

