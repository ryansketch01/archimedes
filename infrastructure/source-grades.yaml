# infrastructure/source-grades.yaml
#
# Agent-queryable pre-assigned source reliability grades.
# Source of truth for doctrine is doctrine/INTEL-GRADING.md — this file
# is generated from that. Do not hand-edit without updating the doctrine.
#
# The grader reads this file for every finding to resolve source reliability.
# The collector reads this file to know which sources are active vs. disabled.

version: 1
last_updated: 2026-04-18
doctrine_version: "1.0.0"

# ============================================================================
# Government & Official Bodies
# ============================================================================
government_sources:
  - id: cisa-advisories
    name: "CISA Advisories"
    category: government
    grade: A
    active: true
    rationale: "Official U.S. gov, technically verified before publication"
    urls:
      - https://www.cisa.gov/news-events/cybersecurity-advisories
    rss: https://www.cisa.gov/cybersecurity-advisories/all.xml
  
  - id: cisa-kev
    name: "CISA Known Exploited Vulnerabilities"
    category: government
    grade: A
    active: true
    rationale: "Authoritative list of exploited CVEs with patch deadlines"
    urls:
      - https://www.cisa.gov/known-exploited-vulnerabilities-catalog
    json_feed: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  
  - id: nsa-cnsa
    name: "NSA / CNSA Advisories"
    category: government
    grade: A
    active: true
    rationale: "Authoritative, technically vetted"
    urls:
      - https://www.nsa.gov/Press-Room/Press-Releases-Statements/
  
  - id: fbi-flash
    name: "FBI Flash Alerts"
    category: government
    grade: A
    active: true
    rationale: "Law enforcement intelligence, operationally verified"
    urls:
      - https://www.ic3.gov/Media/News/Index
  
  - id: mitre-attack
    name: "MITRE ATT&CK"
    category: reference
    grade: A
    active: true
    rationale: "Curated, community-verified TTP knowledge base"
    urls:
      - https://attack.mitre.org/
  
  - id: dod-cmmc
    name: "DoD / CMMC Bulletins"
    category: government
    grade: B
    active: true
    rationale: "Official but sometimes delayed or sanitized"
  
  - id: nvd
    name: "NVD / CVE Database"
    category: reference
    grade: A
    active: true
    rationale: "Authoritative for the CVE record itself"
    urls:
      - https://nvd.nist.gov/

