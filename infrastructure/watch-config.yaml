      ServiceNow vendor self-disclosed REST API exploitation 2026-06-09 with
      CVE pending. Internal-aware since 2026-04-07 (63 days to public
      disclosure); patched 2026-06-05. Affected scope: Australia platform
      release + pre-Australia tenants with specific configuration changes.
      Single IPv4 IOC 51.159.98.241 per BleepingComputer originating (single-
      source veto applied on IOC layer). Three publisher-independent B-grade
      primaries converge on procedural facts (BleepingComputer + The Hacker
      News + SecurityWeek). Vendor advisory is access-gated to customer
      portal. Vendor attestation: "evidence of successful queries of instance
      tables against a subset of customers" (11 words, Hard Rule 6 preserved).
      No actor attribution per all three sources ("Unknown threat actors"
      per THN). Pattern observation parallel to gogs-argument-injection-
      2026-05-28: vendor-disclosed-with-CVE-pending → monitor for CVE
      assignment in defined window → CISA KEV addition pathway expected.
    active: true

