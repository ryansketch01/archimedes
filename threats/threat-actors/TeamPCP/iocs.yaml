# Malware families / campaign identifiers
# ============================================================================

  - id: teampcp-mini-shai-hulud
    type: malware_family
    value: "Mini Shai-Hulud"
    platform: "npm + PyPI registries; downstream SDLC consumers"
    description: >
      Self-propagating supply-chain worm; member of the Shai-Hulud
      family per MSTIC family attribution (MSTIC has not publicly named
      an actor for the family). Mini Shai-Hulud distinguishes from prior
      Shai-Hulud generations by: (1) self-propagating worm class vs. prior
      point-strike; (2) dual-ecosystem npm + PyPI propagation; (3) SLSA-
      attestation breakage; (4) Session-network exfiltration (vs. prior
      GitHub-hosted dead-drops); (5) PBKDF2 campaign-salt execution
      guardrails with Russian-locale check.
    first_seen: 2026-05-11
    related_campaign: "Mini Shai-Hulud (npm + PyPI worm)"
    source_brief: finding-2026-05-12-FLASH-0001

