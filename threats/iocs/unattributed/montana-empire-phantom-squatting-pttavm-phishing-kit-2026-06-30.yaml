hunt_queries:
  - id: montana-empire-hunt-sample-hashes
    platform: edr
    title: "Phantom-squatting artifacts — SHA256 retro-hunt (kit ZIP + APK)"
    query_type: pseudo_kql
    query: |
      DeviceFileEvents
      | where SHA256 in (
          "eb07edaa2786cfddfa4c15526168f2200d85300aee0a8f253b32d2462a7b0bcd",
          "2202a30daad9928ef47cca5f4ab04ce083692a94428e386fa01c2dd44557e34b"
        )
      | project DeviceId, AccountName, Timestamp, FileName, FolderPath, SHA256
    notes: >
      Consumer postal fraud — low prior for A&D-prime telemetry. Any hit
      still warrants triage (kit ZIP on a corporate host = investigation).

  - id: montana-empire-hunt-newly-registered-brandlike-domains
    platform: splunk
    title: "Phantom-squatting posture — internal resolution of freshly registered brand-lookalike domains"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes sourcetype=dns
      | eval brandlike=if(match(query, "(?i)(sandbox|admin|billing|api|portal|login)\.[a-z0-9-]+\.(com|net|org)"), 1, 0)
      | where brandlike=1
      | stats count values(query) as domains by src_ip, user
      | sort -count
    notes: >
      CONTEXTUAL, high-false-positive by design. Phantom-squatting defense is
      about newly-registered, zero-reputation domains reached via AI-assistant
      output. Pair with a newly-registered-domain (NRD) feed; do NOT block on
      this pattern alone. Tune to the prime's own brand/service namespace.
