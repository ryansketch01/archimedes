indicators: []

# ============================================================================
# Hunt Guidance — TTP/behavioral, NOT indicator-value-based
# ============================================================================
# These queries target the Icarus tradecraft PATTERN (third-party OAuth-
# integration abuse against Salesforce tenants), written generically. They
# reference NO fabricated indicator values. Expect false positives from
# legitimate automation; tune to your environment before operationalizing.
hunt_queries:

  - id: icarus-hunt-oauth-token-usage-anomaly
    platform: m365
    title: "Anomalous Salesforce connected-app OAuth token usage volume"
    query_type: pseudo
    query: |
      # Salesforce Event Monitoring / connected-app OAuth usage
      # Baseline normal per-integration API call volume per connected app,
      # then alert on volume spikes consistent with bulk extraction.
      source=salesforce_event_monitoring event=API OR event=RestApi
      | stats count AS api_calls by connected_app_name, client_ip, window="15m"
      | where api_calls > baseline_p99(connected_app_name)
      # FALSE POSITIVES: legitimate bulk sync, data-loader jobs, backup
      # integrations. Whitelist known high-volume integrations before alerting.
    related_ttp: [T1528, T1567]
    references: [finding-2026-06-19-0003]

  - id: icarus-hunt-python-urllib-user-agent-salesforce
    platform: m365
    title: "Non-browser (Python-urllib) user agents against Salesforce REST API"
    query_type: pseudo
    query: |
      # Salesforce API access logs — surface scripting user agents hitting
      # the REST API from an integration/app context.
      source=salesforce_api_logs
      | search user_agent="*python*" OR user_agent="*urllib*"
               OR user_agent="*curl*" OR user_agent="*Go-http-client*"
      | stats count by user_agent, connected_app_name, client_ip
      # PATTERN HINT ONLY — Python-urllib was referenced in Icarus reporting
      # as a defender-pattern hint, NOT a signature. FALSE POSITIVES: any
      # legitimate script-based integration. Correlate with volume anomaly
      # (icarus-hunt-oauth-token-usage-anomaly) before escalating.
    related_ttp: [T1528, T1567]
    references: [finding-2026-06-19-0003]

  - id: icarus-hunt-legacy-integration-credential-review
    platform: m365
    title: "Legacy / over-scoped connected-app inventory review"
    query_type: pseudo
    query: |
      # Enumerate connected apps and OAuth scopes; flag apps that are
      # unused, legacy, or over-scoped — the Icarus initial vector was a
      # compromised legacy integration-service credential.
      source=salesforce_connected_apps
      | eval stale = if(last_used_days > 90, "stale", "active")
      | table connected_app_name, oauth_scopes, last_used_days, stale, owner
      | where stale="stale" OR oauth_scopes="full" OR oauth_scopes="api refresh_token"
      # This is an AUDIT query, not a detection. Review output for apps to
      # revoke or re-scope; rotate legacy integration-service credentials.
    related_ttp: [T1078.004, T1199]
    references: [finding-2026-06-19-0003]
