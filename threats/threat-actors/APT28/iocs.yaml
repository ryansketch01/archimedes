# ============================================================================
# Hunt Queries
# ============================================================================
hunt_queries:

  - id: authentic-antics-persistence
    platform: windows_event_logs
    title: "Hunt for AUTHENTIC ANTICS persistence"
    query_type: eventlog
    query: |
      EventID=4657
      TargetObject="HKCU\\Software\\Microsoft\\Office\\16.0\\Outlook\\Logging\\*"
    related_malware: [AUTHENTIC ANTICS]

  - id: simpleloader-com-hijack
    platform: edr
    title: "Hunt for COM hijacking (SimpleLoader)"
    query_type: edr
    query: |
      clsid:{D9144DCD-E998-4ECA-AB6A-DCD83CCBA16D}
      OR process:explorer.exe AND dll_path:user_writable
      OR scheduled_task:OneDriveHealth
    related_malware: [SimpleLoader]

  - id: password-spray-m365
    platform: m365
    title: "Hunt for password spray (M365)"
    query_type: m365_signin
    query: |
      failed_logins > 300/hour
      AND distinct_accounts > 10
      AND source_ip IN (tor_exit_nodes OR known_vpn_ranges)

  - id: cloud-c2-process-context
    platform: edr
    title: "Hunt for cloud C2 abuse"
    query_type: edr
    query: |
      https_connection TO (filen.io, koofr.net, icedrive.net)
      AND process NOT IN (browser_processes, known_cloud_clients)
    related_malware: [CovenantGrunt]
