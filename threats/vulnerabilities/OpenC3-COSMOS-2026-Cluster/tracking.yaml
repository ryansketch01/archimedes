    note: >
      Single fix release closes all five CVEs. Full 7.0.0 release
      published the same day as the rc3.

mitigation_available: true
upgrade_tempo_caveat: >
  6.x → 7.0 is a major-version bump. Spacecraft-C2 environments
  commonly gate major upgrades behind mission-script regression-test
  campaigns and flight-software change-control boards (NASA-class
  change control commonly extends to 90+ days; mid-mission baselines
  may defer indefinitely until next launch / next mission phase).
  The federal-typical 30-day patch envelope may not apply when the
  patch is a major-version bump in a flight-relevant integration.
  Vendor has not published interim mitigations for pre-7.0.0 estates
  that cannot complete the upgrade in the federal-typical envelope.
  General least-privilege compensating controls are described in
  profile.md "Defense recommendations" but are not vendor-attested.

