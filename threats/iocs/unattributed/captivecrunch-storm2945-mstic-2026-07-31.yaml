first_seen: 2026-05-01            # MSTIC: campaign active since early May 2026
last_updated: 2026-07-31
admiralty_grade: A2               # MSTIC primary (A) + credibility 2 (single-source veto on attribution)
tlp: CLEAR

provenance:
  - source: "Microsoft Threat Intelligence (MSTIC) — CaptiveCrunch disclosure, 2026-07-31"
    url: https://www.microsoft.com/en-us/security/blog/2026/07/31/captivecrunch-midnight-blizzard-targets-travelers-worldwide-for-malware-delivery-and-credential-theft/
    note: >
      Originating primary. Publishes the 12 indicators below and designates the
      Storm-2945 cluster, assessed as a Midnight Blizzard (APT29) sub-cluster on
      overlap with Storm-2372 device-code tradecraft. Single originating primary
      on the attribution — WEP capped at likely (single-source veto).
  - source: "ReliaQuest (2026-07-23, provisional B)"
    note: >
      Partial corroborator — independently reported a portion of the
      doppelganger-domain / AitM device-code activity, but did NOT make the
      Storm-2945 -> Midnight Blizzard sub-cluster attribution. Corroborates the
      delivery layer only, not the actor binding.

notes: |
  Source finding: finding-2026-07-31-0002 (grader flash-grade-20260731-1800),
  delivered via FLASH brief flash-2026-07-31-1800.

  Two parallel strands per MSTIC:
    1. AitM credential/session theft — doppelganger domains impersonating
       Microsoft online services abusing the Entra ID device-code auth flow
       (T1621), leading to Entra device registration + M365 data collection.
       Consistent with Midnight Blizzard's Storm-2372 device-code tradecraft.
    2. Malware delivery — payloads posing as browser/OS updates, triggered by
       automated captive-portal connectivity checks, via ClickFix (T1204).
       Android APK delivery also observed.

  Tooling named by MSTIC (NOT atomic IOCs; carried for actor-profiler on fold):
    CornFlake (Golang Windows RAT), ChocoShell (PowerShell infostealer),
    FruitStone (C2 panel), plus an unnamed Android component.

  DISAMBIGUATION: 31.57.243.154 (this cluster) is NOT the tracked 31.57.35.223
  already in _master-index — different IOC, do not conflate.

  NOT Forest Blizzard: MSTIC flags TTP similarity to the APT28 (Forest Blizzard,
  #006) DNS-hijacking op but attributes CaptiveCrunch to Storm-2945 / Midnight
  Blizzard, NOT Forest Blizzard. Do NOT cross-walk the two ops.

  Hash->family bindings are collector best-effort pending full MSTIC IOC-appendix
  direct retrieval (an Android APK hash may exist beyond this partial extraction).

  Splunk first-party status (2026-07-31 18:00 FLASH sweep): 0 tracked-IOC hits in
  archimedes (2148 events/-90d, self-log only) and 0 in defenseclaw_local (0 events
  in window, visibility-bounded null). Hard Rule 8 — silence is not disconfirming.
  Retro-hunt the indicators below if EDR/DNS telemetry is available.

  A&D relevance: INDIRECT / STRUCTURAL. No named A&D-prime or watchlist victim —
  targeting is corporate travelers broadly. An ITAR/DIB executive transiting a
  compromised hotel/conference Wi-Fi is within the plausible victim envelope
  (session-token / credential theft -> M365 access).

