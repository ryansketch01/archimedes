      from raw-2026-06-10-pm-007 / finding-2026-06-10-0013. However,
      finding-2026-06-10-0013 ALREADY CARRIES the "~73,000 accounts"
      figure as its established scope anchor (digraph_layered:
      scope_73000_accounts_650000_messages_13_5gb_exfil_account_
      device_metadata: B2; finding body line 198: "~73,000 accounts
      had information exposed"). The pm-009 framing — "victim count
      firmed at over 73,000" — does NOT deliver materially new
      corpus content.

      Compounding the materiality failure, the BleepingComputer
      URL returned 404 on direct collector retrieval this sweep
      (pm-009 extraction notes "the dedicated BleepingComputer
      URL returned 404 on direct retrieval this sweep; relying
      on the RSS-listing snippet"). The substantive basis for
      this UPDATE is a single B-grade headline + RSS-listing
      snippet without direct article retrieval — a procedural
      retrieval quality caveat that compounds the materiality
      failure.

      Per the orchestrator's anti-noise discipline and the
      grader's materiality bar for UPDATE-class findings: an
      UPDATE that does not change the underlying scope figure,
      does not add attribution, does not add IOCs, and does not
      add a state transition does NOT merit an individual
      finding file. The appropriate disposition is to LEAVE
      finding-2026-06-10-0013 as canonical source-of-truth for
      the Tchap breach scope and to NOTE the pm-009 raw-signal
      as continuing-coverage signal for the briefer's anti-
      repetition logic without promoting a new finding.

      For the briefer: the Tchap breach was covered in the
      2026-06-10 afternoon brief (per finding-2026-06-10-0013
      published_in_briefs lineage if extended). The 12:00 FLASH
      sentinel (2026-06-12) also evaluated and confirmed no
      triggers fire. The appropriate disposition in the
      afternoon brief is either (a) one-sentence Other Signal
      mention or (b) silent omission per anti-noise. Operator
      preference: silent omission is acceptable; one-line
      mention is acceptable; promoting a new finding is NOT
      acceptable at this materiality.

      Hard Rule 2 binding constraint: PRESERVED. No actor
      attribution at any source layer.

      Per LEGAL-POLICY data-handling table: rejected finding +
      reasons retained 1 year (grader audit trail).
