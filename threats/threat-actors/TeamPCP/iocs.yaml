      authors with this exact email + commits adding suspicious
      package.json scripts = high-confidence detection signal for ongoing
      worm propagation. Note: also abused as Anthropic-brand-impersonation
      social engineering — same threat actor brand-confusion pattern as
      MacSync 2026-05-10 finding's claude.ai/share/... URL abuse.
    first_seen: 2026-05-11
