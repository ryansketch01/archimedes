hunt_queries:
  - id: captivecrunch-hunt-doppelganger-domains
    platform: splunk
    title: "CaptiveCrunch — internal resolution of doppelganger M365 domains"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes sourcetype=dns
      | where query IN ("ms365-device.com","ms365-live.com","m365-owa.com","owa-ms365.com")
      | stats count values(query) as domains by src_ip, user
      | sort -count
    notes: "Any hit = traveler funneled through actor AitM infrastructure. Investigate for Entra device-code registration."
  - id: captivecrunch-hunt-c2-ips
    platform: splunk
    title: "CaptiveCrunch — outbound to tracked C2 IPs"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      | where dest_ip IN ("31.57.243.154","38.146.28.75","38.146.28.132","104.194.159.150","107.189.26.194","213.145.86.112")
      | stats count by src_ip, dest_ip, dest_port
      | sort -count
    notes: "31.57.243.154 is CornFlake/FruitStone C2. Distinct from tracked 31.57.35.223."
  - id: captivecrunch-hunt-sample-hashes
    platform: edr
    title: "CaptiveCrunch — fake-update payload SHA256 retro-hunt"
    query_type: pseudo_kql
    query: |
      DeviceFileEvents
      | where SHA256 in (
          "918fa52ae45ed60ba7cc8bdc99c3cbe9ab92e0375ec31fc05d0d4513be11c593",
          "be99857449d2856dd5a84e21c8a3d5e0e01456adb44062ddec5a6b4970d8d42c"
        )
      | project DeviceId, AccountName, Timestamp, FileName, FolderPath, SHA256
    notes: "Payloads masquerade as browser/OS updates. A hit on a corporate traveler's device warrants immediate triage."
