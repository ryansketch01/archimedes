provenance:
  - source: finding-2026-05-07-0003
    note: >
      BleepingComputer (Bill Toulas, 2026-05-07) relaying Sophos research.
      Sophos hedges PlugX-operator overlap with "might be experimenting
      with a new payload" — explicitly does NOT attribute Beagle to
      APT41 or any other tracked PlugX-using cluster. Single-source
      single-vendor (Sophos via BleepingComputer); single-source veto
      applied at finding level; WEP capped at "likely." Hard Rule 2
      forbids Archimedes from upgrading the hedge to an attribution.

notes: |
  Beagle is a previously-undocumented Windows backdoor staged behind a
  counterfeit Anthropic / Claude AI distribution site (claude-pro[.]com).
  Targeting profile: software developers seeking Claude / Claude-Code
  tooling. Lure copy markets a "high-performance relay service designed
  specifically for Claude-Code developers."

  Distribution chain:
    1. Counterfeit site claude-pro[.]com offers Claude-Pro-windows-x64.zip
       (505 MB).
    2. ZIP contains an MSI installer.
    3. MSI drops signed G Data updater binary NOVupdate.exe (used for
       DLL-sideloading; legitimate binary repurposed).
    4. NOVupdate.exe sideloads avk.dll (malicious DLL).
    5. avk.dll loads NOVupdate.exe.dat (encrypted payload) — DonutLoader
       first stage.
    6. DonutLoader executes Beagle.

  Beagle command set: uninstall, cmd, upload, download, mkdir, rename,
  ls, rm. Consistent with a foothold-establishment backdoor; no native
  lateral-movement, credential-dumping, or persistence mechanisms in
  the published command catalog.

  C2: license[.]claude-pro[.]com over TCP/443 + UDP/8080, AES-encrypted,
  hosted on Alibaba Cloud range (8.217.190.58).

  Hedged-overlap caveat (PRESERVED, NOT promoted):
    Sophos quote: "The same operators behind PlugX might be
    experimenting with a new payload." PlugX is publicly observed across
    multiple China-nexus actors (APT41 / roster 019 plus others outside
    the Archimedes roster) and is not uniquely diagnostic of any one
    tracked actor. Recorded here as tooling-overlap context only.

  A&D-adjacency (inferential, NOT source-stated):
    - No A&D entity named as target. Sophos describes targeting as
      "software developers."
    - DIB primes and Tier-1/2 suppliers increasingly run AI coding
      assistants in dev toolchains; AI-brand-impersonation lures could
      scale across the industry.
    - Foothold on developer endpoints is a high-leverage pivot point
      (source repos, CI/CD credentials, signing keys).

  To migrate this cluster to actor-attributed:
    - Mandiant / CrowdStrike / Unit 42 / MSTIC publishes corroborating
      attribution to a roster actor (or names a new actor for
      /new-actor scaffolding)
    - First-party Splunk hit on these IOCs ties them to a roster actor's
      infrastructure or campaign
    - Second A/B-grade source independently confirms the PlugX-operator
      overlap with firmer attribution language

  First-party Splunk status at finding creation (2026-05-07): clean on
  dest_ip=8.217.190.58, domain=claude-pro.com, domain=license.claude-pro.com
  (last 7d, both archimedes and defenseclaw_local indices). Re-query
  warranted after master-index regeneration.

