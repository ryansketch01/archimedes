# threats/iocs/unattributed/cl-sta-1132.yaml
#
# Unattributed cluster — Unit 42's internal cluster designation for the
# activity exploiting CVE-2026-0300 (PAN-OS Captive Portal unauthenticated
# RCE, CVSS 9.3). Unit 42 characterizes CL-STA-1132 as "likely
# state-sponsored" but does NOT name a nation-state and does NOT cross-
# walk to any actor in the Archimedes _roster.yaml.
#
# Hard Rule 2 — Archimedes does not originate the cross-walk to a tracked
# actor. CL-STA-1132 is recorded as a vendor-internal cluster designation
# only. If Mandiant / Volexity / CrowdStrike / MSTIC publishes
# corroborating attribution, or if an A&D-sector victim is named, the
# IOC set may be migrated to a roster actor (or a /new-actor scaffold).

cluster_id: cl-sta-1132
cluster_name: "CL-STA-1132 (Unit 42 cluster — PAN-OS CVE-2026-0300 exploitation)"
first_seen: 2026-05-06
last_updated: 2026-05-09
admiralty_grade: A2
tlp: CLEAR

provenance:
  - source: finding-2026-05-07-FLASH-0001
    note: >
      Unit 42 IR-grade threat brief ("Threat Brief: Exploitation of
      PAN-OS Captive Portal Zero-Day for Unauthenticated Remote Code
      Execution," 2026-05-06). Unit 42 quote: "only limited
      exploitation." Two firewall devices compromised at one
      organization; no sector named. CL-STA-1132 is a Unit-42-internal
      cluster designation; Unit 42 explicitly characterizes the cluster
      as "likely state-sponsored" but names no nation-state and does
      NOT cross-walk to any tracked actor. Single-source IR observation
      at finding-creation time; single-source veto applied; WEP capped
      at "likely" on operational claim.

notes: |
  CL-STA-1132 is the Unit 42 cluster designation for the actor
  conducting limited exploitation of CVE-2026-0300 — an unauthenticated
  RCE in the PAN-OS User-ID Authentication Portal (Captive Portal),
  CVSS 9.3, added to CISA KEV on 2026-05-06. Patches: 2026-05-13 (first
  affected release line), 2026-05-28 (full coverage).

  Operational scope (per Unit 42 IR observation):
    - Two firewall devices compromised at a single organization
    - "Only limited exploitation" — direct quote
    - No sector identified; no A&D / DIB claim
    - No multi-victim claim

  Tradecraft signature (Unit 42 published TTPs — note: TTPs are
  defender-actionable knowledge but are NOT IOCs and live in the notes
  section, not the indicators list):
    - SAML authentication flood inducing PAN-OS HA failover to a
      secondary firewall device (operational evasion technique)
    - Systematic log sanitization including crash kernel messages and
      core dumps (anti-forensics)
    - Active Directory enumeration targeting domain root and
      DomainDnsZones objects (recon staging for downstream lateral
      movement)
    - Use of EarthWorm tunneling tool (publicly available
      Chinese-developed tunnel; tooling alone is not nation-state
      diagnostic)
    - Use of ReverseSocks5 v2.2.0 (open-source SOCKS5 reverse-tunnel
      tool) delivered via GitHub release URL

  Hedged-attribution caveat (PRESERVED, NOT promoted):
    Unit 42 calls CL-STA-1132 "likely state-sponsored" without naming
    a nation-state. EarthWorm is publicly available and is observed
    across multiple threat clusters. Tooling overlap alone does not
    constitute attribution. Hard Rule 2 forbids Archimedes from
    upgrading "likely state-sponsored" to a nation-state attribution
    or cross-walking to a roster actor.

  A&D-relevance:
    - PAN-OS firewalls are widespread in DIB perimeter architecture.
      An unauthenticated RCE on the management/captive-portal interface
      is a high-value foothold against any A&D environment running
      affected releases.
    - Unit 42 explicitly states no A&D sector targeting observed in
      the limited exploitation cluster. A&D relevance is therefore
      defensive (patch + hunt) rather than victim-confirmed.

  To migrate this cluster to actor-attributed:
    - Mandiant / Volexity / CrowdStrike / MSTIC publishes independent
      observation of CL-STA-1132 activity (matching IOCs / TTPs) with
      attribution language firmer than Unit 42's "likely state-
      sponsored"
    - A&D-sector or watchlist entity is named as a CL-STA-1132 victim
    - CL-STA-1132 is cross-walked to a tracked roster actor by an
      A-grade source
    - First-party Splunk hit on these IOCs ties them to a roster
      actor's infrastructure

  First-party Splunk status at finding creation (2026-05-07 00:18 EDT):
    Master-index swept, zero hits across 82 IPv4 + domain indicators
    (last 24h, archimedes index). The four CL-STA-1132 IPs and the
    GitHub URL were NOT in master-index at sweep time; re-query
    warranted post-master-index regeneration.

