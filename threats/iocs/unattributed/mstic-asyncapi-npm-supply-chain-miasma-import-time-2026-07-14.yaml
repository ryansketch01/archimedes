hunt_queries:
  - id: asyncapi-miasma-hunt-c2-ip
    platform: splunk
    title: "AsyncAPI/Miasma cluster — C2 85.137.53.71 hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_ip="85.137.53.71" OR src_ip="85.137.53.71"
        OR dest="85.137.53.71" OR url="*85.137.53.71*")
      | stats count by user, src_ip, dest_ip, dest_port, _time
      | sort -_time
    notes: >
      Live C2 on 8080/8081/8091. ANY hit from a defense-contractor
      environment warrants immediate developer-laptop EDR pivot and
      CI/CD-pipeline / lockfile review for the five poisoned versions.

  - id: asyncapi-miasma-hunt-packages
    platform: splunk
    title: "AsyncAPI/Miasma cluster — poisoned package-version hunt (lockfiles / registry logs)"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      ("@asyncapi/specs@6.11.2" OR "@asyncapi/specs@6.11.2-alpha.1"
        OR "@asyncapi/generator@3.3.1" OR "@asyncapi/generator-components@0.7.1"
        OR "@asyncapi/generator-helpers@1.1.1")
      | stats count by index, source, sourcetype, _time
      | sort -_time
    notes: >
      Any resolution / install of the five poisoned versions. Import-time
      loader means `--ignore-scripts` did NOT prevent execution — treat any
      hit as a compromised build host until proven otherwise.

