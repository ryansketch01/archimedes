[project]
name = "virustotal"
version = "0.1.0"
description = "VirusTotal MCP server for Archimedes — file/URL/domain/IP reputation lookups"
readme = "README.md"
authors = [
    { name = "Ryan", email = "ryansketch01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
]

[project.scripts]
virustotal = "virustotal:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
