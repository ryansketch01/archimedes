hunt_queries:
  - id: mstic-npm-hunt-x-secret-header
    platform: splunk
    title: "MSTIC 33-package npm cluster — X-Secret header hunt (highest-fidelity signal)"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      ("X-Secret: l95HdDaz3kQx1Zsg3WxH6HvKANf51RY1"
        OR header="*l95HdDaz3kQx1Zsg3WxH6HvKANf51RY1*"
        OR http_request_headers="*l95HdDaz3kQx1Zsg3WxH6HvKANf51RY1*")
      | stats count by user, src_ip, dest_host, http_user_agent, _time
      | sort -_time
    notes: >
      The X-Secret value is hardcoded into the postinstall stager. ANY
      outbound HTTP request carrying this header value, to ANY destination,
      is high-confidence malicious regardless of where the request is
      going. Single highest-fidelity detection in the cluster.

  - id: mstic-npm-hunt-c2-domain
    platform: splunk
    title: "MSTIC 33-package npm cluster — oob.moika.tech C2 hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_host="*oob.moika.tech" OR domain="*oob.moika.tech"
        OR query="*oob.moika.tech" OR url="*oob.moika.tech*")
      | stats count by user, src_ip, dest_host, url, _time
      | sort -_time
    notes: >
      oob.moika.tech is purpose-built C2 infrastructure for this campaign.
      ANY hit from a US defense contractor environment warrants immediate
      developer-laptop EDR pivot and CI/CD-pipeline review.

  - id: mstic-npm-hunt-spoofed-enterprise-metadata
    platform: splunk
    title: "MSTIC 33-package npm cluster — cloudplatform-single-spa.io spoofed-metadata hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_host="*cloudplatform-single-spa.io"
        OR query="*cloudplatform-single-spa.io"
        OR domain="*cloudplatform-single-spa.io")
      | stats count by user, src_ip, dest_host, _time
      | sort -_time
    notes: >
      github.* / docs.* / jira.* cloudplatform-single-spa.io subdomains
      are fake-enterprise-metadata hostnames referenced in malicious
      package.json files. Any resolution attempt indicates a developer
      pulled or processed one of the 33 malicious packages.

  - id: mstic-npm-hunt-maintainer-emails
    platform: splunk
    title: "MSTIC 33-package npm cluster — yandex.ru maintainer alias hunt"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      ("mr.4nd3r50n@yandex.ru" OR "ogvanta@yandex.ru" OR "t-in-one@yandex.ru"
        OR email="mr.4nd3r50n@yandex.ru" OR email="ogvanta@yandex.ru"
        OR email="t-in-one@yandex.ru")
      | stats count by index, source, sourcetype, _time
      | sort -_time
    notes: >
      Maintainer email aliases. Hit potentially indicates correspondence,
      package metadata cached locally, or attribution-research artifacts.
      Low-frequency strong signal.

  - id: mstic-npm-hunt-stager-behavior
    platform: edr
    title: "MSTIC 33-package npm cluster — postinstall hook behavioral hunt"
    query_type: pseudo_kql
    query: |
      DeviceProcessEvents
      | where InitiatingProcessFileName in ("node.exe", "node", "npm.exe", "npm")
        and (ProcessCommandLine contains "postinstall"
             or ProcessCommandLine contains "scripts/postinstall.js")
      | join (DeviceNetworkEvents
              | where RemoteUrl contains "oob.moika.tech"
                 or RemoteUrl contains "cloudplatform-single-spa.io")
        on DeviceId
      | project DeviceId, AccountName, Timestamp, ProcessCommandLine, RemoteUrl
    notes: >
      Behavioral correlation: postinstall hook execution chained with
      outbound HTTPS to either C2 host or spoofed-enterprise-metadata
      hostname. High-fidelity composite signal.

