# ============================================================================
# DNS-tunneling C2 patterns (TTP-level indicators)
# ============================================================================

  - id: apt34-dns-c2-pattern
    type: detection_pattern
    value: dns_tunneling_c2
    description: |
      APT34 toolkits (Helminth, BONDUPDATER, DNSpionage, Karkoff, Saitama) all
      use DNS as a C2 channel. Hunt indicator: anomalous outbound DNS query
      volume to atypical TLDs (.icu, .top, .tk, dynamic DNS providers) with
      high subdomain entropy. Not a static IOC; a behavioral hunt pattern.
    source_brief: cisco-talos-dnspionage-2019

# ============================================================================
# Compromised Exchange / IIS persistence patterns
# ============================================================================

  - id: apt34-rgdoor-iis-module
    type: detection_pattern
    value: rgdoor_iis_module
    description: |
      RGDoor persists as a custom IIS module providing covert C2 via HTTP
      cookies. Hunt: inventory IIS modules on perimeter web servers; alert
      on unsigned, new, or modified modules.
    source_brief: unit-42-rgdoor-2018

  - id: apt34-powerexchange-transport-agent
    type: detection_pattern
    value: exchange_transport_agent
    description: |
      PowerExchange installs as a custom Exchange transport agent. Hunt:
      inventory installed transport agents on Exchange servers; alert on
      unsigned or unfamiliar agents.
    source_brief: symantec-crambus-2023

# ============================================================================
# Hunt queries
# ============================================================================
hunt_queries:

  - id: apt34-hunt-dns-c2
    platform: splunk
    title: "Hunt for APT34 DNS-tunneling C2 patterns"
    query_type: spl
    query: |
      index=defenseclaw_local sourcetype=dns
      | eval subdomain_label=mvindex(split(query, "."), 0)
      | eval label_len=len(subdomain_label)
      | where label_len >= 30
      | stats count by src, query, label_len
      | sort - count
      # FP consideration: legitimate CDN, telemetry, AV vendor DNS may have
      # long subdomain labels — tune by allowlisting known-good resolvers.

  - id: apt34-hunt-exchange-transport-agent
    platform: edr
    title: "Hunt for unsigned or unfamiliar Exchange transport agents"
    query_type: pseudo
    query: |
      ON HOSTS WHERE role = exchange_server:
        ENUMERATE installed transport agents
        ALERT IF agent.signed = false OR agent.publisher NOT IN allowlist
      # FP consideration: legitimate hygiene/anti-spam vendors install agents.
      # Allowlist enterprise-approved publishers.

  - id: apt34-hunt-iis-module-integrity
    platform: edr
    title: "Hunt for new or modified IIS modules on perimeter web servers"
    query_type: pseudo
    query: |
      ON HOSTS WHERE role = web_server AND service = iis:
        BASELINE installed IIS modules with file hash
        ALERT IF new module added OR module file hash changed
        ALERT IF module is unsigned
      # FP consideration: legitimate patching/upgrades. Baseline must be
      # refreshed during scheduled change windows.

