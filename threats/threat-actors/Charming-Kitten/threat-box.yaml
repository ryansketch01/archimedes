        Charming Kitten's profile.md captures this distinction explicitly.
      sources: []
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Iran/IRGC-IO — willingness floor; no diplomatic brake if cluster pivoted to destructive ops."
    capability:
      score: 1
      label: not-capable
      novelty_modifier: 0
      evidence: |
        Capability=1 floor. No evidence of Charming Kitten destructive
        capability (wipers, integrity-corruption tooling) in the public
