notes: |
  Cloned variants of the publicly-leaked Shai-Hulud npm worm framework
  uploaded to npm registry weekend 2026-05-16/17 by npm account
  "deadcode09284814". Four malicious packages identified by Ox Security:
    - chalk-tempalte (typosquat on chalk-template)
    - @deadcode09284814/axios-util
    - axois-utils (typosquat on axios-utils; adds DDoS capability
      beyond Shai-Hulud clone baseline)
    - color-style-utils

  Tradecraft profile per Ox Security: "an almost exact copy of the
  leaked source code, with no obfuscation techniques" — script-kiddie-
  class derivative actor. Materializes the VT-006 carry-forward
  prediction of derivative attacks within 30 days of source-code
  release, at T+3 days.

  C2: 87e0bbc636999[.]lhr[.]life — LocalHost.run anonymizer tunneling
  subdomain pattern. Public anonymizer service is uninformative for
  actor-distinction signaling per analyst KAC A4.

  Hard Rule 2 binding constraint: clone-publisher npm account
  "deadcode09284814" is UNATTRIBUTED. Archimedes does NOT propagate
  TeamPCP attribution. Same restraint pattern as Socket / StepSecurity
  / Ox / Upwind four-firm UNATTRIBUTED consensus on node-ipc compromise
  (finding-2026-05-14-0009 + 2026-05-15-0005).

  To migrate this cluster to actor-attributed:
    - Mandiant / CrowdStrike / Unit 42 / MSTIC publishes corroborating
      attribution to a roster actor (or names a new actor for
      /new-actor scaffolding)
    - First-party Splunk hit on these IOCs ties them to a roster
      actor's infrastructure or campaign
    - Second-corpus research firm (Socket, StepSecurity, Wiz, Snyk,
      Upwind, SafeDep, Aikido, Semgrep) publishes independent telemetry
      naming the clone-publisher with firmer attribution

  First-party Splunk status at cluster creation (2026-05-18 16:00):
  44th consecutive dormant non-self-telemetry sweep. Zero external
  IOC hits on Shai-Hulud clone tokens, zero defenseclaw_local hits
  on C2 indicator or clone-publisher npm account. Silence is not
  disconfirming.

