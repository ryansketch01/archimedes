        not estimated upward without evidence.
      sources: []
    novelty:
      modifier: 0
      label: custom-advanced
      evidence: "N/A — no destructive capability scored."
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: "No first-party Splunk hits; no destructive-mode IOCs in published indicator set."
    final_intent: 1
    final_capability: 1
    composite: 2
    threat_level: LOW
    ioc_bonus_applied: 0

