  related_brief: null
  cluster_keying_principle: >
    Single cluster dossier keyed on the fix-version V2.17.1 boundary, not
    three per-CVE entries. Operational unit-of-tracking is "estate running
    RUGGEDCOM ROX II firmware before V2.17.1." All three CVEs share
    disclosure date (Siemens SSAs / NVD 2026-05-12), share fix release
    (V2.17.1), and Unit 42 documents them as a single exploitation chain.
    Matches the VT-005 OpenC3 COSMOS cluster precedent the finding cites.

