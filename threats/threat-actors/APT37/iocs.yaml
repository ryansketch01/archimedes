# threats/threat-actors/APT37/iocs.yaml
#
# Agent-queryable sidecar to iocs.md. Initial first-pass scaffold (2026-05-09)
# from finding-2026-05-07-0004 (ESET via The Record — BirdCall / Sqgame
# supply-chain campaign). Sparse by design — historical IOC appendices from
# FireEye/Mandiant 2018, Kaspersky 2016–2018, Cisco Talos 2017–ongoing, and
# Volexity 2021 ingest on next collector pass against APT37.
#
# Hard Rule 2: every indicator carries a source_brief reference back to its
# original public reporting; nothing here is Archimedes-originated.
#
# Hard Rule 4: no active scanning of Sqgame infrastructure performed at
# scaffold time. Passive-only enrichment per LEGAL-POLICY.md. Sqgame is NOT
# in authorized-targets.yaml.

actor_id: "024"
actor_name: APT37
last_updated: 2026-05-09
admiralty_grade: A2
tlp: CLEAR
source_of_record: iocs.md

ttl:
  network_infrastructure: 90    # days — domains/IPs expire from "active"
  file_hashes: 730              # hashes don't expire, may lose relevance
  registry: never               # TTP-level, persistent value
  scheduled_task: never
  cloud_service: never
  vulnerabilities: never        # CVEs are forever
  malware_family: never         # family identifiers are persistent
  targeting_pattern: never
  distribution_pattern: never

