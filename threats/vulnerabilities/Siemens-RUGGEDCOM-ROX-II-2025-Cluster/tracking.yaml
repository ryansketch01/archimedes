# ============================================================================
# A&D relevance
# ============================================================================

ad_relevance: medium
ad_relevance_tag: structural_unverified_exposure
ad_relevance_rationale: >
  STRUCTURAL, not victim-specific. RUGGEDCOM ROX II are hardened OT/industrial
  ethernet switches, structurally pervasive in industrial network estates.
  Tracked on the OT/ICS-in-A&D rationale the corpus applies to VT-005 (OpenC3
  COSMOS) and VT-010 (Yamcs). Per analyst KAC (A3, low confidence): NO evidence
  the target profile runs RUGGEDCOM ROX II — RUGGEDCOM core market is utility/
  rail/substation; an A&D prime OT estate may run different vendors (Cisco IE,
  Hirschmann, etc.). Exposure is inference from OT-appliance ubiquity, not
  observation. VT-005/VT-010 is a tracking rationale (A4), NOT evidence of A&D
  exposure — COSMOS/Yamcs are A&D mission-stack software; ROX II is general
  industrial gear. Held at medium / structural / unverified-exposure. Re-rate
  upward only on ITW, weaponized PoC, CISA ICS advisory, or actor attribution.

