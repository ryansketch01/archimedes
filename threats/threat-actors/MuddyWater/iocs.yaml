# behavioral / mechanism-level indicators carried per actor-profiler standard.
#
# ATTRIBUTION CAVEAT: Every indicator below is sourced from Rapid7's "moderate
# confidence" attribution. Single-source veto applies (SecurityWeek and
# BleepingComputer are pure relays). Two confidence constraints stack:
# vendor-self-rated moderate + single-source veto. 72-hour auto-downgrade
# clock registered (~2026-05-09 12:00 EDT). Indicators are NOT promoted as
# MuddyWater-canonical until a second A/B-grade vendor independently
# corroborates.

