# threats/briefs/_coverage-log.yaml
#
# Anti-repetition log. The briefer reads this before every brief to enforce
# the resurface rules in doctrine/INTEL-BRIEF-STANDARDS.md.
#
# Every item included in any brief gets an entry here. Before including
# something in a new brief, the briefer:
#   1. Loads this log
#   2. Checks if the topic has been covered within last 7 days
#   3. If yes, applies resurface_if conditions — include only if met
#   4. If included as resurface, flag with UPDATE: prefix

version: 1
last_updated: 2026-05-03

# ============================================================================
# Entry schema (for reference — no actual entries yet at scaffold time)
# ============================================================================
#
# entries:
#   - id: 2026-04-18-am-001
