    name: "Archimedes Splunk index"
    category: first_party
    grade_facts: A
    grade_attribution: A
    active: true
    rationale: "First-party observation on your network"
    host: localhost
    index: archimedes
  
  - id: splunk-defenseclaw
    name: "DefenseClaw via Splunk"
    category: first_party
    grade_facts: A
    grade_attribution: A
    active: true
    rationale: "First-party observation on your network"
    host: localhost
    index: defenseclaw_local

