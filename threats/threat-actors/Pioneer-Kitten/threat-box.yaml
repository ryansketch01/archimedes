scores:
  espionage:
    intent:
      score: 4
      label: ideology-association
      willingness_modifier: 0
      evidence: |
        Pioneer Kitten is an IRGC-aligned state-nexus actor whose state-intelligence
        track conducts high-volume network intrusions against US and allied targets
        "consistent with Iranian state intelligence objectives" (AA24-241A). This is
        ideologically/strategically-driven anti-Western state targeting — the
        Ideology-Association basis. The evidence-minimum for Intent=4 (1 A-grade
        source) is met by AA24-241A (FBI/CISA/DC3), which names "defense" among the
        US victim sectors, corroborated by CrowdStrike's IRGC-alignment framing and
        MITRE G0117's "suspected nexus to the Iranian government."
        Intent is NOT elevated to 5 (Target-Specific): NO A-grade source in the
        reporting reviewed for this build names a specific US A&D prime / DIB
        contractor victim. AA24-241A and MITRE name the "defense" SECTOR generically;
        Dragos names the "aerospace" SECTOR. Per the evidence-minimum table, Intent=5
        requires an A-grade source documenting targeting of the ad-prime-v1 SPECIFIC
        profile — sector-list attribution does not clear that bar. A&D relevance is
        STRUCTURAL/SECTOR-LEVEL. Directly parallels roster precedent: Handala (#014)
        and CyberAv3ngers (#028) both held at Ideology=4 on sector-only A&D relevance.
      sources: [cisa-fbi-dc3-aa24-241a-2024-08, mitre-g0117-vendor-cluster-2024, dragos-parisite]
    willingness:
      modifier: 0
      label: no-constraints
      evidence: "Iran / IRGC-linked — active US sanctions regime and sustained hostilities; no diplomatic constraints on cyber operations against US/Western targets."
    capability:
      score: 5
      label: significant
      novelty_modifier: 1
      evidence: |
        Multi-year, multi-source-documented espionage capability with active use
        inside 24 months. AA24-241A (A-grade US-gov) documents sustained state-
        intelligence intrusion operations; FortiGuard IR independently documents a
        ~2-year Middle East CNI espionage intrusion (May 2023 into early 2025,
        initial-access traces to 2021) deploying a novel custom backdoor arsenal
        (HanifNet, HXLibrary, NeoExpressRAT); Dragos documents access/recon
        operations; MITRE G0117 curates the cluster. Multiple A-grade sources AND
        documented active use within 24 months meets Cap=5 (Significant).
        Semi-custom novelty (-1) reduces final Capability to 4.
      sources: [cisa-fbi-dc3-aa24-241a-2024-08, fortiguard-lemon-sandstorm-cni-2025-05, dragos-parisite, mitre-g0117-vendor-cluster-2024]
    novelty:
      modifier: 1
      label: semi-custom
      evidence: "Blended toolkit: the CNI campaign deployed novel custom backdoors (HanifNet/HXLibrary/NeoExpressRAT — now identified/reverse-engineered by FortiGuard), but the actor's signature access phase relies on PUBLIC edge-device CVEs, China Chopper, and commodity tunnelers (ngrok/Havoc/Ligolo) for which defenders have signatures. -1 semi-custom is the honest defensive-difficulty call, weighted across the identified custom backdoors and the commodity access toolkit."
    ioc_corroboration:
      observed: false
      bonus_category: null
      note: "First-party Splunk sweep 2026-07-14: 0 hits over -90d across archimedes + defenseclaw_local on the full CVE/alias/persona set. Both indices live (archimedes 1725 events, defenseclaw_local 6 events / -90d). Visibility-bounded null — Frank is not a Pioneer Kitten victim env. No bonus."
