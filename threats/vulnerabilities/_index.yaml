    related_briefs: []                             # monitoring-tier; brief disposition per briefer
    chained_cve: CVE-2026-60137                    # author__not_in WP_Query SQL injection (per NVD description) — NOT separately tracked this pass
    nvd:
      directly_retrieved: 2026-07-18
      status_note: >
        NVD JSON API directly retrieved 2026-07-18 (vuln-tracker VW-001 creation).
        Description: REST API batch endpoint route-confusion (CWE-436) which,
        combined with the author__not_in WP_Query SQL injection (CVE-2026-60137),
