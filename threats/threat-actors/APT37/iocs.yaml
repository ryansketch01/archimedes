# ============================================================================
# Detection patterns (TTP-tier hunt patterns, not static IOCs)
# ============================================================================

  - id: apt37-detection-cloud-c2-pattern
    type: detection_pattern
    value: cloud_storage_c2_abuse
    description: |
      Anomalous outbound HTTPS volume to pCloud, Yandex Disk, Dropbox, Google
      Drive APIs from non-developer / non-marketing endpoints. High
      bidirectional volume from endpoints without business reason. Behavioral
      pattern; not a static IOC.
    source_brief: cisco-talos-rokrat-2017

  - id: apt37-detection-android-sideload-pattern
    type: detection_pattern
    value: android_sideload_managed_device
    description: |
      Sideload-warning behavior is the only friction between compromised
      Sqgame-pattern APK and victim infection. Hunt for non-Play app
      installations on managed Android devices with corporate access.
    source_brief: eset-via-the-record-2026-05-07

  - id: apt37-detection-hwp-execution-pattern
    type: detection_pattern
    value: hwp_execution_from_email
    description: |
      HWP file execution from email-delivered files in non-Korea-business-unit
      contexts. Behavioral hunt for atypical user-role HWP exposure.
    source_brief: cisco-talos-group123-2018

# ============================================================================
# Hunt queries
# ============================================================================
hunt_queries:

  - id: apt37-hunt-cloud-c2-volume
    platform: splunk
    title: "Hunt for APT37 cloud-storage C2 abuse (pCloud / Yandex Disk / Dropbox)"
    query_type: spl
    query: |
      index=defenseclaw_local sourcetype=proxy OR sourcetype=firewall
      | search dest_domain IN ("api.pcloud.com", "*.pcloud.com",
                                "cloud-api.yandex.net", "webdav.yandex.com",
                                "*.dropboxapi.com")
      | stats count, sum(bytes_out) as exfil_bytes by user, src_ip, dest_domain
      | where exfil_bytes > 10485760
      | sort - exfil_bytes
      # FP consideration: legitimate user use of pCloud/Yandex/Dropbox is
      # common. Tune by allowlisting known-business-purpose users; focus on
      # non-developer / non-marketing endpoints with high bidirectional
      # volume.

  - id: apt37-hunt-hwp-execution
    platform: splunk
    title: "Hunt for HWP execution from email (Korean-language spearphishing)"
    query_type: spl
    query: |
      index=defenseclaw_local sourcetype=endpoint
      | search (process_name="hwp.exe" OR process_name="Hwp70.exe"
                OR file_extension=".hwp" OR file_extension=".hwpx")
      | eval lure_origin = case(parent_process_name="OUTLOOK.EXE", "email",
                                 parent_process_name="chrome.exe", "browser",
                                 parent_process_name="firefox.exe", "browser",
                                 1=1, "other")
      | where lure_origin = "email"
      | stats count by user, host, file_path
      # FP consideration: legitimate business reasons for HWP files exist
      # for Korea-touching units. Tune by user-role / business-unit
      # allowlist.

  - id: apt37-hunt-strategic-web-compromise
    platform: pseudo
    title: "Strategic-website-compromise hunt (Korean-language news visit + endpoint persistence)"
    query_type: pseudo
    query: |
      JOIN proxy_logs WHERE dest_domain IN (<korean-language-news-site-list>)
      WITH endpoint_logs WHERE process_create OR file_create
      WITHIN 5 minutes of proxy_log.time
      GROUP BY user, host
      ALERT IF endpoint event includes new persistence (Run key, scheduled task)
             OR new outbound connection to non-news domain
      # FP consideration: legitimate Korean-language news consumption is
      # benign. Hunt for the COMBINATION of Korean-news visit + immediate
      # endpoint persistence event.

  - id: apt37-hunt-android-sideload-managed
    platform: edr
    title: "Mobile sideload posture review for managed Android devices"
    query_type: pseudo
    query: |
      ON ANDROID DEVICES under MDM:
        CHECK setting: install_unknown_sources
        ALERT IF install_unknown_sources = enabled for any user
        ENUMERATE installed apps NOT FROM Google Play
        ALERT IF any non-Play app installed in last 90 days
      # FP consideration: enterprise app stores and side-loaded LOB apps are
      # legitimate on managed devices. Tune by allowlisting known-good
      # enterprise sources. Focus on personal-profile / BYOD with corp
      # access.

  - id: apt37-hunt-rokrat-bluelight-process-pattern
    platform: edr
    title: "RokRAT / BLUELIGHT process-pattern hunt (Office/HWP → PowerShell → cloud C2)"
    query_type: pseudo
    query: |
      ON HOSTS:
        ALERT IF process tree:
          - Office product (winword.exe, excel.exe) OR HWP (hwp.exe)
          - spawns powershell.exe with encoded command (T1059.001 + T1027)
          - spawns child process making outbound connection to cloud-storage API
          WITHIN 60 seconds
      # FP consideration: legitimate macros that integrate with cloud
      # services are rare in normal corporate use. Tune by user role.

