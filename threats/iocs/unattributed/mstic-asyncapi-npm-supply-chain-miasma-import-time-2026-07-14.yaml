provenance:
  - source: finding-2026-07-16-0001-mstic-asyncapi-npm-supply-chain-compromise-miasma-import-time-oidc-provenance-abuse-a2-likely-single-source-veto
    note: >
      Microsoft Threat Intelligence (MSTIC) primary blog publication
      2026-07-15 — vendor-authority disclosure on own-product Defender
      detection telemetry plus npm takedown coordination. Cluster digraph
      A2 (single-source veto at the envelope level pending independent
      corroboration; individual procedural facts at A1). Assessed likely
      opportunistic and ecosystem-wide — no victimology or sector
      targeting reported; a targeted-A&D read is unlikely but not ruled
      out. No actor named (Hard Rule 2).

notes: |
  Mechanism (per MSTIC):
    1. A "pwn request" against `asyncapi/generator` — a misconfigured
       `pull_request_target` GitHub Actions workflow executed
       attacker-controlled PR code, exposing the `asyncapi-bot` PAT.
    2. Unauthorized pushes to the @asyncapi org followed. Legitimate OIDC
       release workflows then auto-published five poisoned package
       versions under the automated identity npm-oidc-no-reply@github.com
       — yielding artifacts with VALID provenance signatures built from
       UNAUTHORIZED source commits (provenance-trust abuse).
    3. The malicious versions run a Miasma loader at IMPORT time (module
       load), NOT via a postinstall hook — so `npm install --ignore-scripts`
       does NOT stop execution.
    4. The loader fetches an IPFS-hosted `sync.js` second stage and beacons
       to C2 85.137.53.71 on ports 8080/8081/8091 (LIVE at disclosure).

  CRITICAL DEFENSIVE NOTE — import-time execution defeats two common
  developer-side assumptions:
    - `--ignore-scripts` is NOT a mitigation here (import-time, not
      lifecycle-hook, execution).
    - Valid OIDC provenance is NOT proof of trustworthiness for these
      versions (built from unauthorized commits).
    MSTIC vendor mitigations (verbatim): remove all five affected
    versions; purge npm and Yarn caches; hunt for `sync.js` under NodeJS
    masquerade directories; block outbound to 85.137.53.71 on
    8080/8081/8091; rotate credentials reachable from any environment
    that imported the packages.

  A&D-nexus assessment:
    - NO named A&D victim and NO sector targeting — ecosystem-wide,
      opportunistic (likely). Relevance is STRUCTURAL / SDLC-exposure:
      `@asyncapi/specs` as a transitive dependency can reach A&D-prime and
      supplier SDLCs, CI/CD pipelines, and container builds.
    - Same dependency-graph-reach concern already logged for VT-006's
      `@squawk` aviation-namespace analysis.

  Splunk first-party status at finding creation (2026-07-16):
    Queried (defenseclaw_local OR archimedes) for C2 IP 85.137.53.71,
    "asyncapi", and "Miasma". Dormant. Hard Rule 8 — silence is NOT
    disconfirming, just absent.

  Relationship / lineage (Hard Rule 2 — no origination):
    - New deployment of the previously-documented Miasma runtime family
      (2026-06-03 "Miasma A1 origin" finding). Same-vendor MSTIC lineage;
      NOT independent corroboration of this compromise.
    - Structurally sibling to VT-006 (Mini Shai-Hulud) and VT-009 (Nx
      Console) supply-chain lineage; mechanism DIFFERS (import-time loader
      vs. self-propagating worm; Miasma vs. TeamPCP tooling; distinct C2).
      No attribution overlap — TeamPCP (#001) is NOT named here.

  To migrate this cluster to actor-attributed:
    - A second A/B-grade vendor (Mandiant / CrowdStrike / Unit 42 /
      SentinelOne / GTIG) independently corroborates with attribution to a
      roster actor.
    - First-party Splunk hit on 85.137.53.71 or a compromised package
      version ties to a roster actor's infrastructure.

