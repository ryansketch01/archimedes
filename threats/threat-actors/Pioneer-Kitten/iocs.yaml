hunt_queries:
  - id: pioneer-hunt-edge-cve-exploit
    platform: splunk
    title: "Pioneer Kitten edge/VPN CVE exploitation attempts"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=citrix* OR sourcetype=pan* OR sourcetype=fortinet*
        OR sourcetype=ivanti* OR sourcetype=pulse* OR sourcetype=f5* OR sourcetype=checkpoint*)
      | search ("CVE-2024-24919" OR "CVE-2024-3400" OR "CVE-2023-3519" OR "CVE-2019-19781"
        OR "CVE-2019-11510" OR "CVE-2020-5902" OR "CVE-2022-1388" OR "CVE-2018-13379"
        OR "CVE-2019-1579")
      | stats count by src_ip, dest, sourcetype
      # FP note: legitimate vuln scanners will also match CVE strings — correlate
      # with successful-exploit indicators (web-shell writes, anomalous auth) before escalating.

  - id: pioneer-hunt-tunneler-remote-access
    platform: edr
    title: "Unauthorized tunneling / remote-access utilities on or behind edge devices"
    query_type: pseudo-kql
    query: |
      DeviceProcessEvents
      | where FileName has_any ("ngrok.exe","ligolo.exe","frpc.exe","chisel.exe",
          "reversesocks5.exe","anydesk.exe","meshagent.exe","tvnserver.exe","plink.exe")
      | where InitiatingProcessFolderPath has_any ("\\inetpub\\","\\netscaler\\","\\tmp\\","\\temp\\")
      // FP note: AnyDesk/TightVNC may be sanctioned IT tools — exclude approved deployments.
      // Maps to T1572 (Protocol Tunneling) / T1219 (Remote Access Software).

  - id: pioneer-hunt-masquerading-scheduled-tasks
    platform: edr
    title: "Scheduled tasks masquerading as legitimate system jobs (FortiGuard persistence pattern)"
    query_type: pseudo-kql
    query: |
      DeviceEvents
      | where ActionType == "ScheduledTaskCreated"
      | where TaskName has_any ("Update","Microsoft","System","Windows")
        and InitiatingProcessAccountName != "SYSTEM"
      // FP note: baseline legitimate task creation first; alert on tasks pointing to
      // unsigned binaries in temp/web dirs. Maps to T1053.005 (HanifNet/HXLibrary/NeoExpressRAT).
