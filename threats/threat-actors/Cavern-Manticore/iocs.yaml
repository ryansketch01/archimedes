hunt_queries:
  - id: cavern-manticore-hunt-c2-domain
    platform: splunk
    title: "Cavern C2 domain in DNS / proxy / web logs"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=dns OR sourcetype=proxy OR sourcetype=stream:http)
        hospitalinstallation.com
      | stats count min(_time) as first_seen max(_time) as last_seen
              values(query) as queries values(url) as urls by src_ip, host
    false_positive_note: >
      Domain is distinctive; any hit warrants investigation. Confirm resolution to
      attacker infrastructure before acting.
    references_indicators: [cavern-manticore-domain-hospitalinstallation]

  - id: cavern-manticore-hunt-dll-sideload
    platform: edr
    title: "Cavern DLL side-load artifacts (Sysmon Image Loaded)"
    query_type: spl
    query: |
      index=defenseclaw_local (sourcetype=Sysmon EventCode=7)
        (ImageLoaded="*\\n-HTCommp.dll" OR ImageLoaded="*\\n-ten.dll"
         OR ImageLoaded="*\\n-sws.dll" OR ImageLoaded="*\\mhm.dll"
         OR ImageLoaded="*\\ode.dll" OR ImageLoaded="*\\db.dll"
         OR (ImageLoaded="*\\uxtheme.dll"
             AND NOT ImageLoaded="C:\\Windows\\System32\\uxtheme.dll"
             AND NOT ImageLoaded="C:\\Windows\\SysWOW64\\uxtheme.dll"))
      | stats count values(ImageLoaded) as dll_paths values(Image) as loading_process
              min(_time) as first_seen by host, User
    false_positive_note: >
      uxtheme.dll and db.dll are common names; query excludes legitimate System32/
      SysWOW64 uxtheme.dll load paths and relies on non-standard load locations.
      Tune db.dll against environment baseline. n-*.dll / mhm.dll / ode.dll are
      higher-fidelity. Maps to T1574.002 and T1036.005.
    references_indicators:
      - cavern-manticore-dll-uxtheme
      - cavern-manticore-dll-n-htcommp
      - cavern-manticore-dll-mhm
      - cavern-manticore-dll-db
      - cavern-manticore-dll-ode
      - cavern-manticore-dll-n-ten
      - cavern-manticore-dll-n-sws

