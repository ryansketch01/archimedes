    SINGLE originating US-gov primary on the load-bearing attribution + ransomware-
    enablement layer (FBI/CISA/DC3 AA24-241A); all the news relays (THN/SOC Prime/
    SOCRadar/Tenable) trace to that one CSA and are NOT independent corroboration of
    it. The VENDOR alias cluster (MITRE G0117 curated + Dragos PARISITE direct primary
    + CrowdStrike + Microsoft) provides genuine INDEPENDENT attribution corroboration
    on IDENTITY (the Fox Kitten/UNC757/Parisite/RUBIDIUM/Lemon Sandstorm equivalence),
    and FortiGuard IR is an independent second body documenting the recent CNI campaign
    + novel arsenal + suspected prepositioning. Net: identity attribution is well-
    corroborated across bodies (A1-shaped); the ransomware-affiliate specifics and the
    network IOC appendix rest on the single AA24-241A primary (which was reconstructed
    via relays this build and is pending direct retrieval), and FortiGuard is a first-
    corpus-surface provisional-A source pending human ratification. Overall confidence
    graded A2 to reflect the pending-direct-retrieval state of the two originating
    primaries and the single-primary basis of the ransomware-enablement/IOC layer.
    SINGLE-SOURCE DISCIPLINE: no single-source VETO applied to the CORE facts, because
    the identity cluster and the espionage/edge-exploitation capability are corroborated
    across multiple independent bodies (US-gov + MITRE + Dragos + FortiGuard). The
    single-primary caveat is applied specifically to (a) the ransomware-affiliate
    collaboration detail and (b) the network IOC appendix — both AA24-241A-only and
    pending direct retrieval.
    WEIGHTING NOTE: the overall MEDIUM (5.5) is driven by an espionage category HIGH
    (composite 8) AMPLIFIED by an unusually broad non-floor profile — disruptive (5),
    cyber-crime (5), destructive (4) are all non-floor because of the dual-track
    access-broker/ransomware-enabler model and the CNI-prepositioning signal. This
    VERSATILITY (breadth across four categories), not any single ceiling score, is what
    lifts Pioneer Kitten to parity with the top of the Iranian MEDIUM cluster. It
    calibrates at Peach Sandstorm (#027, 5.5) — reached by a different path: Peach is
    Intent=5 Target-Specific espionage-dominant (composite 9) with floors elsewhere,
    whereas Pioneer Kitten is Intent=4 Ideology espionage (composite 8, capped because
    no A&D prime named) but broader. Above UNC1549 (5.4), APT34 (4.9), and the Iranian
    LOW cluster (Charming Kitten 4.45, CyberAv3ngers 4.2, MuddyWater 4.15, Cavern
    Manticore 3.25). Pioneer Kitten is the ONLY roster Iranian actor with a genuine
    cyber-crime/ransomware-enablement dimension (composite 5).
    LIFT PATHS: (1) a named US A&D-prime / DIB victim in an A-grade source would lift
    espionage Intent toward Target-Specific (5) and could move the overall toward HIGH;
    (2) a CONFIRMED destructive/wiper event (vs the current suspected prepositioning)
