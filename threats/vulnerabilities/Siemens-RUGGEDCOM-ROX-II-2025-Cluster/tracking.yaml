# ============================================================================
# Patch and mitigation state
# ============================================================================

patch_status: patched
patch_release_date: 2026-05-12
patches:
  - release_date: 2026-05-12
    vendor: Siemens
    fixed_versions: ["V2.17.1"]
    covers_cves:
      - CVE-2025-40949
      - CVE-2025-40947
      - CVE-2025-40948
    note: "Single firmware release closes all three CVEs."

mitigation_available: true
mitigation_note: >
  Per Siemens SSAs (paraphrased): restrict management-plane / Web UI /
  JSON-RPC reachability to trusted administrative networks; follow Siemens
  RUGGEDCOM operational-security guidelines. All three CVEs are authenticated
  and network-reachable, so limiting management-surface reachability
  materially reduces pre-patch exposure.
patch_tempo_caveat: >
  OT/ICS gear is slow to patch in the field; vendor-fixed is not fleet-patched
  (analyst KAC assumption A5). Substation/rail/industrial switch firmware
  updates commonly gate behind maintenance windows and change-control.

