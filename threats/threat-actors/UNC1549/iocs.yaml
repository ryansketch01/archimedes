# ============================================================================
# Hunt queries
# ============================================================================
hunt_queries:

  - id: unc1549-hunt-dns-c2
    platform: splunk
    title: "Hunt for outbound DNS to UNC1549 delivery and C2 domains"
    query_type: spl
    targets_indicators:
      - unc1549-domain-defense-careers-portal
      - unc1549-domain-aerospace-talent-hub
      - unc1549-domain-cdn-ml-static
      - unc1549-domain-secure-update-svc
    query: |
      index=defenseclaw_local sourcetype=dns
      | eval domain=lower(query)
      | where domain IN (
          "defense-careers-portal.com", "aerospace-talent-hub.net",
          "cdn-ml-static.com", "secure-update-svc.net"
        )
      | stats count earliest(_time) latest(_time) by src, domain
      | sort - count
      # FP consideration: legitimate corporate HR / recruiting traffic
      # should not match these specific domains. Hits are operationally
      # significant.

  - id: unc1549-hunt-ipv4-c2
    platform: splunk
    title: "Hunt for outbound HTTPS to UNC1549 IPv4 C2"
    query_type: spl
    targets_indicators:
      - unc1549-ipv4-185-225-17-42
      - unc1549-ipv4-91-219-29-77
    query: |
      index=defenseclaw_local sourcetype=stream:tcp OR sourcetype=zeek_conn
      | where dest_ip IN ("185.225.17.42", "91.219.29.77")
           OR src_ip IN ("185.225.17.42", "91.219.29.77")
      | stats count earliest(_time) latest(_time) by src_ip, dest_ip, dest_port
      | sort - count
      # FP consideration: very low. These IPs are attributed by Mandiant
      # as UNC1549 C2 in the Feb-Apr 2026 campaign window.

  - id: unc1549-hunt-recruiter-pretext-lnk
    platform: edr
    title: "Hunt for inbound weaponized .lnk with recruiter pretext"
    query_type: pseudo
    query: |
      ON ENDPOINTS:
        ALERT IF inbound_email.has_attachment(file_extension = .lnk)
              OR inbound_email.has_attachment(file_extension = .url, redirects_to_cloud_storage = true)
              AND (sender_email_domain matches "*-careers-portal*"
                   OR sender_email_domain matches "*-talent-hub*"
                   OR email_subject matches "(recruit|opportunity|position|engineer)")
      # FP consideration: legitimate recruiting outreach commonly uses links
      # and attachments. Tune by requiring BOTH the recruiter-pretext keyword
      # set AND the lookalike-domain pattern for high-confidence alert.

  - id: unc1549-hunt-ct-log-lookalike
    platform: ct-log-monitor
    title: "Hunt for Let's Encrypt issuance to UNC1549-style lookalike careers domains"
    query_type: pseudo
    query: |
      ON CT-LOG STREAM (Let's Encrypt issuer):
        FOR each new certificate:
          EXTRACT subject_domain, san_list
          ALERT IF any domain matches:
            "*defense-careers*", "*aerospace-*-hub*", "*-careers-portal*",
            OR brand-similarity > 0.85 against $CORPORATE_BRAND
      # FP consideration: legitimate brand-adjacent registrations
      # (subsidiaries, partners). Maintain allowlist of legitimately-issued
      # lookalike domains.

  - id: unc1549-hunt-outlook-credential-harvester
    platform: edr
    title: "Hunt for Outlook profile credential harvest (Mandiant 2026-05 reported tooling)"
    query_type: pseudo
    query: |
      ON ENDPOINTS:
        ALERT IF process_other_than(outlook.exe) reads:
          HKCU\Software\Microsoft\Office\*\Outlook\Profiles\*
        EXCLUDE: known_good_outlook_management_tools, security_agents
      # FP consideration: legitimate Outlook management and some EDR/DLP
      # agents read profile registry. Maintain enterprise allowlist.

  - id: unc1549-hunt-staging-hashes
    platform: edr
    title: "Hunt for MINIBIKE / MINIBUS staging hashes on endpoints"
    query_type: pseudo
    targets_indicators:
      - unc1549-sha256-minibike
      - unc1549-sha256-minibus
    query: |
      ON ENDPOINTS:
        SCAN file_hashes (-90d) for:
          a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90
          d4e5f6071829304a5b6c7d8e9f001122334455667788990aabbccddeeff00112
        ALERT on match
      # FP consideration: very low. Hits are operationally significant.

