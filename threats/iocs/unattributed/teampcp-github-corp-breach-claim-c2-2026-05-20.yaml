hunt_queries:
  - id: ghcc-hunt-c2-domains
    platform: splunk
    title: "GitHub-corp breach C2 hunt — check.git-service.com + t.m-kosche.com"
    query_type: spl
    query: |
      index=defenseclaw_local OR index=archimedes
      (dest_host="*check.git-service.com" OR domain="*check.git-service.com"
       OR query="*check.git-service.com" OR dest_host="*git-service.com"
       OR domain="*git-service.com" OR query="*git-service.com"
       OR dest_host="*t.m-kosche.com" OR domain="*t.m-kosche.com"
       OR query="*t.m-kosche.com" OR dest_host="*m-kosche.com"
       OR domain="*m-kosche.com" OR query="*m-kosche.com")
      | stats count by user, src_ip, dest_host, _time
      | sort -_time
    notes: >
      Both C2 domains VT-confirmed malicious. check.git-service.com
      parent is long-dormant re-purposed; m-kosche.com parent is 5-day
      pre-incident NameSilo registration. Any hit on either parent or
      subdomain is high-fidelity malicious infrastructure contact.

  - id: ghcc-hunt-vscode-extension-inventory
    platform: edr
    title: "VS Code marketplace extension inventory hunt — A&D defender posture-baseline"
    query_type: pseudo_kql
    query: |
      DeviceFileEvents
      | where FolderPath has_any (".vscode/extensions", ".vscode-insiders/extensions",
                                   ".vscode-server/extensions", "%APPDATA%\\Code\\User\\extensions")
      | summarize installs=dcount(FileName), first_seen=min(Timestamp), last_seen=max(Timestamp) by DeviceId, FolderPath
      | sort by last_seen desc
    notes: >
      GitHub withheld the poisoned extension identifier; posture is
      inventory-and-baseline, NOT chase-a-named-extension (Hard Rule 3).
      Defender workflow: build known-good baseline of VS Code extensions
      across developer workstations, flag unfamiliar publishers, recent
      installs, elevated-permission extensions for analyst review.
