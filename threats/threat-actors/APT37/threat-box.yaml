      - MSS attribution: per ESET via The Record 2026 framing; earlier
        reporting attributed to "North Korean state interests" without
        specifying MSS vs. RGB. Scoring uses "DPRK state-aligned"
        confidence-tier (high, multi-vendor) rather than "MSS specifically"
        confidence-tier (lower, recent single-source framing).
      - A&D-prime targeting: NOT documented in public reporting. Espionage
        Intent=3 (not 5) reflects this honestly. The roster intake note's
        framing ("INDIRECT/STRUCTURAL relevance, A&D-direct targeting
        undocumented") binds the scoring to honest evidence.
      - Splunk first-party: zero hits over -30d on 2026-05-10 sweep across
        the primary search set. No IOC corroboration bonus applied to any
