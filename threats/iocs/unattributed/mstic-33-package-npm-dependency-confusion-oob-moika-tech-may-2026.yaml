# threats/iocs/unattributed/mstic-33-package-npm-dependency-confusion-oob-moika-tech-may-2026.yaml
#
# Unattributed cluster — IOCs published by Microsoft MSTIC (Microsoft Defender
# Security Research Team blog, 2026-05-29 20:06 EDT) covering the 33-malicious-
# npm-package dependency-confusion campaign with `oob.moika.tech` C2 gated by a
# hardcoded `X-Secret` HTTP header. MSTIC assesses operator-level attribution
# only ("three accounts operated by the same individual" with high confidence
# on forensic npm registry metadata) and explicitly declines APT / nation-state
# attribution. Per Hard Rule 2, Archimedes does NOT extend the attribution —
# the three maintainer aliases (`mr.4nd3r50n`, `ce-rwb`, `t-in-one`) are NOT
# in the Archimedes roster.
#
# Cluster captures the campaign envelope: 23 indicators across the C2 host,
# payload-delivery URLs, three maintainer email aliases, three npm publisher
# accounts, the X-Secret header gate value, nine spoofed npm scopes, three
# spoofed-enterprise-metadata hostnames, the behavior signature, and the
# postinstall stager filename. Sample SHA-256 hashes are NOT enumerated by
# MSTIC in the public blog post (packages removed pre-publication); none in
# this cluster.

