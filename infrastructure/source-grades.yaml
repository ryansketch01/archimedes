    category: media
    grade: B
    provisional: true
    provisional_since: 2026-05-14
    provisional_reason: "Second-cross-corroboration-cycle Archimedes-corpus citation as relay across multiple findings. Today's brief uses The Hacker News as relay on TWO independent items in 2026-05-14 morning brief: finding-2026-05-14-0002 (NGINX Rift, relay of SecurityWeek / F5 K000160932 with editorial '18-year dormancy' framing flagged as non-vendor-attested) + finding-2026-05-14-0003 (Fragnesia, relay of BleepingComputer / Zellic). Prior surfaces: finding-2026-05-13-FLASH-0001 (Bitdefender / FamousSparrow relay), finding-2026-05-13-FLASH-1800-0001 (Symantec / MuddyWater relay). Fast-cycle security media outlet on a par with BleepingComputer / SecurityWeek; conservative provisional B starting grade per same precedent as those peers. Editorial-amplification observed (NGINX Rift '18-year dormancy' framing not vendor-attested, also surfaced from depthfirst researcher commentary) is a flag — operator may downgrade to C if editorial-overreach pattern recurs on subsequent surfaces. Pending human ratification."
