ad_relevance_rationale: >
  OpenC3 COSMOS is spacecraft / satellite / constellation command-and-
  control software. Vendor-named user base includes NASA and BAE Systems
  (Tier-1 prime on aerospace-defense watchlist) alongside Astroscale,
  AST Space, MethaneSAT, Turion Space. SBSS satellite program heritage.
  Software function maps directly to the A&D-target profile from
  CLAUDE.md (aircraft, spacecraft, missile, defense systems R&D).
  Operational risk: COSMOS deployments at A&D primes typically sit in
  spacecraft-test-and-operations enclaves with reachability to live
  mission systems. Caveat: vendor user-base claim is single-source
  self-attestation; deployment density and version posture across the
